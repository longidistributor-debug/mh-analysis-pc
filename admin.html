<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MH Analysis Admin</title>
<style>
:root{--bg:#090b0e;--card:#12161b;--line:#2a3038;--text:#f6f7f8;--muted:#9aa6b2;--yellow:#ffd500;--danger:#ff5b68;--ok:#45d483}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% -20%,#2b2600 0,transparent 28%),var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}button,input{font:inherit}.wrap{max-width:1300px;margin:auto;padding:26px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}.brand{font-weight:900;font-size:26px;letter-spacing:.08em}.brand b{color:var(--yellow)}.sub,.muted{color:var(--muted);font-size:13px}.card{background:linear-gradient(180deg,#151a20,#101419);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 20px 60px #0005}.login{width:min(460px,92vw);margin:13vh auto}.login input,.formGrid input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0b0f13;color:#fff;margin:8px 0}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer;background:var(--yellow);color:#111}.btn.secondary{background:#212831;color:#fff;border:1px solid #303946}.btn.danger{background:#3a171c;color:#ffb9bf;border:1px solid #66252d}.btn.small{padding:7px 8px;font-size:11px}.grid{display:grid;grid-template-columns:340px 1fr;gap:18px}.formGrid{display:grid;gap:8px}.formGrid label{color:var(--muted);font-size:11px;font-weight:700}.tableWrap{overflow:auto}.users{width:100%;border-collapse:collapse;min-width:900px}.users th,.users td{padding:10px 8px;text-align:left;border-bottom:1px solid #242a31;vertical-align:top}.users th{font-size:11px;color:var(--muted);text-transform:uppercase}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900}.active{background:#143423;color:#78e3a5}.disabled{background:#3b171d;color:#ff8e98}.expired{background:#3a3011;color:#ffd95c}.actions{display:flex;gap:5px;flex-wrap:wrap}.msg{padding:10px 12px;border-radius:10px;margin:10px 0;display:none}.msg.show{display:block}.msg.err{background:#34151b;color:#ffb6bd}.msg.ok{background:#113222;color:#9ce8ba}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}.toolbar h2{margin:0}.activity{max-height:390px;overflow:auto}.event{padding:9px 0;border-bottom:1px solid #252b32}.event small{display:block;color:var(--muted);margin-top:4px}.hidden{display:none!important}@media(max-width:900px){.grid{grid-template-columns:1fr}.wrap{padding:14px}.top{align-items:flex-start;flex-direction:column}}
</style></head><body>
<div id="loginView" class="login card"><div class="brand"><b>MH</b> ANALYSIS</div><h1>Administrator</h1><p class="sub">Create users, renew access, reset devices and control licenses.</p><input id="adminSecret" type="password" autocomplete="current-password" placeholder="Admin secret"><button id="loginBtn" class="btn" style="width:100%">LOGIN</button><div id="loginMsg" class="msg"></div></div>
<div id="appView" class="wrap hidden"><div class="top"><div><div class="brand"><b>MH</b> ANALYSIS ADMIN</div><div id="statusLine" class="sub">License control</div></div><div class="actions"><button id="refreshBtn" class="btn secondary">REFRESH</button><button id="logoutBtn" class="btn secondary">LOGOUT</button></div></div><div id="globalMsg" class="msg"></div><div class="grid"><div><div class="card"><h2>Create User</h2><div class="formGrid"><label>USERNAME<input id="newUsername" autocomplete="off" placeholder="user001"></label><label>PASSWORD<input id="newPassword" autocomplete="new-password" placeholder="minimum 10 characters"></label><label>VALID FROM<input id="newFrom" type="date"></label><label>VALID UNTIL<input id="newUntil" type="date"></label><button id="createBtn" class="btn">CREATE USER</button></div></div><div class="card" style="margin-top:18px"><div class="toolbar"><h2>Activity</h2><button id="allActivityBtn" class="btn secondary small">ALL</button></div><div id="activityTitle" class="sub">Latest security events</div><div id="activity" class="activity"><div class="muted">Select a user or click ALL.</div></div></div></div><div class="card"><div class="toolbar"><h2>Users</h2><span id="userCount" class="sub"></span></div><div class="tableWrap"><table class="users"><thead><tr><th>User</th><th>Status</th><th>Validity</th><th>Device</th><th>Last Login</th><th>Actions</th></tr></thead><tbody id="usersBody"></tbody></table></div></div></div></div>
<script>
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('mh_admin_token')||'',users=[];
function msg(el,text,ok=false){el.textContent=text;el.className='msg show '+(ok?'ok':'err')}function clearMsg(el){el.className='msg';el.textContent=''}
async function api(path,opt={}){const headers={'Content-Type':'application/json',...(opt.headers||{})};if(token)headers.Authorization='Bearer '+token;const r=await fetch('/api/'+path,{...opt,headers});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.message||j.code||('HTTP '+r.status));e.code=j.code;throw e}return j}
function today(){return new Date().toISOString().slice(0,10)}function plusDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(v){if(!v)return'—';try{return new Date(v).toLocaleString()}catch{return String(v)}}
function render(){const t=today();$('userCount').textContent=users.length+' user(s)';$('usersBody').innerHTML=users.map(u=>{const st=u.status!=='active'?['DISABLED','disabled']:u.validUntil<t?['EXPIRED','expired']:['ACTIVE','active'];const dev=u.device?`${esc(u.device.machineName||'Bound')}<br><span class="sub">${esc((u.device.id||'').slice(0,14))}…</span>`:'<span class="muted">Not activated</span>';return `<tr><td><b>${esc(u.username)}</b></td><td><span class="badge ${st[1]}">${st[0]}</span></td><td>${esc(u.validFrom)} → ${esc(u.validUntil)}</td><td>${dev}</td><td>${esc(fmt(u.lastLogin))}</td><td><div class="actions"><button class="btn secondary small" onclick="activityFor('${esc(u.username)}')">ACTIVITY</button><button class="btn secondary small" onclick="dates('${esc(u.username)}','${esc(u.validFrom)}','${esc(u.validUntil)}')">DATES</button><button class="btn secondary small" onclick="password('${esc(u.username)}')">PASSWORD</button><button class="btn secondary small" onclick="device('${esc(u.username)}')">RESET DEVICE</button><button class="btn ${u.status==='active'?'danger':'secondary'} small" onclick="statusUser('${esc(u.username)}','${u.status==='active'?'disabled':'active'}')">${u.status==='active'?'DISABLE':'ENABLE'}</button><button class="btn danger small" onclick="delUser('${esc(u.username)}')">DELETE</button></div></td></tr>`}).join('')||'<tr><td colspan="6" class="muted">No users yet.</td></tr>'}
async function loadUsers(){const j=await api('admin/users');users=j.users||[];render();$('statusLine').textContent=`Server date: ${j.today} • ${j.timezone}`}
async function login(){clearMsg($('loginMsg'));try{const j=await api('admin/login',{method:'POST',body:JSON.stringify({secret:$('adminSecret').value})});token=j.token;sessionStorage.setItem('mh_admin_token',token);$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');await loadUsers();await activityFor('')}catch(e){msg($('loginMsg'),e.code==='database_not_configured'?'MongoDB is not configured yet. Add MONGODB_URI in Vercel and redeploy.':e.message)}}
async function createUser(){clearMsg($('globalMsg'));try{await api('admin/users',{method:'POST',body:JSON.stringify({username:$('newUsername').value,password:$('newPassword').value,validFrom:$('newFrom').value,validUntil:$('newUntil').value})});msg($('globalMsg'),'User created.',true);$('newUsername').value='';$('newPassword').value='';await loadUsers()}catch(e){msg($('globalMsg'),e.message)}}
async function mutate(u,b){await api('admin/users/'+encodeURIComponent(u),{method:'PATCH',body:JSON.stringify(b)});await loadUsers()}
async function statusUser(u,s){if(confirm(`${s==='disabled'?'Disable':'Enable'} ${u}?`))try{await mutate(u,{action:'set_status',status:s});msg($('globalMsg'),'Updated.',true)}catch(e){msg($('globalMsg'),e.message)}}
async function device(u){if(confirm(`Reset device for ${u}? Next successful login will bind a new device.`))try{await mutate(u,{action:'reset_device'});msg($('globalMsg'),'Device reset.',true)}catch(e){msg($('globalMsg'),e.message)}}
async function password(u){const p=prompt(`New password for ${u} (minimum 10 characters):`);if(p)try{await mutate(u,{action:'reset_password',password:p});msg($('globalMsg'),'Password reset; sessions revoked.',true)}catch(e){msg($('globalMsg'),e.message)}}
async function dates(u,f,t){const nf=prompt(`Valid FROM for ${u}:`,f);if(!nf)return;const nt=prompt(`Valid UNTIL for ${u}:`,t);if(!nt)return;try{await mutate(u,{action:'set_dates',validFrom:nf,validUntil:nt});msg($('globalMsg'),'Validity updated.',true)}catch(e){msg($('globalMsg'),e.message)}}
async function delUser(u){if(confirm(`Permanently delete ${u}?`))try{await api('admin/users/'+encodeURIComponent(u),{method:'DELETE'});msg($('globalMsg'),'User deleted.',true);await loadUsers()}catch(e){msg($('globalMsg'),e.message)}}
async function activityFor(u){try{const j=await api('admin/activity'+(u?'?username='+encodeURIComponent(u)+'&limit=100':'?limit=100'));$('activityTitle').textContent=u?'Security events for '+u:'Latest security events';$('activity').innerHTML=(j.activity||[]).map(a=>`<div class="event"><b>${esc(a.event)} ${a.username?'• '+esc(a.username):''}</b><small>${esc(fmt(a.at))}${a.ip?' • '+esc(a.ip):''}</small></div>`).join('')||'<div class="muted">No activity yet.</div>'}catch(e){$('activity').innerHTML='<div class="muted">'+esc(e.message)+'</div>'}}
Object.assign(window,{activityFor,statusUser,device,password,dates,delUser});$('loginBtn').onclick=login;$('adminSecret').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('createBtn').onclick=createUser;$('refreshBtn').onclick=()=>loadUsers().catch(e=>msg($('globalMsg'),e.message));$('allActivityBtn').onclick=()=>activityFor('');$('logoutBtn').onclick=()=>{sessionStorage.removeItem('mh_admin_token');location.reload()};$('newFrom').value=today();$('newUntil').value=plusDays(30);if(token){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');loadUsers().then(()=>activityFor('')).catch(()=>{sessionStorage.removeItem('mh_admin_token');location.reload()})}
</script></body></html>
