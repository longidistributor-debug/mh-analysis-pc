name: Publish V5625 Updater Channel

on:
  push:
    branches: [v56.25-release]
    paths:
      - '.github/workflows/publish-v5625-updater.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-updater:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v56.25-release
          fetch-depth: 0

      - name: Download verified V.56.25 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v5625" "$RUNNER_TEMP/pub"
          gh release download v56.25 \
            -p 'MH.Analysis.exe' \
            -p 'MH-Analysis-Setup-V.56.25.exe' \
            -D "$RUNNER_TEMP/v5625"
          test -s "$RUNNER_TEMP/v5625/MH.Analysis.exe"
          test -s "$RUNNER_TEMP/v5625/MH-Analysis-Setup-V.56.25.exe"
          cp "$RUNNER_TEMP/v5625/MH.Analysis.exe" "$RUNNER_TEMP/pub/MH Analysis.exe"
          cp "$RUNNER_TEMP/v5625/MH-Analysis-Setup-V.56.25.exe" "$RUNNER_TEMP/pub/MH-Analysis-Setup-V.56.25.exe"
          sha=$(sha256sum "$RUNNER_TEMP/pub/MH Analysis.exe" | awk '{print $1}')
          printf '%s  MH Analysis.exe\n' "$sha" > "$RUNNER_TEMP/pub/SHA256SUMS.txt"
          printf 'V.56.25\n' > "$RUNNER_TEMP/pub/VERSION"
          python - "$sha" "$RUNNER_TEMP/pub/update.json" <<'PY'
          import json,sys
          sha,out=sys.argv[1],sys.argv[2]
          data={
            "version":"V.56.25",
            "mandatory":True,
            "download_url":"https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%20Analysis.exe",
            "sha256":sha,
            "notes":"V.56.25 fixes auto-pending reliability, EA-owned SL Adjustment management, TP2 40% protected breakeven at Entry +/- $2.50, TP1 + $6.50 SL lock, Wilder RSI, post-signal-only TP/SL hit tracking, and balanced high-quality signal generation while preserving the existing strict safety gates."
          }
          with open(out,'w',encoding='utf-8',newline='\n') as f:
            json.dump(data,f,separators=(',',':'))
          PY

      - name: Publish production updater channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin mh-analysis-update-channel
          git checkout -B mh-analysis-update-channel origin/mh-analysis-update-channel
          cp "$RUNNER_TEMP/pub/MH Analysis.exe" './MH Analysis.exe'
          cp "$RUNNER_TEMP/pub/MH-Analysis-Setup-V.56.25.exe" './MH-Analysis-Setup-V.56.25.exe'
          cp "$RUNNER_TEMP/pub/update.json" update.json
          cp "$RUNNER_TEMP/pub/VERSION" VERSION
          cp "$RUNNER_TEMP/pub/SHA256SUMS.txt" SHA256SUMS.txt
          git add 'MH Analysis.exe' 'MH-Analysis-Setup-V.56.25.exe' update.json VERSION SHA256SUMS.txt
          git commit -m 'Publish MH Analysis V.56.25 updater' || true
          git push origin mh-analysis-update-channel

      - name: Verify live updater manifest and binary
        shell: bash
        run: |
          set -euo pipefail
          cb=$(date +%s%N)
          curl -fsSL -H 'Cache-Control: no-cache' "https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/update.json?cb=$cb" -o "$RUNNER_TEMP/live-update.json"
          python - "$RUNNER_TEMP/live-update.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['version']=='V.56.25', d
          assert d['mandatory'] is True, d
          assert d['download_url'].endswith('/mh-analysis-update-channel/MH%20Analysis.exe'), d
          print(d['sha256'])
          PY
          expected=$(python -c "import json;print(json.load(open('$RUNNER_TEMP/live-update.json'))['sha256'])")
          curl -fsSL -H 'Cache-Control: no-cache' "https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%20Analysis.exe?cb=$cb" -o "$RUNNER_TEMP/live.exe"
          actual=$(sha256sum "$RUNNER_TEMP/live.exe" | awk '{print $1}')
          test "$actual" = "$expected"
          liveVersion=$(curl -fsSL -H 'Cache-Control: no-cache' "https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/VERSION?cb=$cb" | tr -d '\r\n')
          test "$liveVersion" = 'V.56.25'
          echo 'LIVE V.56.25 UPDATER VERIFIED'
