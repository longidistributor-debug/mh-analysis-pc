name: Build and Publish MH Analysis V.05
on:
  workflow_dispatch:
  push:
    branches: [v02-restored-working-base]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Restore proven runtime and apply V.05 changes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python desktop/records_feature_patch.py
          python desktop/records_mt5_local_patch.py
          $mt5=Get-Content -Raw desktop/native_mt5_terminal_patch.py
          $mt5=$mt5.Replace("'\tidRecords       = 1003 // MH_RECORDS_V796_PATCH\n)'", "'\tidRecords       = 1103 // MH_RECORDS_V796_PATCH\n)'")
          $mt5=$mt5.Replace("'\tidRecords       = 1003 // MH_RECORDS_V796_PATCH\n\tidMT5           = 1004 // '+MARK+'\n)'", "'\tidRecords       = 1103 // MH_RECORDS_V796_PATCH\n\tidMT5           = 1104 // '+MARK+'\n)'")
          Set-Content -Encoding UTF8 desktop/native_mt5_terminal_patch.py $mt5
          python desktop/native_mt5_terminal_patch.py
          python desktop/native_mt5_prefill_patch.py
          python desktop/v03_exact_changes_patch.py
          python desktop/v03_wiring_patch.py
          python desktop/v04_keyboard_version_patch.py
          python desktop/v05_password_version_patch.py
      - name: Exact V.05 contract checks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $c=Get-Content -Raw chrome_host.go
          $a=Get-Content -Raw web/auth.js
          $ac=Get-Content -Raw web/auth.css
          $u=Get-Content -Raw updater.go
          $i=Get-Content -Raw web/index.html
          if((Get-Content -Raw VERSION).Trim() -ne 'V.05'){throw 'VERSION is not V.05'}
          if($u -notmatch 'mhPublicVersionV001 = "V.05"'){throw 'updater current version is not V.05'}
          if($i -notmatch 'id="mhUpdateVersionV001">V.05<'){throw 'V.05 update UI identity missing'}
          if($a -notmatch 'id="mhLicensePass" type="text" class="mhSecurePasswordInput"'){throw 'V.05 password input fix missing'}
          if($ac -notmatch 'webkit-text-security:disc'){throw 'password masking missing'}
          if($c -notmatch 'chAttachThreadInput'){throw 'V.04 keyboard input fix missing'}
          if($c -notmatch 'chEXToolWindow'){throw 'taskbar suppression missing'}
          Write-Host 'PASS exact V.05 requested contract'
      - name: Syntax and compile
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check web/auth.js
          node --check web/v03.js
          node --check web/records.js
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          if(-not(Test-Path 'dist/MH Analysis.exe')){throw 'EXE missing'}
      - name: Runtime startup smoke test
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:MH_SMOKE_TEST='1'
          $p=Start-Process -FilePath (Resolve-Path 'dist/MH Analysis.exe') -PassThru
          Start-Sleep -Seconds 10
          if($p.HasExited){throw "Application exited during startup with code $($p.ExitCode)"}
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - name: Build V.05 installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not(Test-Path $iscc)){choco install innosetup --no-progress -y}
          $iss=Get-Content -Raw 'installer/MHAnalysis-V04.iss'
          $iss=$iss.Replace('V.04','V.05').Replace('MH Analysis V.04.exe','MH Analysis V.05.exe')
          Set-Content -Encoding UTF8 'installer/MHAnalysis-V05.iss' $iss
          & $iscc 'installer/MHAnalysis-V05.iss'
          if($LASTEXITCODE -ne 0){throw 'installer build failed'}
          $installer=Get-ChildItem -Recurse -Filter 'MH Analysis V.05.exe' | Select-Object -First 1
          if(-not $installer){throw 'V.05 installer output not found'}
          Copy-Item $installer.FullName 'dist/MH-Analysis-V05-Installer.exe' -Force
      - name: Publish mandatory V.05 update channel for existing V.04 users
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $sha=(Get-FileHash 'dist/MH Analysis.exe' -Algorithm SHA256).Hash.ToLower()
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin mh-analysis-update-channel
          git worktree add update-channel origin/mh-analysis-update-channel
          Copy-Item 'dist/MH Analysis.exe' 'update-channel/MH-Analysis-V05.exe' -Force
          $manifest=[ordered]@{version='V.05';mandatory=$true;download_url='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH-Analysis-V05.exe';sha256=$sha;notes='MH Analysis V.05 password input fix.'}
          $json=$manifest | ConvertTo-Json
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'update-channel/update.json'),$json,(New-Object System.Text.UTF8Encoding($false)))
          Push-Location update-channel
          git add MH-Analysis-V05.exe update.json
          git commit -m 'Publish mandatory MH Analysis V.05 update'
          git push origin HEAD:mh-analysis-update-channel
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V05-Final
          path: |
            dist/MH-Analysis-V05-Installer.exe
            dist/MH Analysis.exe
          retention-days: 90
