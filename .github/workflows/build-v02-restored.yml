name: Build and Publish MH Analysis V.07
on:
  workflow_dispatch:
  push:
    branches: [v02-restored-working-base]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Apply and permanently promote V.07
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if((Get-Content -Raw VERSION).Trim() -eq 'V.06'){ python desktop/v07_single_taskbar_patch.py }
      - name: V.07 contract checks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $c=Get-Content -Raw chrome_host.go
          $a=Get-Content -Raw web/auth.js
          $u=Get-Content -Raw updater.go
          $i=Get-Content -Raw web/index.html
          if((Get-Content -Raw VERSION).Trim() -ne 'V.07'){throw 'VERSION is not V.07'}
          if($u -notmatch 'mhPublicVersionV001 = "V.07"'){throw 'updater is not V.07'}
          if($i -notmatch 'id="mhUpdateVersionV001">V.07<'){throw 'V.07 UI identity missing'}
          if($a -notmatch 'id="mhLicenseUser" type="text"'){throw 'username input missing'}
          if($a -notmatch 'id="mhLicensePass" type="text" class="mhSecurePasswordInput"'){throw 'password input missing'}
          if($c -notmatch 'start-minimized'){throw 'child browser hidden startup missing'}
          if($c -notmatch 'time.Sleep\(1200 \* time.Millisecond\)'){throw 'secondary child delayed startup missing'}
          Write-Host 'PASS V.07 single-window/no-flicker contract'
      - name: Syntax and compile
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check web/auth.js
          node --check web/v03.js
          node --check web/records.js
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          if(-not(Test-Path 'dist/MH Analysis.exe')){throw 'EXE missing'}
      - name: Runtime startup smoke test
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:MH_SMOKE_TEST='1'
          $p=Start-Process -FilePath (Resolve-Path 'dist/MH Analysis.exe') -PassThru
          Start-Sleep -Seconds 12
          if($p.HasExited){throw "Application exited during startup with code $($p.ExitCode)"}
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - name: Build V.07 installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not(Test-Path $iscc)){choco install innosetup --no-progress -y}
          $iss=Get-Content -Raw 'installer/MHAnalysis-V04.iss'
          $iss=$iss.Replace('V.04','V.07').Replace('MH Analysis V.04.exe','MH Analysis V.07.exe')
          Set-Content -Encoding UTF8 'installer/MHAnalysis-V07.iss' $iss
          & $iscc 'installer/MHAnalysis-V07.iss'
          if($LASTEXITCODE -ne 0){throw 'installer build failed'}
          $installer=Get-ChildItem -Recurse -Filter 'MH Analysis V.07.exe' | Select-Object -First 1
          if(-not $installer){throw 'V.07 installer output not found'}
          Copy-Item $installer.FullName 'dist/MH-Analysis-V07-Installer.exe' -Force
      - name: Publish mandatory V.07 update
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $sha=(Get-FileHash 'dist/MH Analysis.exe' -Algorithm SHA256).Hash.ToLower()
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin mh-analysis-update-channel
          git worktree add update-channel origin/mh-analysis-update-channel
          Copy-Item 'dist/MH Analysis.exe' 'update-channel/MH-Analysis-V07.exe' -Force
          $manifest=[ordered]@{version='V.07';mandatory=$true;download_url='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH-Analysis-V07.exe';sha256=$sha;notes='MH Analysis V.07 single taskbar icon and no-flicker startup/shutdown fix.'}
          $json=$manifest | ConvertTo-Json
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'update-channel/update.json'),$json,(New-Object System.Text.UTF8Encoding($false)))
          Push-Location update-channel
          git add MH-Analysis-V07.exe update.json
          git commit -m 'Publish mandatory MH Analysis V.07 update'
          git push origin HEAD:mh-analysis-update-channel
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V07-Final
          path: |
            dist/MH-Analysis-V07-Installer.exe
            dist/MH Analysis.exe
          retention-days: 90
# clean V.07 build trigger
