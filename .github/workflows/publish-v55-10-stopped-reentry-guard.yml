name: Publish MH Analysis V.55.10 Stopped Setup Re-entry Guard

on:
  push:
    branches: [records-mt5-local-build]
    paths:
      - 'vercel-auth/trigger-v5510-retry'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Apply isolated V.55.10 stopped-out re-entry guard
        shell: powershell
        run: python scripts/v5510_stopped_setup_reentry_guard.py

      - name: Verify isolated signal guard and current behavior
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if((Get-Content -Raw VERSION).Trim() -ne 'V.55.10'){throw 'VERSION mismatch'}
          $a=Get-Content -Raw web/app.js
          foreach($m in @('persistStoppedSetupV5510','applyStoppedSetupReentryGuardV5510','same failed entry zone','if(prev&&signalTouched(c,prev,''sl''))','else if(slHit){persistStoppedSetupV5510')){if(-not $a.Contains($m)){throw "re-entry guard missing: $m"}}
          $u=Get-Content -Raw updater.go
          $l=Get-Content -Raw license_auth.go
          if(-not $u.Contains('mhPublicVersionV001 = "V.55.10"')){throw 'updater mismatch'}
          if(-not $l.Contains('licAppVersion = "V.55.10"')){throw 'license version mismatch'}
          node --check web/app.js
          node --check web/runtime-fixes.js
          node --check web/update-v001.js
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'tests failed'}

      - name: Commit V.55.10 source safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app.js VERSION updater.go license_auth.go web/index.html
          git commit -m 'V.55.10 block immediate reuse of stopped-out signal setup' || true
          # Another workflow may have moved the branch while this job was running.
          # Rebase our isolated commit instead of failing with a non-fast-forward push.
          git pull --rebase origin records-mt5-local-build
          git push origin HEAD:records-mt5-local-build

      - name: Build EXE and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          sha256sum 'dist/MH Analysis.exe' | tee dist/SHA256SUMS.txt
          HASH=$(awk '{print $1}' dist/SHA256SUMS.txt)
          printf 'V.55.10\n' > dist/VERSION
          cat > dist/update.json <<EOF
          {"version":"V.55.10","mandatory":true,"download_url":"https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%20Analysis.exe","sha256":"$HASH","notes":"V.55.10 prevents a stopped-out setup from being immediately issued again at the same failed entry zone. A new opposite setup or a meaningful fresh entry-zone/structure shift is required before re-entry. Existing TP/SL post-signal tracking, device binding, session, MT5, EA, WhatsApp and other behavior are retained."}
          EOF

      - name: Install Inno Setup
        shell: powershell
        run: |
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not(Test-Path $iscc)){choco install innosetup -y --no-progress}
          if(-not(Test-Path $iscc)){throw 'ISCC unavailable'}

      - name: Build installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          New-Item -ItemType Directory -Force dist-installer|Out-Null
          $src=(Resolve-Path 'dist\MH Analysis.exe').Path
          $out=(Resolve-Path dist-installer).Path
          & $iscc '/Qp' "/DMySourceExe=$src" "/DMyOutputDir=$out" '/DMyAppVersion=V.55.10' '/DMyOutputBaseFilename=MH-Analysis-Setup-V.55.10' 'installer\MHAnalysis-V01.iss'
          if($LASTEXITCODE -ne 0){throw 'ISCC failed'}
          if(-not(Test-Path 'dist-installer\MH-Analysis-Setup-V.55.10.exe')){throw 'installer missing'}

      - name: Package
        shell: powershell
        run: Compress-Archive -Path 'dist\MH Analysis.exe','dist\SHA256SUMS.txt','dist\update.json','dist\VERSION','dist-installer\MH-Analysis-Setup-V.55.10.exe' -DestinationPath 'dist\MH-Analysis-V.55.10.zip' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V.55.10
          path: |
            dist/MH Analysis.exe
            dist/MH-Analysis-V.55.10.zip
            dist/SHA256SUMS.txt
            dist/update.json
            dist/VERSION
            dist-installer/MH-Analysis-Setup-V.55.10.exe
          if-no-files-found: error

      - name: Publish mandatory updater channel
        shell: bash
        run: |
          set -euo pipefail
          cp 'dist/MH Analysis.exe' "$RUNNER_TEMP/MH Analysis.exe"
          cp dist/update.json "$RUNNER_TEMP/update.json"
          cp dist/VERSION "$RUNNER_TEMP/VERSION"
          cp dist/SHA256SUMS.txt "$RUNNER_TEMP/SHA256SUMS.txt"
          cp 'dist-installer/MH-Analysis-Setup-V.55.10.exe' "$RUNNER_TEMP/MH-Analysis-Setup-V.55.10.exe"
          git checkout --orphan __v5510
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP/MH Analysis.exe" './MH Analysis.exe'
          cp "$RUNNER_TEMP/update.json" update.json
          cp "$RUNNER_TEMP/VERSION" VERSION
          cp "$RUNNER_TEMP/SHA256SUMS.txt" SHA256SUMS.txt
          cp "$RUNNER_TEMP/MH-Analysis-Setup-V.55.10.exe" './MH-Analysis-Setup-V.55.10.exe'
          git add .
          git commit -m 'MH Analysis V.55.10 stopped setup re-entry guard release'
          git push --force origin HEAD:mh-analysis-update-channel
