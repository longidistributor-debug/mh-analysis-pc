name: Build V80.8 Stable Device View Hardened

on:
  workflow_dispatch:
  push:
    branches: [records-mt5-local-build]
    paths: ['vercel-auth/trigger-v808c']

permissions:
  contents: write

concurrency:
  group: mh-analysis-v808c-stable-device-view
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Apply retained patches plus V80.8 stable identity and repaint
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          function Patch([string]$p){ python $p; if($LASTEXITCODE -ne 0){ throw "Patch failed: $p" } }
          foreach($p in @(
            'desktop/branding_text_patch.py',
            'desktop/header_center_layout_patch.py',
            'desktop/records_feature_patch.py',
            'desktop/chart_reset_only_patch.py',
            'desktop/native_mt5_terminal_patch.py',
            'desktop/native_button_id_fix_patch.py',
            'desktop/ea_signal_reader_bridge_patch.py',
            'desktop/records_mt5_local_patch.py',
            'desktop/signal_duplicate_guard_patch.py',
            'desktop/license_auth_patch.py',
            'desktop/window_flicker_fix_patch.py',
            'desktop/license_login_focus_patch.py',
            'desktop/license_v803_patch.py',
            'desktop/license_v804_patch.py',
            'desktop/license_v806_runtime_fix_patch.py',
            'vercel-auth/license_v807_auth_loader_patch.py',
            'desktop/license_v808_device_identity_patch.py',
            'desktop/license_v808_view_repaint_patch.py'
          )){ Patch $p }
          if(Test-Path 'exness_bridge.go'){ Remove-Item 'exness_bridge.go' -Force }
          node --check web/app.js
          node --check web/records.js
          node --check web/auth.js

      - name: Source guards
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $license=Get-Content -Raw license_auth.go
          $hostSrc=Get-Content -Raw chrome_host.go
          $main=Get-Content -Raw main.go
          $app=Get-Content -Raw web/app.js
          $html=Get-Content -Raw web/index.html
          $records=Get-Content -Raw web/records.html
          $recordsJs=Get-Content -Raw web/records.js
          $localRecords=Get-Content -Raw records_mt5_local.go
          $eaBridge=Get-Content -Raw ea_signal_bridge.go
          $authJs=Get-Content -Raw web/auth.js
          $authCss=Get-Content -Raw web/auth.css
          $support=Get-Content -Raw license_support_external.go
          foreach($m in @('licAppVersion = "80.8"','MH_SECURE_LICENSE_V808','licReadMachineGuid','MachineGuid','licSystemVolumeSerial','licDeterministicDevice','ed25519.NewKeyFromSeed','licDeviceMem','persistence is best-effort')){if(-not $license.Contains($m)){throw "device identity missing $m"}}
          foreach($m in @('MH_ANALYSIS_REPAINT_V808','chRedrawWindow','unique directory','650 * time.Millisecond')){if(-not $hostSrc.Contains($m)){throw "repaint hardening missing $m"}}
          foreach($m in @('MH_NATIVE_MT5_TERMINAL_V796','MT5 System','chEnsureMT5Terminal')){if(-not $hostSrc.Contains($m)){throw "MT5 regression $m"}}
          foreach($m in @('MH_RECORDS_MT5_LOCAL_V797','/api/records-v2')){if(-not ($localRecords.Contains($m)-or$main.Contains($m)-or$recordsJs.Contains($m))){throw "Records regression $m"}}
          foreach($m in @('MH_SAME_SIGNAL_GUARD_V799','checkSameSignalV799')){if(-not ($localRecords.Contains($m)-or$app.Contains($m))){throw "duplicate regression $m"}}
          if(-not $html.Contains('MH_AUTH_GATED_APP_LOADER_V807')){throw 'gated loader regression'}
          if(-not $authJs.Contains('showChecking')){throw 'verify-first auth regression'}
          if(-not $hostSrc.Contains('chWMShutdownDone')){throw 'async exit regression'}
          if($authCss.Contains('overflow-y:auto')){throw 'login scroll regression'}
          if(-not $main.Contains('/api/license/support/open')-or-not $support.Contains('FileProtocolHandler')){throw 'support regression'}
          if(Test-Path 'exness_bridge.go'){throw 'exness bridge must not compile'}
          Write-Host 'PASS V80.8 source guards'

      - name: Same-device repeated-login regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          //go:build windows
          package main
          import("os";"testing")
          func TestSameDeviceIdentityV808(t *testing.T){
            root:=t.TempDir();t.Setenv("LOCALAPPDATA",root+"\\local")
            licDeviceMem=nil
            d1,e:=licEnsureDevice();if e!=nil{t.Fatal(e)}
            d2,e:=licEnsureDevice();if e!=nil||d2.ID!=d1.ID{t.Fatalf("same-run id changed")}
            licDeviceMem=nil;_=os.Remove(licDevicePath());_=os.WriteFile(licDevicePath(),[]byte("corrupt"),0600)
            d3,e:=licEnsureDevice();if e!=nil||d3.ID!=d1.ID{t.Fatalf("restart id changed: %v",e)}
            licDeviceMem=nil;_=os.Remove(licDevicePath())
            d4,e:=licEnsureDevice();if e!=nil||d4.ID!=d1.ID{t.Fatalf("deleted-file id changed: %v",e)}
            if e:=licSaveSession(&licSession{Username:"same",AccessToken:"one"});e!=nil{t.Fatal(e)}
            if e:=licSaveSession(&licSession{Username:"same",AccessToken:"two"});e!=nil{t.Fatal(e)}
            if licSessionMem==nil||licSessionMem.AccessToken!="two"{t.Fatal("repeated session update failed")}
          }
          '@ | Set-Content -Encoding UTF8 license_v808_same_device_windows_test.go
          go test -run TestSameDeviceIdentityV808 -count=1 .
          if($LASTEXITCODE -ne 0){throw 'same-device regression failed'}
          Remove-Item license_v808_same_device_windows_test.go -Force

      - name: Build Windows x64 EXE
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w main.go chrome_host.go records.go records_mt5_local.go ea_signal_bridge.go license_auth.go license_support_external.go dpi_windows.go
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          sha256sum 'dist/MH Analysis.exe' | tee dist/SHA256SUMS.txt
          powershell -NoProfile -Command "Compress-Archive -Path 'dist/MH Analysis.exe','dist/SHA256SUMS.txt' -DestinationPath 'dist/MH-Analysis-V80.8-Stable-Same-Device.zip' -Force"

      - name: Startup restart and exit regression
        shell: powershell
        run: desktop/runtime_seamless_test.ps1

      - name: Blank-white regression guard
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';Add-Type -AssemblyName System.Drawing
          foreach($name in @('outer-first.png','outer-restart.png')){$path=Join-Path $PWD ('dist\\'+$name);if(-not(Test-Path $path)){throw "missing $name"};$bmp=[System.Drawing.Bitmap]::FromFile($path);try{$white=0;$samples=0;for($y=80;$y -lt $bmp.Height;$y+=24){for($x=8;$x -lt $bmp.Width;$x+=24){$c=$bmp.GetPixel($x,$y);$samples++;if($c.R -gt 244-and$c.G -gt 244-and$c.B -gt 244){$white++}}};$ratio=$white/[double]$samples;Write-Host "$name white-ratio=$ratio";if($ratio -gt .55){throw "$name blank white"}}finally{$bmp.Dispose()}}

      - name: Upload verified V80.8
        uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V80.8-Stable-Same-Device
          path: |
            dist/MH Analysis.exe
            dist/MH-Analysis-V80.8-Stable-Same-Device.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish verified V80.8 EXE
        shell: bash
        run: |
          set -euo pipefail
          cp 'dist/MH Analysis.exe' "$RUNNER_TEMP/MH Analysis.exe"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan __records_v808c_final
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP/MH Analysis.exe" './MH Analysis.exe'
          git add 'MH Analysis.exe'
          git commit -m 'MH Analysis V80.8 stable same-device verified build'
          git push --force origin HEAD:records-mt5-local-final-exe
          git push --force origin HEAD:final-current-v796
