name: Build FINAL V79.6 Exness Login UI
on:
  workflow_dispatch:
  push:
    branches: [exness-login-ui-final]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Apply verified baseline + render + login UI patches
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          function Patch([string]$p){python $p;if($LASTEXITCODE -ne 0){throw "Patch failed: $p"}}
          $app=Get-Content -Raw web/app.js
          if($app -notmatch 'manual context selection must be API-silent'){throw 'manual timeframe API-silent baseline missing'}
          Patch 'desktop/branding_text_patch.py'
          Patch 'desktop/header_center_layout_patch.py'
          Patch 'desktop/records_feature_patch.py'
          Patch 'desktop/exness_feature_patch.py'
          Patch 'desktop/exness_login_focus_flicker_patch.py'
          Patch 'desktop/exness_login_cleanup_on_open_patch.py'
          Patch 'desktop/exness_render_safe_chrome_patch.py'
          Patch 'desktop/exness_login_ui_verified_patch.py'
          node --check web/app.js
          if($LASTEXITCODE -ne 0){throw 'app.js syntax check failed'}
          Write-Host 'PASS all baseline/render/login-UI patches applied'

      - name: Source guards
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $hostSrc=Get-Content -Raw chrome_host.go
          $bridge=Get-Content -Raw exness_bridge.go
          $runtime=Get-Content -Raw web/runtime-fixes.css
          $app=Get-Content -Raw web/app.js
          foreach($m in @('MH_EXNESS_RENDER_SAFE_CHROME_V796','MH_EXNESS_LOGIN_UI_VERIFIED_V796','chFocusChromeRenderer','AttachThreadInput','Chrome_RenderWidgetHostHWND')){if($hostSrc -notmatch [regex]::Escape($m)){throw "missing host marker $m"}}
          foreach($m in @('/api/exness/login-ui-check','t===\'google\'','forgot my password')){if($bridge -notmatch [regex]::Escape($m)){throw "missing login UI marker $m"}}
          if($bridge -match "clickText\(\[[^\]]*Place order"){throw 'unsafe Place order automation'}
          if($bridge -match "clickText\(\[[^\]]*Confirm"){throw 'unsafe Confirm automation'}
          if($runtime -notmatch 'MH_HEADER_CENTER_V796_START'){throw 'centered header regression'}
          if($app -notmatch 'manual context selection must be API-silent'){throw 'manual timeframe regression'}
          Write-Host 'PASS source guards + no-submit boundary'

      - name: Build Windows x64 EXE
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w main.go chrome_host.go records.go exness_bridge.go dpi_windows.go
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          sha256sum 'dist/MH Analysis.exe' | tee dist/SHA256SUMS.txt
          powershell -NoProfile -Command "Compress-Archive -Path 'dist/MH Analysis.exe','dist/SHA256SUMS.txt' -DestinationPath 'dist/MH-Analysis-V79.6-Exness-Login-UI-FINAL.zip' -Force"

      - name: Existing app startup restart regression
        shell: powershell
        run: desktop/runtime_seamless_test.ps1

      - name: Verify Exness render hidden controls and real keyboard typing
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:MH_SMOKE_TEST='1'
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class ExLoginUIWin {
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h,uint m,IntPtr w,IntPtr l);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h,out RECT r);
            public struct RECT { public int Left,Top,Right,Bottom; }
          }
          '@
          $p=Start-Process -FilePath (Resolve-Path 'dist/MH Analysis.exe') -PassThru
          $server=''
          try {
            for($i=0;$i -lt 60;$i++){$p.Refresh();if($p.MainWindowHandle -ne 0){break};Start-Sleep -Milliseconds 250}
            [IntPtr]$h=$p.MainWindowHandle;if($h -eq [IntPtr]::Zero){throw 'host missing'}
            for($i=0;$i -lt 60;$i++){
              try{$ls=Get-NetTCPConnection -State Listen -OwningProcess $p.Id -ErrorAction Stop|Where-Object{$_.LocalAddress -eq '127.0.0.1'}|Select-Object -First 1;if($ls){$server="http://127.0.0.1:$($ls.LocalPort)";(Invoke-WebRequest "$server/" -UseBasicParsing -TimeoutSec 2)|Out-Null;break}}catch{}
              Start-Sleep -Milliseconds 250
            }
            if(!$server){throw 'local service missing'}
            Start-Sleep -Seconds 2
            $pre=Get-CimInstance Win32_Process -ErrorAction SilentlyContinue|Where-Object{($_.Name -eq 'chrome.exe' -or $_.Name -eq 'msedge.exe') -and $_.CommandLine -match 'ExnessProfile'}|Select-Object -First 1
            if($pre){throw 'Exness launched before tab click'}
            [ExLoginUIWin]::PostMessage($h,0x0111,[IntPtr]1004,[IntPtr]::Zero)|Out-Null

            $render=$null
            for($i=0;$i -lt 60;$i++){
              try{$render=Invoke-RestMethod "$server/api/exness/render-check" -Method Get -TimeoutSec 4}catch{$render=$null}
              if($render -and $render.ok -and [int]$render.htmlLength -gt 500 -and ($render.ready -eq 'interactive' -or $render.ready -eq 'complete')){break}
              Start-Sleep -Milliseconds 400
            }
            if(-not $render -or -not $render.ok -or [int]$render.htmlLength -le 500){throw 'Exness page did not render'}

            $ui=$null
            for($i=0;$i -lt 40;$i++){
              try{$ui=Invoke-RestMethod "$server/api/exness/login-ui-check" -Method Get -TimeoutSec 4}catch{$ui=$null}
              if($ui -and $ui.ok -and $ui.emailFound -and $ui.passwordFound -and [int]$ui.googleVisible -eq 0 -and [int]$ui.forgotVisible -eq 0){break}
              Start-Sleep -Milliseconds 400
            }
            if(-not $ui -or -not $ui.emailFound -or -not $ui.passwordFound){throw "login inputs not detected: $($ui|ConvertTo-Json -Compress)"}
            if([int]$ui.googleVisible -ne 0 -or [int]$ui.forgotVisible -ne 0){throw "alternative login UI still visible: $($ui|ConvertTo-Json -Compress)"}
            Write-Host "PASS Google/Forgot hidden: $($ui|ConvertTo-Json -Compress)"

            # Prove real OS keyboard input reaches the embedded Chrome renderer.
            Invoke-RestMethod "$server/api/exness/login-ui-check?clear=1" -Method Get -TimeoutSec 4|Out-Null
            Invoke-RestMethod "$server/api/exness/login-ui-check?focus=email" -Method Get -TimeoutSec 4|Out-Null
            [ExLoginUIWin]::PostMessage($h,0x0111,[IntPtr]1004,[IntPtr]::Zero)|Out-Null
            Start-Sleep -Milliseconds 250
            [System.Windows.Forms.SendKeys]::SendWait('mhfocustest')
            Start-Sleep -Milliseconds 350
            $emailState=Invoke-RestMethod "$server/api/exness/login-ui-check" -Method Get -TimeoutSec 4
            if([string]$emailState.emailValue -notlike '*mhfocustest*'){throw "email keyboard typing failed: $($emailState|ConvertTo-Json -Compress)"}
            Write-Host 'PASS real OS keyboard typing reaches Exness email input'

            Invoke-RestMethod "$server/api/exness/login-ui-check?clear=1" -Method Get -TimeoutSec 4|Out-Null
            Invoke-RestMethod "$server/api/exness/login-ui-check?focus=password" -Method Get -TimeoutSec 4|Out-Null
            [ExLoginUIWin]::PostMessage($h,0x0111,[IntPtr]1004,[IntPtr]::Zero)|Out-Null
            Start-Sleep -Milliseconds 250
            [System.Windows.Forms.SendKeys]::SendWait('Pass1234')
            Start-Sleep -Milliseconds 350
            $passState=Invoke-RestMethod "$server/api/exness/login-ui-check" -Method Get -TimeoutSec 4
            if([int]$passState.passwordLength -lt 8){throw "password keyboard typing failed: $($passState|ConvertTo-Json -Compress)"}
            Write-Host 'PASS real OS keyboard typing reaches Exness password input'
            Invoke-RestMethod "$server/api/exness/login-ui-check?clear=1" -Method Get -TimeoutSec 4|Out-Null

            Start-Sleep -Seconds 1
            $r=New-Object ExLoginUIWin+RECT;[void][ExLoginUIWin]::GetWindowRect($h,[ref]$r)
            $w=[Math]::Max(1,$r.Right-$r.Left);$hh=[Math]::Max(1,$r.Bottom-$r.Top)
            $bmp=New-Object Drawing.Bitmap $w,$hh
            $g=[Drawing.Graphics]::FromImage($bmp);$g.CopyFromScreen($r.Left,$r.Top,0,0,(New-Object Drawing.Size $w,$hh));$g.Dispose()
            $nonBlack=0;$samples=0
            for($y=90;$y -lt $hh;$y+=35){for($x=20;$x -lt $w;$x+=35){$c=$bmp.GetPixel($x,$y);$samples++;if(($c.R+$c.G+$c.B) -gt 36){$nonBlack++}}}
            $bmp.Save((Join-Path $PWD 'dist\exness-login-ui-final.png'),[Drawing.Imaging.ImageFormat]::Png);$bmp.Dispose()
            if($nonBlack -lt 20){throw "Exness surface black: $nonBlack/$samples"}
            Write-Host "PASS Exness render + login UI + keyboard typing nonBlack=$nonBlack/$samples url=$($render.url)"
          } finally {
            if($server){try{Invoke-WebRequest ($server+'/api/shutdown') -UseBasicParsing -TimeoutSec 2|Out-Null}catch{}}
            Start-Sleep -Seconds 2
            if(!$p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
            Remove-Item Env:MH_SMOKE_TEST -ErrorAction SilentlyContinue
          }

      - name: Verify Records and DPI retained
        shell: powershell
        run: |
          $src=Get-Content -Raw web/records.html
          if($src -notmatch 'ACCURACY CHECK'){throw 'Records regression'}
          $dpi=Get-Content -Raw dpi_windows.go
          if($dpi -notmatch 'SetProcessDpiAwarenessContext'){throw 'DPI regression'}
          Write-Host 'PASS Records + DPI retained'

      - name: Upload verified final build
        uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V79.6-Exness-Login-UI-FINAL
          path: |
            dist/MH Analysis.exe
            dist/MH-Analysis-V79.6-Exness-Login-UI-FINAL.zip
            dist/SHA256SUMS.txt
            dist/exness-login-ui-final.png
          if-no-files-found: error
          retention-days: 90

      - name: Publish EXE-only final branch and remove work branch
        shell: bash
        run: |
          set -euo pipefail
          cp 'dist/MH Analysis.exe' "$RUNNER_TEMP/MH Analysis.exe"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan __exness_login_ui_final
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP/MH Analysis.exe" './MH Analysis.exe'
          git add 'MH Analysis.exe'
          git commit -m 'MH Analysis V79.6 Exness login UI final EXE only'
          git push --force origin HEAD:final-current-v796
          git push origin --delete exness-login-ui-final
          echo 'PASS final-current-v796 contains only fully verified Exness login UI EXE'
