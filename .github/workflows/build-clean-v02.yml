name: Build MH Analysis Clean V.02
on:
  workflow_dispatch:
  push:
    branches: [clean-runtime-v02]
permissions:
  contents: write
concurrency:
  group: mh-clean-v02
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.2', cache: false}
      - name: Clean runtime contract audit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$m=Get-Content -Raw main.go;$a=Get-Content -Raw web/auth.js;$l=Get-Content -Raw license_auth.go;$u=Get-Content -Raw updater.go;$i=Get-Content -Raw web/index.html;$mt=Get-Content -Raw mt5_prefill.go;$errors=@()
          function Need([bool]$ok,[string]$msg){if(-not $ok){$script:errors += $msg}else{Write-Host "PASS: $msg"}}
          Need ($m.Contains('runHost()')) 'single WebView2 host';Need (-not ($m.Contains('runChromeHost()'))) 'legacy Chrome host disabled';Need ($l.Contains('return licSessionMem')) 'login process-only';Need (-not ($l.Contains('licReadProtected(licSessionPath()'))) 'persisted login not loaded';Need ($a.Contains('manualLoginThisProcess = false')) 'fresh start logged out';Need ($a.Contains('if (!manualLoginThisProcess) { show("login_required"); return; }')) 'manual login mandatory';Need ($m.Contains('btnRecords')) 'Records button';Need ($m.Contains('btnMT5')) 'MT5 button';Need ($m.Contains('btnSignalLink')) 'Signal Link';Need ($m.Contains('recordsCtl')) 'frameless Records';Need ($m.Contains('whatsappCtl')) 'frameless WhatsApp';Need ($m.Contains('activeView=1')) 'MH Analysis default';Need ($m.Contains('showNativeToolbar(false)')) 'toolbar hidden before login';Need ($u.Contains('mhPublicVersionV001 = "V.02"')) 'V.02 runtime';Need ($u.Contains('mh-analysis-update-channel/update.json')) 'update channel';Need ($i.Contains('/auth.js')) 'login UI';Need (-not ($mt.Contains('chMT5Wnd'))) 'old MT5 window state removed';Need (-not ($mt.Contains('chMT5Cmd'))) 'old MT5 command state removed';Need ($mt.Contains('mt5Wnd')) 'clean MT5 window state';Need ($mt.Contains('mt5Cmd')) 'clean MT5 command state'
          if($errors.Count -gt 0){$errors|%{Write-Host "FAIL: $_"};throw "contract failed"}
      - name: Syntax and build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';node --check web/auth.js;node --check web/update-v001.js;node --check web/app.js;gofmt -w main.go license_auth.go updater.go records.go records_mt5_local.go ea_signal_bridge.go license_support_external.go dpi_windows.go native_settings.go chrome_host.go mt5_prefill.go;New-Item -ItemType Directory -Force -Path dist\app|Out-Null;go build -trimpath -ldflags="-H=windowsgui -s -w" -o "dist/app/MH Analysis.exe" .;if(-not(Test-Path "dist/app/MH Analysis.exe")){throw "application EXE missing"}
      - name: Build V.02 manifest
        shell: bash
        run: |
          set -euo pipefail;HASH=$(sha256sum 'dist/app/MH Analysis.exe'|awk '{print $1}');printf '%s  %s\n' "$HASH" 'MH Analysis.exe'>dist/SHA256SUMS.txt;printf '{"version":"V.02","mandatory":true,"download_url":"https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%%20Analysis.exe","sha256":"%s","notes":"MH Analysis Clean V.02"}\n' "$HASH">dist/update.json;printf 'V.02\n'>dist/VERSION
      - name: Build installer MH-Analysis.exe
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';New-Item -ItemType Directory -Force -Path dist\installer|Out-Null;$iss=Get-Content -Raw 'installer\MH-Analysis-V001-Reset.iss';$iss=$iss -replace '#define MyAppVersion "[^"]+"','#define MyAppVersion "V.02"';$iss=$iss -replace 'OutputBaseFilename=[^\r\n]+','OutputBaseFilename=MH-Analysis';Set-Content -Encoding UTF8 'installer\MH-Analysis-V001-Reset.iss' $iss;$iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe';if(-not(Test-Path $iscc)){choco install innosetup --no-progress -y};& $iscc 'installer\MH-Analysis-V001-Reset.iss';if($LASTEXITCODE -ne 0){throw 'installer failed'};if(-not(Test-Path 'dist\installer\MH-Analysis.exe')){throw 'installer missing'}
      - uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-Clean-V.02
          path: |
            dist/installer/MH-Analysis.exe
            dist/app/MH Analysis.exe
            dist/SHA256SUMS.txt
            dist/update.json
            dist/VERSION
          retention-days: 90
      - name: Publish V.02 update channels
        shell: bash
        run: |
          set -euo pipefail;mkdir -p "$RUNNER_TEMP/release/Installer";cp 'dist/app/MH Analysis.exe' "$RUNNER_TEMP/release/MH Analysis.exe";cp 'dist/installer/MH-Analysis.exe' "$RUNNER_TEMP/release/Installer/MH-Analysis.exe";cp dist/SHA256SUMS.txt dist/update.json dist/VERSION "$RUNNER_TEMP/release/";git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git checkout --orphan __mh_clean_v02_release;git rm -rf .||true;find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +;cp -r "$RUNNER_TEMP/release/." .;git add .;git commit -m 'MH Analysis Clean V.02 release';git push --force origin HEAD:mh-analysis-update-channel;git push --force origin HEAD:final-current-v796
