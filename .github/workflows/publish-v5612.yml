name: Publish V5612 Release
on:
  push:
    branches: [v56.12-release]
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v56.12-release
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Normalize V56.12 identities
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='license_auth.go';$s=Get-Content -Raw $p;$s=$s.Replace('const licAppVersion = "V.55.8"','const licAppVersion = "V.56.12"');[IO.File]::WriteAllText((Join-Path $PWD $p),$s,(New-Object Text.UTF8Encoding($false)))
          $p='updater.go';$s=Get-Content -Raw $p;$s=$s.Replace('const mhPublicVersionV001 = "V.55.9"','const mhPublicVersionV001 = "V.56.12"');[IO.File]::WriteAllText((Join-Path $PWD $p),$s,(New-Object Text.UTF8Encoding($false)))
          $p='webview2_host.go';$s=Get-Content -Raw $p;$s=$s.Replace('Version: V.55.8','Version: V.56.12');[IO.File]::WriteAllText((Join-Path $PWD $p),$s,(New-Object Text.UTF8Encoding($false)))
          $p='web/index.html';$s=Get-Content -Raw $p;$s=$s.Replace('id="mhUpdateVersionV001">V.55.8<','id="mhUpdateVersionV001">V.56.12<');$s=$s.Replace('<button data-chart-tf="20m">20m</button>','');[IO.File]::WriteAllText((Join-Path $PWD $p),$s,(New-Object Text.UTF8Encoding($false)))

      - name: Apply preserved upgrades
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v565-chart-persist.js
          node scripts/v566-isolation.js
          node scripts/v567-mt5-path-reselect.js
          node scripts/v568-advanced-strategies.js
          node scripts/v568-syntax-hotfix.js
          node scripts/v569-precision-context.js
          node scripts/v569-syntax-hotfix.js
          node scripts/v569-go-hotfix.js
          node scripts/v5610-api-pairtf-safety.js
          node scripts/v5611-primary-candle-hotfix.js
          node scripts/v5612-direct-market-snapshot.js

      - name: Validate V56.12 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem -Path . -Filter *.go -File | ForEach-Object { gofmt -w $_.FullName }
          foreach($js in @('web/app.js','web/runtime-fixes.js','web/auth.js','web/v31.js','web/v558-fast.js','web/v560-mode-guard.js','web/v562-text-fix.js','web/v564-market-ui-fix.js','web/update-v001.js','scripts/v569-precision-context.js','scripts/v569-syntax-hotfix.js','scripts/v569-go-hotfix.js','scripts/v5610-api-pairtf-safety.js','scripts/v5611-primary-candle-hotfix.js','scripts/v5612-direct-market-snapshot.js')) { node --check $js; if($LASTEXITCODE -ne 0){throw "JavaScript validation failed: $js"} }
          if((Get-Content VERSION -Raw).Trim() -ne 'V.56.12'){throw 'VERSION mismatch'}
          $app=Get-Content -Raw web\app.js
          foreach($m in @('V56.5: keep the last fetched chart visible','function v569HTFFamilies(c,m,s)','/api/analysis-snapshot-v569','v569ApplyExecutionFilters(d,c)','function v5610PairTimeframeExposure','Other timeframes remain independent.')){if(-not $app.Contains($m)){throw "analysis/safety marker missing: $m"}}
          $ctx=Get-Content -Raw analysis_context_v569.go
          foreach($m in @('V56.12: use the three FCS endpoints directly instead of multi_url','func v5612FetchDirectFCS','FCS direct precision snapshot','"external_api_calls": 3','v569DeepError','htf_candles')){if(-not $ctx.Contains($m)){throw "V56.12 backend marker missing: $m"}}
          $handlerStart=$ctx.IndexOf('func v569AnalysisSnapshotHandler');$handlerEnd=$ctx.IndexOf('func v569Outcome',$handlerStart);$handler=$ctx.Substring($handlerStart,$handlerEnd-$handlerStart)
          if($handler.Contains('multi_url')){throw 'V56.12 active snapshot handler must not call multi_url'}
          if(-not $handler.Contains('paths := []string{p1, p2, p3}')){throw 'V56.12 must issue exactly three direct market endpoint calls'}
          $main=Get-Content -Raw main.go
          foreach($m in @('registerV569PrecisionRoutes(mux)','const providerMaxRequestsPerMinute = 3','if len(calls) >= providerMaxRequestsPerMinute')){if(-not $main.Contains($m)){throw "API guard marker missing: $m"}}
          $bridge=Get-Content -Raw ea_signal_bridge.go
          foreach($m in @('PARTIAL_TP|TIMEFRAME','json:"timeframe"','q.Timeframe')){if(-not $bridge.Contains($m)){throw "EA timeframe bridge marker missing: $m"}}
          $v31=Get-Content -Raw web\v31.js
          if(-not $v31.Contains("bismillah.setAttribute('dir','rtl')")){throw 'Bismillah baseline missing'}
          if(-not (Get-Content -Raw license_auth.go).Contains('const licAppVersion = "V.56.12"')){throw 'license version mismatch'}
          if(-not (Get-Content -Raw updater.go).Contains('const mhPublicVersionV001 = "V.56.12"')){throw 'updater version mismatch'}

      - name: Test build installer manifest and package
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'Go tests failed'}
          New-Item -ItemType Directory -Force dist,dist-installer|Out-Null
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          if($LASTEXITCODE -ne 0 -or -not(Test-Path 'dist/MH Analysis.exe')){throw 'Windows EXE build failed'}
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not(Test-Path $iscc)){choco install innosetup -y --no-progress; if($LASTEXITCODE -ne 0){throw 'Inno Setup installation failed'}}
          $src=(Resolve-Path 'dist\MH Analysis.exe').Path
          $out=(Resolve-Path dist-installer).Path
          & $iscc '/Qp' "/DMySourceExe=$src" "/DMyOutputDir=$out" '/DMyAppVersion=V.56.12' '/DMyOutputBaseFilename=MH-Analysis-Setup-V.56.12' 'installer\MHAnalysis-V01.iss'
          if($LASTEXITCODE -ne 0){throw 'installer compilation failed'}
          $installer='dist-installer\MH-Analysis-Setup-V.56.12.exe'
          if(-not(Test-Path $installer)){throw "expected installer missing: $installer"}
          $sha=(Get-FileHash 'dist\MH Analysis.exe' -Algorithm SHA256).Hash.ToLower()
          "$sha  MH Analysis.exe"|Set-Content -Encoding ascii dist\SHA256SUMS.txt
          'V.56.12'|Set-Content -Encoding ascii dist\VERSION
          $m=[ordered]@{version='V.56.12';mandatory=$true;download_url='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%20Analysis.exe';sha256=$sha;notes='V.56.12 keeps all existing analysis, true HTF, session/news/spread filters, calibration, Pair+Timeframe isolation and EA behavior, but replaces the unreliable FCS multi_url market fetch with exactly three direct FCS calls per NEW ANALYZE or RE-EVALUATE: selected timeframe history, true higher-timeframe history, and latest bid/ask. No fallback provider call is added, and pair/timeframe selection remains API-silent.'}|ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD 'dist\update.json'),$m,(New-Object Text.UTF8Encoding($false)))
          Compress-Archive -Path 'dist\MH Analysis.exe','dist\SHA256SUMS.txt','dist\update.json','dist\VERSION',$installer -DestinationPath 'dist\MH-Analysis-V.56.12.zip' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V.56.12
          path: |
            dist/MH Analysis.exe
            dist/MH-Analysis-V.56.12.zip
            dist/SHA256SUMS.txt
            dist/update.json
            dist/VERSION
            dist-installer/MH-Analysis-Setup-V.56.12.exe
          if-no-files-found: error

      - name: Publish updater channel atomically
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pub"
          cp 'dist/MH Analysis.exe' "$RUNNER_TEMP/pub/MH Analysis.exe"
          cp dist/update.json "$RUNNER_TEMP/pub/update.json"
          cp dist/VERSION "$RUNNER_TEMP/pub/VERSION"
          cp dist/SHA256SUMS.txt "$RUNNER_TEMP/pub/SHA256SUMS.txt"
          cp 'dist-installer/MH-Analysis-Setup-V.56.12.exe' "$RUNNER_TEMP/pub/MH-Analysis-Setup-V.56.12.exe"
          git reset --hard HEAD
          git clean -fd
          git fetch origin mh-analysis-update-channel
          git checkout -B mh-analysis-update-channel origin/mh-analysis-update-channel
          cp "$RUNNER_TEMP/pub/MH Analysis.exe" './MH Analysis.exe'
          cp "$RUNNER_TEMP/pub/update.json" update.json
          cp "$RUNNER_TEMP/pub/VERSION" VERSION
          cp "$RUNNER_TEMP/pub/SHA256SUMS.txt" SHA256SUMS.txt
          cp "$RUNNER_TEMP/pub/MH-Analysis-Setup-V.56.12.exe" './MH-Analysis-Setup-V.56.12.exe'
          git add 'MH Analysis.exe' update.json VERSION SHA256SUMS.txt 'MH-Analysis-Setup-V.56.12.exe'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish MH Analysis V.56.12'
          git push origin mh-analysis-update-channel

      - name: Verify live updater channel
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/'
          $published=(Get-Content -Raw "$env:RUNNER_TEMP\pub\update.json")|ConvertFrom-Json
          $ok=$false
          for($i=0;$i -lt 12;$i++){
            try{
              $cb=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
              $live=(Invoke-WebRequest -UseBasicParsing ($base+'update.json?cb='+$cb)).Content|ConvertFrom-Json
              $liveVersion=(Invoke-WebRequest -UseBasicParsing ($base+'VERSION?cb='+$cb)).Content.Trim()
              if($live.version -eq 'V.56.12' -and $live.sha256 -eq $published.sha256 -and $liveVersion -eq 'V.56.12'){$ok=$true;break}
            }catch{}
            Start-Sleep -Seconds 5
          }
          if(-not $ok){throw 'live V.56.12 updater verification did not converge'}
          Write-Host 'LIVE V.56.12 updater verification PASSED'
