name: Publish MH Analysis V47 Direct Group Send
on:
  push:
    branches: [v47-whatsapp-direct-group]
    paths: ['.github/workflows/publish-v47-whatsapp-direct-group.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Set V47 identity and verify source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $u=Get-Content -Raw updater.go
          $u=[regex]::Replace($u,'const mhPublicVersionV001 = "V\.[^"]+"','const mhPublicVersionV001 = "V.47"',1)
          [IO.File]::WriteAllText((Join-Path $PWD 'updater.go'),$u,(New-Object Text.UTF8Encoding($false)))
          $l=Get-Content -Raw license_auth.go
          $l=[regex]::Replace($l,'const licAppVersion = "[^"]+"','const licAppVersion = "V.47"',1)
          [IO.File]::WriteAllText((Join-Path $PWD 'license_auth.go'),$l,(New-Object Text.UTF8Encoding($false)))
          $wv=Get-Content -Raw webview2_host.go
          if($wv -notmatch 'V47: open the exact saved group invite link'){throw 'V47 direct group sender missing'}
          if($wv -match 'web\.whatsapp\.com/accept\?code='){throw 'old accept route present'}
          gofmt -w webview2_host.go updater.go license_auth.go
          go test ./...
          New-Item -ItemType Directory -Force dist|Out-Null
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          if($LASTEXITCODE -ne 0 -or -not(Test-Path 'dist/MH Analysis.exe')){throw 'V47 build failed'}
      - name: Publish mandatory V47 manifest
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $sha=(Get-FileHash 'dist/MH Analysis.exe' -Algorithm SHA256).Hash.ToLower()
          $d=Join-Path $env:RUNNER_TEMP 'v47';New-Item -ItemType Directory -Force $d|Out-Null
          Copy-Item 'dist/MH Analysis.exe' (Join-Path $d 'MH Analysis.exe')
          $m=[ordered]@{version='V.47';mandatory=$true;download_url='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%20Analysis.exe';sha256=$sha;notes='MANDATORY V.47 - open saved WhatsApp group link in the existing logged-in embedded session, wait for the actual group chat, then send the signal in background.'}|ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $d 'update.json'),$m,(New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Join-Path $d 'VERSION'),'V.47'+[Environment]::NewLine,(New-Object Text.UTF8Encoding($false)))
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan __v47_update
          git rm -rf . 2>$null
          Get-ChildItem -Force|Where-Object{$_.Name -ne '.git'}|Remove-Item -Recurse -Force
          Copy-Item (Join-Path $d '*') .
          git add .;git commit -m 'Publish MH Analysis V.47 mandatory update';git push --force origin HEAD:mh-analysis-update-channel
