name: Publish MH Analysis V42 MT5 DPI Safe Embed
on:
  push:
    branches: [v42-mt5-integrity-dpi-fix]
    paths: ['.github/workflows/publish-v42-mt5-dpi-fix.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.2', cache: false}
      - name: Set and verify V42 identity
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $u=Get-Content -Raw updater.go
          if($u -notmatch 'const mhPublicVersionV001 = "V\.42"'){throw 'updater.go is not permanently V.42'}
          $l=Get-Content -Raw license_auth.go
          $l=$l.Replace('const licAppVersion = "V.39"','const licAppVersion = "V.42"')
          if($l -notmatch 'const licAppVersion = "V\.42"'){throw 'license version could not be set to V.42'}
          [IO.File]::WriteAllText((Join-Path $PWD 'license_auth.go'),$l,(New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Join-Path $PWD 'VERSION'),'V.42'+[Environment]::NewLine,(New-Object Text.UTF8Encoding($false)))
      - name: Verify existing app and MT5 V42 fix
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $m=Get-Content -Raw mt5_embed_v36.go
          $main=Get-Content -Raw main.go
          $native=Get-Content -Raw native_settings.go
          $lic=Get-Content -Raw license_auth.go
          $upd=Get-Content -Raw updater.go
          if($m -notmatch 'V42_MT5_DPI_SAFE_CHILD'){throw 'V42 MT5 DPI fix missing'}
          if($m -notmatch 'SetThreadDpiAwarenessContext'){throw 'DPI context API missing'}
          if($m -notmatch 'chSetParent.Call\(hwnd, hostHWND\)'){throw 'MT5 SetParent missing'}
          if($m -notmatch 'parent != hostHWND'){throw 'MT5 child verification missing'}
          if($main -notmatch 'WhatsAppLink2 string' -or $native -notmatch 'WhatsApp Signal Link / Number 2'){throw 'existing Signal Link functionality regressed'}
          if($lic -notmatch 'func licHandleLogin' -or $lic -notmatch 'func licenseGate' -or $lic -notmatch 'const licAppVersion = "V\.42"'){throw 'license auth incomplete or wrong version'}
          if($upd -notmatch 'const mhPublicVersionV001 = "V\.42"'){throw 'updater version wrong'}
          gofmt -w mt5_embed_v36.go updater.go license_auth.go
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'V42 tests failed'}
      - name: Build V42 installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force dist|Out-Null
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          if($LASTEXITCODE -ne 0){throw 'build failed'}
          $iss=Get-Content -Raw 'installer\MH-Analysis-V27.iss'
          $iss=$iss -replace 'AppVersion=[^\r\n]+','AppVersion=42.0.0'
          $iss=$iss -replace 'OutputBaseFilename=[^\r\n]+','OutputBaseFilename=MH-Analysis-Setup-V42'
          [IO.File]::WriteAllText((Join-Path $PWD 'installer\MH-Analysis-V42.iss'),$iss,(New-Object Text.UTF8Encoding($false)))
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not(Test-Path $iscc)){choco install innosetup --no-progress -y}
          & $iscc 'installer\MH-Analysis-V42.iss'
          if($LASTEXITCODE -ne 0){throw 'installer failed'}
      - name: Publish V42
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Continue'
          gh release delete v42 --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE=0
          $ErrorActionPreference='Stop'
          gh release create v42 'dist/MH-Analysis-Setup-V42.exe' 'dist/MH Analysis.exe' --target $env:GITHUB_SHA --title 'MH Analysis V.42' --notes 'V.42: MT5 DPI-safe child embedding plus permanent V.42 updater identity to prevent repeated update loops.'
      - name: Publish V42 mandatory update
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $d=Join-Path $env:RUNNER_TEMP 'v42-update'
          New-Item -ItemType Directory -Force $d|Out-Null
          Copy-Item 'dist\MH Analysis.exe' (Join-Path $d 'MH Analysis.exe')
          $sha=(Get-FileHash 'dist\MH Analysis.exe' -Algorithm SHA256).Hash.ToLower()
          $j=[ordered]@{version='V.42';mandatory=$true;download_url='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%20Analysis.exe';sha256=$sha;notes='MANDATORY V.42 - MT5 embed fix and updater loop correction.'}|ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $d 'update.json'),$j,(New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Join-Path $d 'VERSION'),'V.42'+[Environment]::NewLine,(New-Object Text.UTF8Encoding($false)))
          git checkout --orphan __v42_update
          git rm -rf . 2>$null
          Get-ChildItem -Force|?{$_.Name -ne '.git'}|Remove-Item -Recurse -Force
          Copy-Item (Join-Path $d '*') .
          git add .
          git commit -m 'Publish MH Analysis V.42 corrected update channel'
          git push --force origin HEAD:mh-analysis-update-channel
