name: Publish MH Analysis V35 Runtime Fix
on:
  workflow_dispatch:
  push:
    branches: [v35-runtime-navigation-fix]
    paths: ['scripts/v35_runtime_fix.py','.github/workflows/publish-v35.yml']
permissions:
  contents: write
concurrency:
  group: mh-analysis-v35-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.2', cache: false}
      - name: Apply V35 directly to canonical V34 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python scripts/v35_runtime_fix.py
          gofmt -w webview2_host.go chrome_host.go updater.go license_auth.go
      - name: Verify retained behavior and V35 runtime architecture
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $wv=Get-Content -Raw webview2_host.go; $ch=Get-Content -Raw chrome_host.go; $app=Get-Content -Raw web/app.js; $main=Get-Content -Raw main.go
          if($wv -notmatch 'V35_PREWARM_AUX'){throw 'persistent aux prewarm missing'}
          if($ch -notmatch 'V35_MT5_PROCESS_IMAGE'){throw 'native MT5 process detection missing'}
          if($ch -match 'Get-Process -Id'){throw 'PowerShell polling regression'}
          if($ch -notmatch 'V34_SINGLE_FLIGHT_MT5'){throw 'MT5 single-flight regressed'}
          if($app -notmatch 'V34_CANONICAL_SIGNAL_FANOUT'){throw 'signal fanout regressed'}
          if($main -notmatch 'V34_WA_RETRY'){throw 'WhatsApp delivery retry regressed'}
          if((Get-Content -Raw updater.go) -notmatch 'V\.35'){throw 'updater version mismatch'}
          if((Get-Content -Raw license_auth.go) -notmatch 'V\.35'){throw 'license version mismatch'}
          node --check web/app.js; node --check web/records.js; go test ./...
          if($LASTEXITCODE -ne 0){throw 'V35 tests failed'}
      - name: Build and verify V35 installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'; New-Item -ItemType Directory -Force dist|Out-Null
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          if($LASTEXITCODE -ne 0 -or -not(Test-Path 'dist/MH Analysis.exe')){throw 'EXE build failed'}
          $iss=Get-Content -Raw 'installer\MH-Analysis-V27.iss'
          $iss=$iss -replace 'AppVersion=[^\r\n]+','AppVersion=35.0.0'
          $iss=$iss -replace 'OutputBaseFilename=[^\r\n]+','OutputBaseFilename=MH-Analysis-Setup-V35'
          [IO.File]::WriteAllText((Join-Path $PWD 'installer\MH-Analysis-V35.iss'),$iss,(New-Object Text.UTF8Encoding($false)))
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not(Test-Path $iscc)){choco install innosetup --no-progress -y}
          & $iscc 'installer\MH-Analysis-V35.iss'
          if($LASTEXITCODE -ne 0 -or -not(Test-Path 'dist\MH-Analysis-Setup-V35.exe')){throw 'installer failed'}
          $target=Join-Path $env:RUNNER_TEMP 'MHV35Verify'
          $p=Start-Process (Join-Path $PWD 'dist\MH-Analysis-Setup-V35.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR='+$target)) -PassThru -Wait
          if($p.ExitCode -ne 0 -or -not(Test-Path (Join-Path $target 'MH Analysis.exe'))){throw 'silent installer verification failed'}
      - name: Publish V35 release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Continue'
          gh release delete v35 --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE=0
          $ErrorActionPreference='Stop'
          gh release create v35 'dist/MH-Analysis-Setup-V35.exe' 'dist/MH Analysis.exe' --target '${{ github.sha }}' --title 'MH Analysis V.35' --notes 'V.35 rebuilt with updater compatibility. Runtime navigation fix, native MT5 detection, retained signal delivery fixes.'
          if($LASTEXITCODE -ne 0){throw 'release publish failed'}
      - name: Publish V35 auto-update channel
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $upd=Join-Path $env:RUNNER_TEMP 'v35-update'
          New-Item -ItemType Directory -Force $upd|Out-Null
          Copy-Item 'dist\MH Analysis.exe' (Join-Path $upd 'MH Analysis.exe')
          $sha=(Get-FileHash 'dist\MH Analysis.exe' -Algorithm SHA256).Hash.ToLower()
          $manifest=[ordered]@{version='V.35';mandatory=$true;download_url='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%20Analysis.exe';sha256=$sha;notes='MANDATORY V.35 - updater-compatible rebuild; deterministic first-click navigation; native MT5 detection; retained WhatsApp and signal delivery fixes.'}|ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $upd 'update.json'),$manifest,(New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Join-Path $upd 'VERSION'),'V.35'+[Environment]::NewLine,(New-Object Text.UTF8Encoding($false)))
          git checkout --orphan __v35_update
          git rm -rf . 2>$null
          Get-ChildItem -Force|?{$_.Name -ne '.git'}|Remove-Item -Recurse -Force
          Copy-Item (Join-Path $upd '*') .
          git add .
          git commit -m 'Publish MH Analysis V.35 updater-compatible channel'
          git push --force origin HEAD:mh-analysis-update-channel