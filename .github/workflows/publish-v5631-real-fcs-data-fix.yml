          helper=r'''// V.56.31 real-data helpers: history remains the structural source; FCS latest supplies the active candle.
func extractFCSActiveCandleV5631(root any) (candle, bool) {
	var best candle
	found := false
	var walk func(any)
	walk = func(v any) {
		switch x := v.(type) {
		case map[string]any:
			if a, ok := x["active"].(map[string]any); ok {
