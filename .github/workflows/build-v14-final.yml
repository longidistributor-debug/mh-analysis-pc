name: Build MH Analysis Current Final
on:
  push:
    branches: [v14-fixes]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mh-analysis-current-final
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Read release version
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $version=(Get-Content -Raw VERSION).Trim()
          if($version -notmatch '^V\.[0-9]+(?:\.[0-9]+)*$'){throw "Invalid VERSION: $version"}
          "MH_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Validate canonical authorization source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $a=Get-Content -Raw license_auth.go
          if($a -match 'git show '){throw 'historical source restore is forbidden'}
          if($a -notmatch 'registry.OpenKey\(registry.LOCAL_MACHINE, `SOFTWARE\\Microsoft\\Cryptography`'){throw 'MachineGuid registry path is not canonical'}
          if($a -match 'SOFTWARE\\\\Microsoft\\\\Cryptography'){throw 'double-escaped MachineGuid path detected'}
      - name: Format and compile
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          gofmt -w license_auth.go updater.go chrome_host.go webview2_host.go native_settings.go main.go
          New-Item -ItemType Directory -Force dist | Out-Null
          $ld="-H=windowsgui -s -w -X main.mhPublicVersionV001=$env:MH_RELEASE_VERSION -X main.licAppVersion=$env:MH_RELEASE_VERSION"
          go build -trimpath -ldflags="$ld" -o 'dist/MH Analysis.exe' .
      - name: Runtime smoke test
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=Start-Process -FilePath (Resolve-Path 'dist/MH Analysis.exe') -PassThru
          Start-Sleep 10
          if($p.HasExited -and $p.ExitCode -ne 0){throw "App launch failed: $($p.ExitCode)"}
          Get-Process -Name 'MH Analysis' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Build current installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $version=$env:MH_RELEASE_VERSION
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not(Test-Path $iscc)){choco install innosetup --no-progress -y}
          $src=Get-Content -Raw 'installer/MHAnalysis-V04.iss'
          $src=$src.Replace('V.04',$version).Replace('MH Analysis V.04.exe',("MH Analysis "+$version+".exe"))
          Set-Content -Encoding UTF8 'installer/MHAnalysis-Current.iss' $src
          & $iscc 'installer/MHAnalysis-Current.iss'
          if($LASTEXITCODE -ne 0){throw 'installer failed'}
          $target="MH Analysis $version.exe"
          $x=Get-ChildItem -Recurse -Filter $target | Select-Object -First 1
          if(-not $x){throw "installer output missing: $target"}
          Copy-Item $x.FullName 'dist/MH-Analysis-Current-Installer.exe' -Force
      - name: Publish mandatory current manifest
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $version=$env:MH_RELEASE_VERSION
          $sha=(Get-FileHash 'dist/MH Analysis.exe' -Algorithm SHA256).Hash.ToLower()
          git fetch origin mh-analysis-update-channel
          git worktree add update-channel origin/mh-analysis-update-channel
          $binary=("MH-Analysis-"+$version+".exe")
          Copy-Item 'dist/MH Analysis.exe' (Join-Path 'update-channel' $binary) -Force
          $url='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/'+$binary
          $manifest=[ordered]@{version=$version;mandatory=$true;download_url=$url;sha256=$sha;notes=("MH Analysis "+$version+" current mandatory release.")}
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'update-channel/update.json'),($manifest|ConvertTo-Json),(New-Object Text.UTF8Encoding($false)))
          Push-Location update-channel
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $binary update.json
          if((git status --porcelain).Length -gt 0){git commit -m ("Publish mandatory MH Analysis "+$version);git pull --rebase origin mh-analysis-update-channel;git push origin HEAD:mh-analysis-update-channel}
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-Current-Final
          path: |
            dist/MH-Analysis-Current-Installer.exe
            dist/MH Analysis.exe
          retention-days: 90
