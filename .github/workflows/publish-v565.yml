name: Publish V565 Release
on:
  push:
    branches: [v56.5-release]
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v56.5-release
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Normalize V56.5 identities and chart persistence
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='license_auth.go';$s=Get-Content -Raw $p;$s=$s.Replace('const licAppVersion = "V.55.8"','const licAppVersion = "V.56.5"');[IO.File]::WriteAllText((Join-Path $PWD $p),$s,(New-Object Text.UTF8Encoding($false)))
          $p='updater.go';$s=Get-Content -Raw $p;$s=$s.Replace('const mhPublicVersionV001 = "V.55.9"','const mhPublicVersionV001 = "V.56.5"');[IO.File]::WriteAllText((Join-Path $PWD $p),$s,(New-Object Text.UTF8Encoding($false)))
          $p='webview2_host.go';$s=Get-Content -Raw $p;$s=$s.Replace('Version: V.55.8','Version: V.56.5');[IO.File]::WriteAllText((Join-Path $PWD $p),$s,(New-Object Text.UTF8Encoding($false)))
          $p='web/index.html';$s=Get-Content -Raw $p;$s=$s.Replace('id="mhUpdateVersionV001">V.55.8<','id="mhUpdateVersionV001">V.56.5<');$s=$s.Replace('<button data-chart-tf="20m">20m</button>','');[IO.File]::WriteAllText((Join-Path $PWD $p),$s,(New-Object Text.UTF8Encoding($false)))

          $p='web/app.js';$s=Get-Content -Raw $p;$s=$s -replace "`r`n","`n"
          $old=@'
  loadChart();
  resetViewForContext();
'@
          $new=@'
  // V56.5: keep the last fetched chart visible while pair/timeframe selection changes.
  // Selection remains API-silent; only NEW ANALYZE / RE-EVALUATE replaces the chart.
  $$('.nativeTfButtons button').forEach(b=>b.classList.toggle('active',b.dataset.chartTf===timeframe));
  resetViewForContext();
'@
          if(-not $s.Contains($old)){throw 'V56.5 context baseline not found'}
          $s=$s.Replace($old,$new)

          $old="async function executeNewAnalysis(fromAuto=false){`n  if(busy)return null;autoActionStartedAt=Date.now();busy=true;setBusy(true,```${fromAuto?'AUTO • ':''}NEW ANALYZE • fetching one fresh candle snapshot…```);"
          $new="async function executeNewAnalysis(fromAuto=false){`n  if(busy)return null;loadChart();autoActionStartedAt=Date.now();busy=true;setBusy(true,```${fromAuto?'AUTO • ':''}NEW ANALYZE • fetching one fresh candle snapshot…```);"
          if(-not $s.Contains($old)){throw 'V56.5 NEW ANALYZE baseline not found'}
          $s=$s.Replace($old,$new)

          $old="  busy=true;setBusy(true,```${fromAuto?'AUTO • ':''}RE-EVALUATE • testing the original signal against fresh data…```);"
          $new="  loadChart();`n  busy=true;setBusy(true,```${fromAuto?'AUTO • ':''}RE-EVALUATE • testing the original signal against fresh data…```);"
          if(-not $s.Contains($old)){throw 'V56.5 RE-EVALUATE baseline not found'}
          $s=$s.Replace($old,$new)
          [IO.File]::WriteAllText((Join-Path $PWD $p),$s,(New-Object Text.UTF8Encoding($false)))
      - name: Validate source and fixes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem -Path . -Filter *.go -File | ForEach-Object { gofmt -w $_.FullName }
          foreach($js in @('web/app.js','web/runtime-fixes.js','web/auth.js','web/v31.js','web/v558-fast.js','web/v560-mode-guard.js','web/v562-text-fix.js','web/v564-market-ui-fix.js','web/update-v001.js')) { node --check $js; if($LASTEXITCODE -ne 0){throw "JavaScript validation failed: $js"} }
          if((Get-Content VERSION -Raw).Trim() -ne 'V.56.5'){throw 'VERSION mismatch'}
          $app=Get-Content -Raw web\app.js
          foreach($m in @('V56.5: keep the last fetched chart visible','if(busy)return null;loadChart();autoActionStartedAt=Date.now()','loadChart();`n  busy=true;setBusy(true')){if(-not $app.Contains($m)){throw "V56.5 chart persistence marker missing: $m"}}
          $context=[regex]::Match($app,'async function contextChanged\(\)\{(?s:.*?)\n\}').Value
          if($context.Contains('loadChart();')){throw 'timeframe/pair selection still clears chart'}
          if($context.Contains('fetchCandles') -or $context.Contains('loadContextChart') -or $context.Contains('refreshMarketCap')){throw 'context selection must remain API-silent'}
          $v31=Get-Content -Raw web\v31.js
          if(-not $v31.Contains('/v564-market-ui-fix.js')){throw 'V56.4 market safety baseline missing'}
          if(-not $v31.Contains("bismillah.setAttribute('dir','rtl')")){throw 'Bismillah baseline missing'}
          $market=Get-Content -Raw web\v564-market-ui-fix.js
          foreach($m in @('BTC DATA','analysisBusy','syncVisibleContext','/api/public-ticker','/api/marketcap','stableTimeframe')){if(-not $market.Contains($m)){throw "V56.4 market marker missing: $m"}}
          $txt=Get-Content -Raw web\v562-text-fix.js
          foreach($m in @('restoreIcons','pairIcon','assetIcon','mhMainCopyright')){if(-not $txt.Contains($m)){throw "icon/text marker missing: $m"}}
          $fast=Get-Content -Raw web\v558-fast.js
          foreach($m in @('baseline','signalId','waitLifecycle','closedStatus','callTimes.length<3')){if(-not $fast.Contains($m)){throw "fast scalp lifecycle marker missing: $m"}}
          if($fast.Contains('900000')){throw 'legacy fast scalp 15m timing remains'}
          $idx=Get-Content -Raw web\index.html
          if($idx.Contains('data-chart-tf="20m"')){throw '20m option still present'}
          $hostSrc=Get-Content -Raw webview2_host.go
          foreach($m in @('MH Analysis','WhatsApp','Records','MH MT5','SL Adjustment: OFF','Fast Scalping: OFF','Version: V.56.5')){if(-not $hostSrc.Contains($m)){throw "native marker missing: $m"}}
          $auth=Get-Content -Raw license_auth.go
          if(-not $auth.Contains('const licAppVersion = "V.56.5"')){throw 'license version mismatch'}
          if(-not (Get-Content -Raw updater.go).Contains('const mhPublicVersionV001 = "V.56.5"')){throw 'updater version mismatch'}
          $upd=Get-Content -Raw web\update-v001.js
          if(-not $upd.Contains('setLatest(j.latest)')){throw 'dynamic latest update version missing'}
      - name: Test build installer manifest and package
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'Go tests failed'}
          New-Item -ItemType Directory -Force dist,dist-installer|Out-Null
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          if($LASTEXITCODE -ne 0 -or -not(Test-Path 'dist/MH Analysis.exe')){throw 'Windows EXE build failed'}
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not(Test-Path $iscc)){choco install innosetup -y --no-progress; if($LASTEXITCODE -ne 0){throw 'Inno Setup installation failed'}}
          $src=(Resolve-Path 'dist\MH Analysis.exe').Path
          $out=(Resolve-Path dist-installer).Path
          & $iscc '/Qp' "/DMySourceExe=$src" "/DMyOutputDir=$out" '/DMyAppVersion=V.56.5' '/DMyOutputBaseFilename=MH-Analysis-Setup-V.56.5' 'installer\MHAnalysis-V01.iss'
          if($LASTEXITCODE -ne 0){throw 'installer compilation failed'}
          $installer='dist-installer\MH-Analysis-Setup-V.56.5.exe'
          if(-not(Test-Path $installer)){throw "expected installer missing: $installer"}
          $sha=(Get-FileHash 'dist\MH Analysis.exe' -Algorithm SHA256).Hash.ToLower()
          "$sha  MH Analysis.exe"|Set-Content -Encoding ascii dist\SHA256SUMS.txt
          'V.56.5'|Set-Content -Encoding ascii dist\VERSION
          $m=[ordered]@{version='V.56.5';mandatory=$true;download_url='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%20Analysis.exe';sha256=$sha;notes='V.56.5 keeps the last fetched chart visible while browsing pair/timeframe selections. No history API call occurs on selection; NEW ANALYZE or valid RE-EVALUATE clears/replaces the old chart and uses the existing single fresh history request. Other working features are unchanged.'}|ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD 'dist\update.json'),$m,(New-Object Text.UTF8Encoding($false)))
          Compress-Archive -Path 'dist\MH Analysis.exe','dist\SHA256SUMS.txt','dist\update.json','dist\VERSION',$installer -DestinationPath 'dist\MH-Analysis-V.56.5.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V.56.5
          path: |
            dist/MH Analysis.exe
            dist/MH-Analysis-V.56.5.zip
            dist/SHA256SUMS.txt
            dist/update.json
            dist/VERSION
            dist-installer/MH-Analysis-Setup-V.56.5.exe
          if-no-files-found: error
      - name: Publish updater channel atomically
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pub"
          cp 'dist/MH Analysis.exe' "$RUNNER_TEMP/pub/MH Analysis.exe"
          cp dist/update.json "$RUNNER_TEMP/pub/update.json"
          cp dist/VERSION "$RUNNER_TEMP/pub/VERSION"
          cp dist/SHA256SUMS.txt "$RUNNER_TEMP/pub/SHA256SUMS.txt"
          cp 'dist-installer/MH-Analysis-Setup-V.56.5.exe' "$RUNNER_TEMP/pub/MH-Analysis-Setup-V.56.5.exe"
          git reset --hard HEAD
          git clean -fd
          git fetch origin mh-analysis-update-channel
          git checkout -B mh-analysis-update-channel origin/mh-analysis-update-channel
          cp "$RUNNER_TEMP/pub/MH Analysis.exe" './MH Analysis.exe'
          cp "$RUNNER_TEMP/pub/update.json" update.json
          cp "$RUNNER_TEMP/pub/VERSION" VERSION
          cp "$RUNNER_TEMP/pub/SHA256SUMS.txt" SHA256SUMS.txt
          cp "$RUNNER_TEMP/pub/MH-Analysis-Setup-V.56.5.exe" './MH-Analysis-Setup-V.56.5.exe'
          git add 'MH Analysis.exe' update.json VERSION SHA256SUMS.txt 'MH-Analysis-Setup-V.56.5.exe'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish MH Analysis V.56.5'
          git push origin mh-analysis-update-channel
      - name: Verify live updater channel
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/'
          $published=(Get-Content -Raw "$env:RUNNER_TEMP\pub\update.json")|ConvertFrom-Json
          $ok=$false
          for($i=0;$i -lt 12;$i++){
            try{
              $cb=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
              $live=(Invoke-WebRequest -UseBasicParsing ($base+'update.json?cb='+$cb)).Content|ConvertFrom-Json
              $liveVersion=(Invoke-WebRequest -UseBasicParsing ($base+'VERSION?cb='+$cb)).Content.Trim()
              if($live.version -eq 'V.56.5' -and $live.sha256 -eq $published.sha256 -and $liveVersion -eq 'V.56.5'){$ok=$true;break}
            }catch{}
            Start-Sleep -Seconds 5
          }
          if(-not $ok){throw 'live V.56.5 updater verification did not converge'}
          Write-Host 'LIVE V.56.5 updater verification PASSED'
