name: Apply V55 Clean Source

on:
  push:
    branches:
      - v55-clean-runtime
    paths:
      - '.github/workflows/apply-v55-clean-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-source:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Convert materialized runtime to V55 direct source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python .github/scripts/v55_clean_source_migration.py
          if($LASTEXITCODE -ne 0){throw 'V55 clean-source migration failed'}
          Remove-Item '.github/workflows/materialize-v55-runtime.yml' -Force -ErrorAction SilentlyContinue
          Remove-Item '.github/workflows/apply-v55-clean-source.yml' -Force -ErrorAction SilentlyContinue
          Remove-Item '.github/scripts/v55_clean_source_migration.py' -Force -ErrorAction SilentlyContinue
          gofmt -w *.go
          node --check web/app.js
          if($LASTEXITCODE -ne 0){throw 'V55 JavaScript validation failed'}
          $legacy=Get-ChildItem '.github/scripts' -Filter 'v54*_patch.py' -ErrorAction SilentlyContinue
          if($legacy){throw 'V54 patch scripts still exist after cleanup'}
          if((Get-Content VERSION -Raw).Trim() -ne 'V.55.0'){throw 'VERSION is not V.55.0'}

      - name: Test direct V55 source before commit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'V55 direct source tests failed'}
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o "$env:RUNNER_TEMP\MH Analysis V55 prepublish.exe" .
          if($LASTEXITCODE -ne 0){throw 'V55 direct source Windows build failed'}

      - name: Commit direct source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if(-not (git status --porcelain)){throw 'V55 migration produced no changes'}
          git commit -m 'V55 clean direct runtime: WhatsApp MT5 calendar recent signals'
          git push origin HEAD:v55-clean-runtime
          if($LASTEXITCODE -ne 0){throw 'Could not push V55 clean source'}
