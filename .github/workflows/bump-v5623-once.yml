name: Targeted analysis fixes and bump V5623 once

on:
  push:
    branches: [v56.3-release]
    paths:
      - '.github/workflows/bump-v5623-once.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v56.3-release
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Apply only V.56.23 requested changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          app_path=Path('web/app.js')
          app=app_path.read_text(encoding='utf-8')

          # 1. Compact direct confirmations; no bullet-per-line renderer.
          start="  $('#reasons').className='detailText';"
          rs=app.find(start)
          if rs < 0: raise SystemExit('reasons render start not found')
          end="||'—';"
          re_=app.find(end,rs)
          if re_ < 0: raise SystemExit('reasons render end not found')
          re_ += len(end)
          new_reasons="""  const bestMatches=(d.reasons||[]).filter(Boolean).slice(0,3);
          const topWarnings=(d.warnings||[]).filter(Boolean).slice(0,1);
          $('#reasons').className='detailText';
          $('#reasons').textContent=[...bestMatches,...topWarnings.map(x=>`Warning: ${x}`)].join(' — ')||'—';"""
          app=app[:rs]+new_reasons+app[re_:]

          # 2. Visible analysis completes before Record/EA/WhatsApp handoff.
          anchor='async function executeNewAnalysis(fromAuto=false){'
          if 'function waitForUiCommitV5623(){' not in app:
              ai=app.find(anchor)
              if ai < 0: raise SystemExit('NEW analysis function anchor not found')
              helper="""function waitForUiCommitV5623(){
            return new Promise(resolve=>{
              if(typeof requestAnimationFrame==='function')requestAnimationFrame(()=>requestAnimationFrame(resolve));
              else setTimeout(resolve,0);
            });
          }
          """
              app=app[:ai]+helper+app[ai:]

          old_new="    renderDecision(d,reason,'NEW');busy=false;setBusy(false);"
          if old_new not in app: raise SystemExit('NEW completion line not found')
          app=app.replace(old_new,old_new+"\n    await waitForUiCommitV5623();",1)

          old_dispatch="    if(d.signal&&!d._sameActiveSignal){dispatchUniqueSignalV36(d).catch(e=>console.warn('Background Record/EA handoff failed',e));} // V546_BACKGROUND_FANOUT"
          if old_dispatch not in app: raise SystemExit('background signal fanout line not found')
          new_dispatch="""    if(d.signal&&!d._sameActiveSignal){
              try{await dispatchUniqueSignalV36(d)}catch(e){console.warn('Record/EA handoff failed after analysis completed',e)}
            } // V5623_UI_COMMIT_BEFORE_SIGNAL_FANOUT"""
          app=app.replace(old_dispatch,new_dispatch,1)

          old_reeval="renderDecision(current,`RE-EVALUATE SIGNAL: ${status}. ${current.explanation}`,'REEVAL');busy=false;setBusy(false);"
          if old_reeval not in app: raise SystemExit('RE-EVALUATE completion line not found')
          app=app.replace(old_reeval,old_reeval+"\n    await waitForUiCommitV5623();",1)

          # 3. Reference-weighted adaptive gate: easier for genuine best setups, still blocks random trades.
          old_base='const minEdge=Math.max(4.5,s.pressureUncertainty*.75),winnerScore=Math.max(buyScore,sellScore);'
          if old_base not in app: raise SystemExit('base edge rule not found')
          app=app.replace(old_base,'const minEdge=Math.max(3,s.pressureUncertainty*.75),winnerScore=Math.max(buyScore,sellScore);',1)
          old_explain="difference ${two(edge)} is inside this timeframe's measured uncertainty ${two(s.pressureUncertainty)}."
          if old_explain not in app: raise SystemExit('base no-edge explanation not found')
          app=app.replace(old_explain,'difference ${two(edge)} does not exceed the adaptive edge requirement ${two(minEdge)} (measured uncertainty ${two(s.pressureUncertainty)}).',1)

          gate_start='  const referenceScores=referenceTests.map(t=>gatePeak(fs,dir,t)),referencePass=referenceScores.filter(x=>x>=52).length;'
          gs=app.find(gate_start)
          if gs < 0: raise SystemExit('strict evidence block start not found')
          gate_end='  return{ok,reason,checks,oppChecks,referencePass,referenceTotal:7,tacticalPass,oppositeConflicts,requiredScore,requiredEdge,edge};'
          ge=app.find(gate_end,gs)
          if ge < 0: raise SystemExit('strict evidence block end not found')
          ge += len(gate_end)
          new_gate="""  const referenceScores=referenceTests.map(t=>gatePeak(fs,dir,t)),referencePass=referenceScores.filter(x=>x>=52).length;
          const tacticalPass=['liquidity','breakout','zone','smc','ict'].filter(k=>checks[k]>=54).length;
          const structuralPass=['structure','breakout','zone','smc','ict'].filter(k=>checks[k]>=56).length;
          const corePass=['trend','structure','momentum'].filter(k=>checks[k]>=52).length;
          const strongReference=Math.max(0,...referenceScores)>=62;
          const oppositeConflicts=Object.keys(checks).filter(k=>oppChecks[k]>=70&&oppChecks[k]>=checks[k]+10).length;
          const edge=Math.abs((Number(d.buyScore)||0)-(Number(d.sellScore)||0)),requiredEdge=Math.max(3,(Number(st.pressureUncertainty)||0)*.85),requiredScore=62+(Number(session?.boost)||0),score=Number(d.signal.score)||0;
          const ok=corePass>=2&&tacticalPass>=2&&structuralPass>=2&&referencePass>=3&&strongReference&&oppositeConflicts<=1&&score>=requiredScore&&edge>requiredEdge;
          let reason='Reference-weighted confirmation passed';
          if(corePass<2)reason=`Only ${corePass}/3 core direction confirmations passed`;
          else if(tacticalPass<2)reason=`Only ${tacticalPass}/5 tactical confirmations passed`;
          else if(structuralPass<2)reason=`Only ${structuralPass}/5 structural/reference confirmations passed`;
          else if(referencePass<3)reason=`Only ${referencePass}/7 runtime reference checks aligned`;
          else if(!strongReference)reason='No strong runtime reference confirmation reached 62/100';
          else if(oppositeConflicts>1)reason=`${oppositeConflicts} strong opposite-direction conflicts detected`;
          else if(score<requiredScore)reason=`Signal quality ${score} is below adaptive ${requiredScore} requirement for ${session?.name||'current session'}`;
          else if(edge<=requiredEdge)reason=`Directional edge ${two(edge)} is not above adaptive uncertainty requirement ${two(requiredEdge)}`;
          return{ok,reason,checks,oppChecks,referencePass,referenceTotal:7,tacticalPass,structuralPass,corePass,strongReference,oppositeConflicts,requiredScore,requiredEdge,edge};"""
          app=app[:gs]+new_gate+app[ge:]
          app_path.write_text(app,encoding='utf-8',newline='\n')

          css_path=Path('web/styles.css')
          css=css_path.read_text(encoding='utf-8')
          old_css='.confirmationsInside .detailText{max-height:230px;overflow:auto;padding-right:4px}'
          if old_css not in css: raise SystemExit('confirmation scroll CSS rule not found')
          css=css.replace(old_css,'.confirmationsInside .detailText{max-height:none;overflow:visible;padding-right:0;white-space:normal}',1)
          css_path.write_text(css,encoding='utf-8',newline='\n')

          Path('VERSION').write_text('V.56.23\n',encoding='utf-8',newline='\n')
          replacements={
              'license_auth.go':(r'const licAppVersion = "V\.[0-9.]+"','const licAppVersion = "V.56.23"'),
              'updater.go':(r'const mhPublicVersionV001 = "V\.[0-9.]+"','const mhPublicVersionV001 = "V.56.23"'),
              'webview2_host.go':(r'Version: V\.[0-9.]+','Version: V.56.23'),
              'web/index.html':(r'id="mhUpdateVersionV001">V\.[0-9.]+<','id="mhUpdateVersionV001">V.56.23<'),
          }
          for fn,(pat,rep) in replacements.items():
              p=Path(fn); s=p.read_text(encoding='utf-8'); s,n=re.subn(pat,rep,s,count=1)
              if n != 1: raise SystemExit(f'version replacement failed: {fn}')
              p.write_text(s,encoding='utf-8',newline='\n')

          pub_path=Path('.github/workflows/publish-v563.yml')
          pub=pub_path.read_text(encoding='utf-8')
          pub=pub.replace('V.56.22','V.56.23').replace('V5622','V5623')
          old_markers="'STRICT VALIDATION PASSED','ACTIVE TRADE PRESERVED','independentMarketConsensus','feedUnavailable','referencePass>=5'"
          new_markers="'STRICT VALIDATION PASSED','ACTIVE TRADE PRESERVED','independentMarketConsensus','feedUnavailable','referencePass>=3','structuralPass>=2','strongReference','waitForUiCommitV5623'"
          if old_markers not in pub: raise SystemExit('publisher old safety markers not found')
          pub=pub.replace(old_markers,new_markers,1)
          pub,n=re.subn(r"notes='[^']*'","notes='V.56.23 restores compact direct best-match confirmations without an internal scrollbar, finishes the visible analysis before signal handoff, and rebalances signal qualification around core direction, structure and reference evidence while preserving independent market consensus, active-trade safety, lot-size, SL adjustment, Partial TP and Fast Scalping.'",pub,count=1)
          if n != 1: raise SystemExit('publisher release notes update failed')
          pub_path.write_text(pub,encoding='utf-8',newline='\n')
          PY

      - name: Validate V.56.23 source and unchanged protected controls
        shell: bash
        run: |
          set -euo pipefail
          node --check web/app.js
          python - <<'PY'
          from pathlib import Path
          app=Path('web/app.js').read_text(encoding='utf-8')
          css=Path('web/styles.css').read_text(encoding='utf-8')
          required=[
              'bestMatches=(d.reasons||[]).filter(Boolean).slice(0,3)',
              "join(' — ')",
              'waitForUiCommitV5623',
              'try{await dispatchUniqueSignalV36(d)}',
              'const minEdge=Math.max(3,s.pressureUncertainty*.75)',
              'corePass>=2','tacticalPass>=2','structuralPass>=2','referencePass>=3','strongReference',
              'independentMarketConsensus','STRICT VALIDATION PASSED','ACTIVE TRADE PRESERVED','feedUnavailable',
              'if(n>=83)return 0.05;','if(n>=73)return 0.04;','if(n>=66)return 0.03;','if(!lotSizeEnabled)return 0.02;'
          ]
          missing=[x for x in required if x not in app]
          if missing: raise SystemExit('missing V.56.23/protected markers: '+repr(missing))
          if '.confirmationsInside .detailText{max-height:none;overflow:visible;padding-right:0;white-space:normal}' not in css:
              raise SystemExit('compact confirmations CSS missing')
          if Path('VERSION').read_text(encoding='utf-8').strip()!='V.56.23': raise SystemExit('VERSION mismatch')
          if 'const licAppVersion = "V.56.23"' not in Path('license_auth.go').read_text(encoding='utf-8'): raise SystemExit('license version mismatch')
          if 'const mhPublicVersionV001 = "V.56.23"' not in Path('updater.go').read_text(encoding='utf-8'): raise SystemExit('updater version mismatch')
          if '/v562-text-fix.js' in Path('web/index.html').read_text(encoding='utf-8'): raise SystemExit('runtime text patch must remain disabled')
          if 'ACTIVE_TRADE_REVERSAL_LOCK' not in Path('ea_signal_bridge.go').read_text(encoding='utf-8'): raise SystemExit('EA reversal lock missing')
          if 'FAST_ACTIVE_EXPOSURE_LOCK' not in Path('ea_modes_v558.go').read_text(encoding='utf-8'): raise SystemExit('Fast exposure lock missing')
          pub=Path('.github/workflows/publish-v563.yml').read_text(encoding='utf-8')
          for x in ['V.56.23','referencePass>=3','structuralPass>=2','strongReference','waitForUiCommitV5623']:
              if x not in pub: raise SystemExit('publisher marker missing: '+x)
          PY
          go test ./...

      - name: Commit V.56.23 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app.js web/styles.css VERSION license_auth.go updater.go webview2_host.go web/index.html .github/workflows/publish-v563.yml
          git commit -m 'Release MH Analysis V.56.23 targeted analysis fixes'
          git fetch origin v56.3-release
          git rebase origin/v56.3-release
          git push origin HEAD:v56.3-release
