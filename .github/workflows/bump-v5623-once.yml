name: Targeted analysis fixes and bump V5623 once

on:
  push:
    branches: [v56.3-release]
    paths:
      - '.github/workflows/bump-v5623-once.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v56.3-release
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Apply only V.56.23 requested analysis fixes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          function Decode([string]$b){[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($b))}
          $appPath='web/app.js'
          $app=Get-Content -Raw -Encoding UTF8 $appPath

          $rStart="  `$('#reasons').className='detailText';"
          $rs=$app.IndexOf($rStart)
          if($rs -lt 0){throw 'reasons render start not found'}
          $rEnd="||'—';"
          $re=$app.IndexOf($rEnd,$rs)
          if($re -lt 0){throw 'reasons render end not found'}
          $re += $rEnd.Length
          $newReasons=Decode('')
          $app=$app.Substring(0,$rs)+$newReasons+$app.Substring($re)

          if(-not $app.Contains('function waitForUiCommitV5623(){')){
            $anchor='async function executeNewAnalysis(fromAuto=false){'
            $ai=$app.IndexOf($anchor)
            if($ai -lt 0){throw 'NEW analysis function anchor not found'}
            $helper=Decode('ZnVuY3Rpb24gd2FpdEZvclVpQ29tbWl0VjU2MjMoKXsKICByZXR1cm4gbmV3IFByb21pc2UocmVzb2x2ZT0+ewogICAgaWYodHlwZW9mIHJlcXVlc3RBbmltYXRpb25GcmFtZT09PSdmdW5jdGlvbicpcmVxdWVzdEFuaW1hdGlvbkZyYW1lKCgpPT5yZXF1ZXN0QW5pbWF0aW9uRnJhbWUocmVzb2x2ZSkpOwogICAgZWxzZSBzZXRUaW1lb3V0KHJlc29sdmUsMCk7CiAgfSk7Cn0K')
            $app=$app.Substring(0,$ai)+$helper+$app.Substring($ai)
          }
          $oldNew="    renderDecision(d,reason,'NEW');busy=false;setBusy(false);"
          if(-not $app.Contains($oldNew)){throw 'NEW completion line not found'}
          $app=$app.Replace($oldNew,$oldNew+"`n    await waitForUiCommitV5623();")
          $oldDispatch="    if(d.signal&&!d._sameActiveSignal){dispatchUniqueSignalV36(d).catch(e=>console.warn('Background Record/EA handoff failed',e));} // V546_BACKGROUND_FANOUT"
          if(-not $app.Contains($oldDispatch)){throw 'background signal fanout line not found'}
          $newDispatch=Decode('ICAgIGlmKGQuc2lnbmFsJiYhZC5fc2FtZUFjdGl2ZVNpZ25hbCl7CiAgICAgIHRyeXthd2FpdCBkaXNwYXRjaFVuaXF1ZVNpZ25hbFYzNihkKX1jYXRjaChlKXtjb25zb2xlLndhcm4oJ1JlY29yZC9FQSBoYW5kb2ZmIGZhaWxlZCBhZnRlciBhbmFseXNpcyBjb21wbGV0ZWQnLGUpfQogICAgfSAvLyBWNTYyM19VSV9DT01NSVRfQkVGT1JFX1NJR05BTF9GQU5PVVQ=')
          $app=$app.Replace($oldDispatch,$newDispatch)
          $oldReeval=Decode('cmVuZGVyRGVjaXNpb24oY3VycmVudCxgUkUtRVZBTFVBVEUgU0lHTkFMOiAke3N0YXR1c30uICR7Y3VycmVudC5leHBsYW5hdGlvbn1gLCdSRUVWQUwnKTtidXN5PWZhbHNlO3NldEJ1c3koZmFsc2UpOw==')
          if(-not $app.Contains($oldReeval)){throw 'RE-EVALUATE completion line not found'}
          $app=$app.Replace($oldReeval,$oldReeval+"`n    await waitForUiCommitV5623();")

          $oldBase='const minEdge=Math.max(4.5,s.pressureUncertainty*.75),winnerScore=Math.max(buyScore,sellScore);'
          if(-not $app.Contains($oldBase)){throw 'base edge rule not found'}
          $app=$app.Replace($oldBase,'const minEdge=Math.max(3,s.pressureUncertainty*.75),winnerScore=Math.max(buyScore,sellScore);')
          $oldExplain='difference ${two(edge)} is inside this timeframe''s measured uncertainty ${two(s.pressureUncertainty)}.'
          if(-not $app.Contains($oldExplain)){throw 'base no-edge explanation not found'}
          $app=$app.Replace($oldExplain,'difference ${two(edge)} does not exceed the adaptive edge requirement ${two(minEdge)} (measured uncertainty ${two(s.pressureUncertainty)}).')

          $gateStart='  const referenceScores=referenceTests.map(t=>gatePeak(fs,dir,t)),referencePass=referenceScores.filter(x=>x>=52).length;'
          $gs=$app.IndexOf($gateStart)
          if($gs -lt 0){throw 'strict evidence block start not found'}
          $gateEnd='  return{ok,reason,checks,oppChecks,referencePass,referenceTotal:7,tacticalPass,oppositeConflicts,requiredScore,requiredEdge,edge};'
          $ge=$app.IndexOf($gateEnd,$gs)
          if($ge -lt 0){throw 'strict evidence block end not found'}
          $ge += $gateEnd.Length
          $newGate=Decode('')
          $app=$app.Substring(0,$gs)+$newGate+$app.Substring($ge)
          [IO.File]::WriteAllText((Join-Path $PWD $appPath),$app,(New-Object Text.UTF8Encoding($false)))

          $cssPath='web/styles.css'
          $css=Get-Content -Raw -Encoding UTF8 $cssPath
          $oldCss='.confirmationsInside .detailText{max-height:230px;overflow:auto;padding-right:4px}'
          if(-not $css.Contains($oldCss)){throw 'confirmation scroll CSS rule not found'}
          $css=$css.Replace($oldCss,'.confirmationsInside .detailText{max-height:none;overflow:visible;padding-right:0;white-space:normal}')
          [IO.File]::WriteAllText((Join-Path $PWD $cssPath),$css,(New-Object Text.UTF8Encoding($false)))

      - name: Update application identities and publisher to V.56.23
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          [IO.File]::WriteAllText((Join-Path $PWD 'VERSION'),'V.56.23'+[Environment]::NewLine,(New-Object Text.UTF8Encoding($false)))
          $p='license_auth.go';$s=Get-Content -Raw $p;$s=[regex]::Replace($s,'const licAppVersion = "V\.[0-9.]+"','const licAppVersion = "V.56.23"',1);[IO.File]::WriteAllText((Join-Path $PWD $p),$s,(New-Object Text.UTF8Encoding($false)))
          $p='updater.go';$s=Get-Content -Raw $p;$s=[regex]::Replace($s,'const mhPublicVersionV001 = "V\.[0-9.]+"','const mhPublicVersionV001 = "V.56.23"',1);[IO.File]::WriteAllText((Join-Path $PWD $p),$s,(New-Object Text.UTF8Encoding($false)))
          $p='webview2_host.go';$s=Get-Content -Raw $p;$s=[regex]::Replace($s,'Version: V\.[0-9.]+','Version: V.56.23');[IO.File]::WriteAllText((Join-Path $PWD $p),$s,(New-Object Text.UTF8Encoding($false)))
          $p='web/index.html';$s=Get-Content -Raw $p;$s=[regex]::Replace($s,'id="mhUpdateVersionV001">V\.[0-9.]+<','id="mhUpdateVersionV001">V.56.23<',1);[IO.File]::WriteAllText((Join-Path $PWD $p),$s,(New-Object Text.UTF8Encoding($false)))
          $p='.github/workflows/publish-v563.yml';$y=Get-Content -Raw -Encoding UTF8 $p
          $y=$y.Replace('V.56.22','V.56.23').Replace('V5622','V5623')
          $oldMarkers="'STRICT VALIDATION PASSED','ACTIVE TRADE PRESERVED','independentMarketConsensus','feedUnavailable','referencePass>=5'"
          $newMarkers="'STRICT VALIDATION PASSED','ACTIVE TRADE PRESERVED','independentMarketConsensus','feedUnavailable','referencePass>=3','structuralPass>=2','strongReference','waitForUiCommitV5623'"
          if(-not $y.Contains($oldMarkers)){throw 'publisher old safety markers not found'}
          $y=$y.Replace($oldMarkers,$newMarkers)
          $notesPattern="notes='[^']*'"
          $notes="notes='V.56.23 restores compact direct best-match confirmations without an internal scrollbar, finishes the visible analysis before signal handoff, and rebalances signal qualification around core direction, structure and reference evidence while preserving independent market consensus, active-trade safety, lot-size, SL adjustment, Partial TP and Fast Scalping.'"
          $y=[regex]::Replace($y,$notesPattern,$notes,1)
          [IO.File]::WriteAllText((Join-Path $PWD $p),$y,(New-Object Text.UTF8Encoding($false)))

      - name: Validate only requested V.56.23 changes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check web/app.js
          if($LASTEXITCODE -ne 0){throw 'app.js syntax validation failed'}
          $app=Get-Content -Raw web\app.js
          foreach($m in @('bestMatches=(d.reasons||[]).filter(Boolean).slice(0,3)','join('' — '')','waitForUiCommitV5623','try{await dispatchUniqueSignalV36(d)}','const minEdge=Math.max(3,s.pressureUncertainty*.75)','corePass>=2','tacticalPass>=2','structuralPass>=2','referencePass>=3','strongReference','independentMarketConsensus','STRICT VALIDATION PASSED','ACTIVE TRADE PRESERVED','feedUnavailable')){if(-not $app.Contains($m)){throw "V.56.23 marker missing: $m"}}
          $css=Get-Content -Raw web\styles.css
          if(-not $css.Contains('.confirmationsInside .detailText{max-height:none;overflow:visible;padding-right:0;white-space:normal}')){throw 'compact confirmations CSS missing'}
          if((Get-Content VERSION -Raw).Trim() -ne 'V.56.23'){throw 'VERSION mismatch'}
          if(-not (Get-Content -Raw license_auth.go).Contains('const licAppVersion = "V.56.23"')){throw 'license version mismatch'}
          if(-not (Get-Content -Raw updater.go).Contains('const mhPublicVersionV001 = "V.56.23"')){throw 'updater version mismatch'}
          $html=Get-Content -Raw web\index.html
          if($html.Contains('/v562-text-fix.js')){throw 'runtime text patch must remain disabled'}
          foreach($m in @('if(n>=83)return 0.05;','if(n>=73)return 0.04;','if(n>=66)return 0.03;','if(!lotSizeEnabled)return 0.02;')){if(-not $app.Contains($m)){throw "lot mapping changed unexpectedly: $m"}}
          if(-not (Get-Content -Raw ea_signal_bridge.go).Contains('ACTIVE_TRADE_REVERSAL_LOCK')){throw 'EA reversal lock missing'}
          if(-not (Get-Content -Raw ea_modes_v558.go).Contains('FAST_ACTIVE_EXPOSURE_LOCK')){throw 'Fast exposure lock missing'}
          $pub=Get-Content -Raw .github\workflows\publish-v563.yml
          foreach($m in @('V.56.23','referencePass>=3','structuralPass>=2','strongReference','waitForUiCommitV5623')){if(-not $pub.Contains($m)){throw "publisher validation missing: $m"}}
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'Go tests failed'}

      - name: Commit V.56.23 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app.js web/styles.css VERSION license_auth.go updater.go webview2_host.go web/index.html .github/workflows/publish-v563.yml
          git commit -m 'Release MH Analysis V.56.23 targeted analysis fixes'
          git fetch origin v56.3-release
          git rebase origin/v56.3-release
          git push origin HEAD:v56.3-release
