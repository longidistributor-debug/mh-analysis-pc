name: Harden signal validation once

on:
  push:
    branches: [v56.3-release]
    paths:
      - '.github/workflows/harden-signal-engine-once.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v56.3-release
          fetch-depth: 0

      - name: Patch strict signal validation
        run: |
          echo '' | base64 -d > /tmp/harden.py
          python /tmp/harden.py
          gofmt -w main.go news_risk.go market_consensus.go
          node --check web/app.js
          node --check web/v558-fast.js

      - name: Verify hard gates
        run: |
          grep -F 'STRICT VALIDATION PASSED' web/app.js
          grep -F 'referencePass>=5' web/app.js
          grep -F 'api.available!==true' web/app.js
          grep -F '/api/market-consensus' main.go
          grep -F 'window.__MH_LAST_DECISION__' web/app.js
          grep -F 'g?.consensus?.ok!==true' web/v558-fast.js
          grep -F '"available":        false' news_risk.go

      - name: Commit hardened engine and remove one-time workflow
        run: |
          rm .github/workflows/harden-signal-engine-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app.js web/v558-fast.js main.go news_risk.go market_consensus.go .github/workflows/harden-signal-engine-once.yml
          git commit -m "Harden signal engine with strict multi-layer validation"
          git push origin HEAD:v56.3-release
