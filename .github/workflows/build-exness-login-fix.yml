name: Build FINAL V79.6 Exness Login Fix

on:
  workflow_dispatch:
  push:
    branches: [exness-login-fix]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Apply verified baseline + Records + Exness
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python desktop/manual_timeframe_no_api_patch.py
          python desktop/branding_text_patch.py
          python desktop/header_center_layout_patch.py
          python desktop/records_feature_patch.py
          python desktop/exness_feature_patch.py
          python desktop/exness_login_focus_flicker_patch.py
          node --check web/app.js
          $host=Get-Content -Raw chrome_host.go
          $bridge=Get-Content -Raw exness_bridge.go
          if($host -notmatch 'chLaunchBrowserQuiet'){throw 'quiet Exness launch missing'}
          if($host -notmatch 'HideWindow:true'){throw 'hidden GUI launch missing'}
          if($host -notmatch 'chSetFocus.Call\(exness\)'){throw 'Exness keyboard focus fix missing'}
          if($host -notmatch 'if which == 4 \{ go func\(\)\{ _ = chEnsureExnessBrowser\(\) \}\(\) \}'){throw 'lazy Exness launch missing'}
          if($bridge -notmatch 'exnessApplyLoginCleanup'){throw 'login cleanup missing'}
          if($bridge -notmatch 'sign in with google'){throw 'Google login hide rule missing'}
          if($bridge -notmatch 'forgot password'){throw 'forgot-password hide rule missing'}
          if($bridge -match "clickText\(\[[^\]]*Place order"){throw 'unsafe Place order click automation found'}
          if($bridge -match "clickText\(\[[^\]]*Confirm"){throw 'unsafe Confirm click automation found'}
          Write-Host 'PASS Exness login/focus/flicker source guards'

      - name: Build Windows x64 EXE
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w main.go chrome_host.go records.go exness_bridge.go dpi_windows.go
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          sha256sum 'dist/MH Analysis.exe' | tee dist/SHA256SUMS.txt
          powershell -NoProfile -Command "Compress-Archive -Path 'dist/MH Analysis.exe','dist/SHA256SUMS.txt' -DestinationPath 'dist/MH-Analysis-V79.6-Exness-Login-Fix.zip' -Force"

      - name: Existing app startup/restart regression
        shell: powershell
        run: desktop/runtime_seamless_test.ps1

      - name: Verify Exness lazy launch and fourth tab
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:MH_SMOKE_TEST='1'
          Add-Type @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class ExLoginWin {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumChildWindows(IntPtr parent, EnumProc cb, IntPtr lp);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h,uint m,IntPtr w,IntPtr l);
          }
          '@
          $p=Start-Process -FilePath (Resolve-Path 'dist/MH Analysis.exe') -PassThru
          try {
            for($i=0;$i -lt 60;$i++){$p.Refresh();if($p.MainWindowHandle -ne 0){break};Start-Sleep -Milliseconds 250}
            [IntPtr]$h=$p.MainWindowHandle;if($h -eq [IntPtr]::Zero){throw 'host missing'}
            Start-Sleep -Seconds 3
            $pre=Get-CimInstance Win32_Process -ErrorAction SilentlyContinue|Where-Object{($_.Name -eq 'chrome.exe' -or $_.Name -eq 'msedge.exe') -and $_.CommandLine -match 'ExnessProfile'}|Select-Object -First 1
            if($pre){throw 'Exness browser launched before tab click; startup flicker regression'}
            $script:buttons=@()
            [ExLoginWin]::EnumChildWindows($h,{param($w,$l)$cls=New-Object Text.StringBuilder 80;[void][ExLoginWin]::GetClassName($w,$cls,80);if($cls.ToString() -eq 'Button'){$txt=New-Object Text.StringBuilder 120;[void][ExLoginWin]::GetWindowText($w,$txt,120);$script:buttons += $txt.ToString()};return $true},[IntPtr]::Zero)|Out-Null
            foreach($need in @('MH Analysis','WhatsApp','Records','Exness')){if($script:buttons -notcontains $need){throw "native $need button missing"}}
            [ExLoginWin]::PostMessage($h,0x0111,[IntPtr]1004,[IntPtr]::Zero)|Out-Null
            $bp=$null
            for($i=0;$i -lt 80;$i++){
              $bp=Get-CimInstance Win32_Process -ErrorAction SilentlyContinue|Where-Object{($_.Name -eq 'chrome.exe' -or $_.Name -eq 'msedge.exe') -and $_.CommandLine -match '--app=https://my\.exness\.global/webtrading/' -and $_.CommandLine -match 'ExnessProfile'}|Select-Object -First 1
              if($bp){break};Start-Sleep -Milliseconds 250
            }
            if(-not $bp){throw 'Exness browser did not launch after tab click'}
            Write-Host 'PASS Exness is lazy-launched only after tab click with persistent profile'
          } finally {
            try{$ls=Get-NetTCPConnection -State Listen -OwningProcess $p.Id -ErrorAction SilentlyContinue|Where-Object{$_.LocalAddress -eq '127.0.0.1'}|Select-Object -First 1;if($ls){Invoke-WebRequest "http://127.0.0.1:$($ls.LocalPort)/api/shutdown" -UseBasicParsing -TimeoutSec 2|Out-Null}}catch{}
            Start-Sleep -Seconds 2
            if(!$p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
            Remove-Item Env:MH_SMOKE_TEST -ErrorAction SilentlyContinue
          }

      - name: Verify Records + DPI retained
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=Get-Content -Raw web/records.html
          if($src -notmatch 'ACCURACY CHECK'){throw 'Records regression'}
          $dpi=Get-Content -Raw dpi_windows.go
          if($dpi -notmatch 'SetProcessDpiAwarenessContext'){throw 'DPI regression'}
          Write-Host 'PASS Records + DPI retained'

      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V79.6-Exness-Login-Fix-FINAL
          path: |
            dist/MH Analysis.exe
            dist/MH-Analysis-V79.6-Exness-Login-Fix.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish EXE-only final branch and remove work branch
        shell: bash
        run: |
          set -euo pipefail
          cp 'dist/MH Analysis.exe' "$RUNNER_TEMP/MH Analysis.exe"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan __exness_login_fix_final
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP/MH Analysis.exe" './MH Analysis.exe'
          git add 'MH Analysis.exe'
          git commit -m 'MH Analysis V79.6 Exness login focus fix final EXE only'
          git push --force origin HEAD:final-current-v796
          git push origin --delete exness-login-fix
          echo 'PASS final-current-v796 contains only verified fixed EXE'
