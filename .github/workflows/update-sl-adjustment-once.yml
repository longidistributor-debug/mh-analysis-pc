name: Update SL adjustment values once

on:
  push:
    branches: [v56.3-release]
    paths:
      - '.github/workflows/update-sl-adjustment-once.yml'

permissions:
  contents: write

jobs:
  update-sl-adjustment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v56.3-release
          fetch-depth: 0

      - name: Replace only SL adjustment values
        shell: python
        run: |
          from pathlib import Path
          p = Path('ea_signal_bridge.go')
          s = p.read_text(encoding='utf-8')
          old = '''\t\tadd := 12.0
\t\tif q.Lot <= 0.02 { add = 6 } else if q.Lot <= 0.03 { add = 7 } else if q.Lot <= 0.04 { add = 8 } else if q.Lot <= 0.05 { add = 9 }
'''
          new = '''\t\tadd := 6.99
\t\tif q.Lot <= 0.02 { add = 3.88 } else if q.Lot <= 0.03 { add = 4.99 } else if q.Lot <= 0.04 { add = 5.99 } else if q.Lot <= 0.05 { add = 6.99 }
'''
          if old not in s:
              raise SystemExit('Expected SL adjustment block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Verify exact new SL mapping
        shell: python
        run: |
          from pathlib import Path
          s = Path('ea_signal_bridge.go').read_text(encoding='utf-8')
          required = [
              'if q.Lot <= 0.02 { add = 3.88 }',
              'else if q.Lot <= 0.03 { add = 4.99 }',
              'else if q.Lot <= 0.04 { add = 5.99 }',
              'else if q.Lot <= 0.05 { add = 6.99 }',
          ]
          for x in required:
              assert x in s, x
          assert 'if strings.HasPrefix(q.Type,"BUY") { q.SL -= add } else if strings.HasPrefix(q.Type,"SELL") { q.SL += add }' in s

      - name: Commit source change and remove one-time workflow
        run: |
          rm .github/workflows/update-sl-adjustment-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ea_signal_bridge.go .github/workflows/update-sl-adjustment-once.yml
          git commit -m "Update automatic SL adjustment by lot size"
          git push origin HEAD:v56.3-release
