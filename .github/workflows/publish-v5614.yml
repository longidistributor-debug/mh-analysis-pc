name: Publish V5614 Release
on:
  push:
    branches: [v56.14-release]
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v56.14-release
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Normalize V56.14 identities
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='license_auth.go';$s=Get-Content -Raw $p;$s=$s.Replace('const licAppVersion = "V.55.8"','const licAppVersion = "V.56.14"');[IO.File]::WriteAllText((Join-Path $PWD $p),$s,(New-Object Text.UTF8Encoding($false)))
          $p='updater.go';$s=Get-Content -Raw $p;$s=$s.Replace('const mhPublicVersionV001 = "V.55.9"','const mhPublicVersionV001 = "V.56.14"');[IO.File]::WriteAllText((Join-Path $PWD $p),$s,(New-Object Text.UTF8Encoding($false)))
          $p='webview2_host.go';$s=Get-Content -Raw $p;$s=$s.Replace('Version: V.55.8','Version: V.56.14');[IO.File]::WriteAllText((Join-Path $PWD $p),$s,(New-Object Text.UTF8Encoding($false)))
          $p='web/index.html';$s=Get-Content -Raw $p;$s=$s.Replace('id="mhUpdateVersionV001">V.55.8<','id="mhUpdateVersionV001">V.56.14<');$s=$s.Replace('<button data-chart-tf="20m">20m</button>','');[IO.File]::WriteAllText((Join-Path $PWD $p),$s,(New-Object Text.UTF8Encoding($false)))
      - name: Apply preserved upgrades and V56.14 fixes
        shell: bash
        run: |
          node scripts/v565-chart-persist.js
          node scripts/v566-isolation.js
          node scripts/v567-mt5-path-reselect.js
          node scripts/v568-advanced-strategies.js
          node scripts/v568-syntax-hotfix.js
          node scripts/v569-precision-context.js
          node scripts/v569-syntax-hotfix.js
          node scripts/v569-go-hotfix.js
          node scripts/v5610-api-pairtf-safety.js
          node scripts/v5611-primary-candle-hotfix.js
          node scripts/v5612-direct-market-snapshot.js
          node scripts/v5613-provider-budget.js
          node scripts/v5614-reliability-fixes.js
          node scripts/v5614-ea-runtime-recovery.js
      - name: Assemble EA V1.37 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ea
          cat ea_source/v137.part*.b64 | base64 -d | gzip -d > 'ea/MH_Analysis_Decoder_v1.37_Reliable_Pending_SL_Partial.mq5'
          test -s 'ea/MH_Analysis_Decoder_v1.37_Reliable_Pending_SL_Partial.mq5'
      - name: Validate V56.14 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem -Path . -Filter *.go -File | ForEach-Object { gofmt -w $_.FullName }
          foreach($js in @('web/app.js','web/v564-market-ui-fix.js','scripts/v5613-provider-budget.js','scripts/v5614-reliability-fixes.js','scripts/v5614-ea-runtime-recovery.js')) { node --check $js; if($LASTEXITCODE -ne 0){throw "JavaScript validation failed: $js"} }
          if((Get-Content VERSION -Raw).Trim() -ne 'V.56.14'){throw 'VERSION mismatch'}
          $main=Get-Content -Raw main.go
          foreach($m in @('const providerMaxRequestsPerMinute = 3','func reserveProviderCalls(n int)')){if(-not $main.Contains($m)){throw "provider budget marker missing: $m"}}
          $ctx=Get-Content -Raw analysis_context_v569.go
          foreach($m in @('reserveProviderCalls(3)','FCS 3-call minute budget is still cooling down','external_api_calls": 3','FCS direct precision snapshot')){if(-not $ctx.Contains($m)){throw "precision snapshot marker missing: $m"}}
          $app=Get-Content -Raw web\app.js
          foreach($m in @('function v5614SyncVisibleContext()','Manual selection • 0 FCS calls','function v569HTFFamilies(c,m,s)','v569ApplyExecutionFilters(d,c)','function v5610PairTimeframeExposure','Other timeframes remain independent.','V5614_RELIABLE_EA_FANOUT','d._sameSignalId=j.existing_signal_id','if(n>=83)return 0.05','if(n>=73)return 0.04','if(n>=66)return 0.03')){if(-not $app.Contains($m)){throw "analysis/UI/EA marker missing: $m"}}
          if($app.Contains('if(n>=95)return 0.06')){throw 'old 0.06 auto-lot tier still present'}
          $c1=$app.IndexOf('async function contextChanged(){');$c2=$app.IndexOf("`n}",$c1);if($c1 -lt 0 -or $c2 -lt 0){throw 'contextChanged missing'};$cb=$app.Substring($c1,$c2-$c1)
          foreach($bad in @('fetchCandles','analysis-snapshot-v569','/api/history')){if($cb.Contains($bad)){throw "manual context switch is not API-silent: $bad"}}
          $records=Get-Content -Raw records_mt5_local.go
          foreach($m in @('PartialTP','json:"partial_tp"','x.PartialTP == q.PartialTP')){if(-not $records.Contains($m)){throw "Record partial-mode identity missing: $m"}}
          $bridge=Get-Content -Raw ea_signal_bridge.go
          foreach($m in @('PARTIAL_TP|TIMEFRAME','json:"timeframe"','q.Timeframe','V56.14: send RAW analysis SL unchanged')){if(-not $bridge.Contains($m)){throw "EA bridge marker missing: $m"}}
          if($bridge.Contains('if v558Snapshot().SLAdjustment && q.Lot >= 0.02')){throw 'old app-side SL double adjustment still present'}
          $modes=Get-Content -Raw ea_modes_v558.go
          foreach($m in @('V56.14 startup synchronization','"V.56.14"','SLAdjustment','FastScalping')){if(-not $modes.Contains($m)){throw "mode marker missing: $m"}}
          $selector=Get-Content -Raw mt5_selector_v566.go
          foreach($m in @('terminal64.exe;terminal.exe','Do not select an MT5 shortcut','SELECT MT5 PATH','v567HandleMT5Button','wmMT5ReselectV567')){if(-not $selector.Contains($m)){throw "MT5 selector marker missing: $m"}}
          $embed=Get-Content -Raw mt5_embed_v36.go
          foreach($m in @('V56.14 stale selected-window recovery','time.Now().Add(35 * time.Second)','v566FindWindowForPath(path)','No other MT5 terminal was touched')){if(-not $embed.Contains($m)){throw "MT5 reliability/isolation marker missing: $m"}}
          $ea=Get-Content -Raw 'ea\MH_Analysis_Decoder_v1.37_Reliable_Pending_SL_Partial.mq5'
          foreach($m in @('#property version   "1.37"','V137EntryProtectionOffset = 2.50','V137TP1LockAdvance        = 6.50','RecentMailboxSignalV137','V137AdjustedManagedSL','(tp2-entry)*0.40','PositionClosePartial','POSITION_MAGIC) != MagicNumber','FastScalpMagicNumber')){if(-not $ea.Contains($m)){throw "EA V1.37 marker missing: $m"}}
          $v31=Get-Content -Raw web\v31.js
          if(-not $v31.Contains("bismillah.setAttribute('dir','rtl')")){throw 'Bismillah baseline missing'}
          if(-not (Get-Content -Raw license_auth.go).Contains('const licAppVersion = "V.56.14"')){throw 'license version mismatch'}
          if(-not (Get-Content -Raw updater.go).Contains('const mhPublicVersionV001 = "V.56.14"')){throw 'updater version mismatch'}
      - name: Test build installer manifest and package
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'Go tests failed'}
          New-Item -ItemType Directory -Force dist,dist-installer|Out-Null
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          if($LASTEXITCODE -ne 0 -or -not(Test-Path 'dist/MH Analysis.exe')){throw 'Windows EXE build failed'}
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not(Test-Path $iscc)){choco install innosetup -y --no-progress; if($LASTEXITCODE -ne 0){throw 'Inno Setup installation failed'}}
          $src=(Resolve-Path 'dist\MH Analysis.exe').Path
          $out=(Resolve-Path dist-installer).Path
          & $iscc '/Qp' "/DMySourceExe=$src" "/DMyOutputDir=$out" '/DMyAppVersion=V.56.14' '/DMyOutputBaseFilename=MH-Analysis-Setup-V.56.14' 'installer\MHAnalysis-V01.iss'
          if($LASTEXITCODE -ne 0){throw 'installer compilation failed'}
          $installer='dist-installer\MH-Analysis-Setup-V.56.14.exe'
          if(-not(Test-Path $installer)){throw "expected installer missing: $installer"}
          $sha=(Get-FileHash 'dist\MH Analysis.exe' -Algorithm SHA256).Hash.ToLower()
          "$sha  MH Analysis.exe"|Set-Content -Encoding ascii dist\SHA256SUMS.txt
          'V.56.14'|Set-Content -Encoding ascii dist\VERSION
          $notes='V.56.14 fixes BTC/XAU context, exact MT5 terminal startup, and the EA handoff path. Same-signal Records now safely retry the same EA signal_id instead of suppressing a missing pending order, and Partial TP ON/OFF is included in duplicate identity. Auto lot is 0-65=0.02, 66-72=0.03, 73-82=0.04, 83-100=0.05. EA V1.37 source is included: SL Adjustment is EA-owned, 40% of Entry-to-TP2 closes half, the remainder is protected at Entry +/- 2.50, then after another 6.50 beyond TP1 SL locks to TP1. Manual trades and Fast Scalping remain isolated. EA source is included but is not precompiled to EX5.'
          $m=[ordered]@{version='V.56.14';mandatory=$true;download_url='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%20Analysis.exe';sha256=$sha;notes=$notes}|ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD 'dist\update.json'),$m,(New-Object Text.UTF8Encoding($false)))
          Compress-Archive -Path 'dist\MH Analysis.exe','dist\SHA256SUMS.txt','dist\update.json','dist\VERSION',$installer,'ea\MH_Analysis_Decoder_v1.37_Reliable_Pending_SL_Partial.mq5' -DestinationPath 'dist\MH-Analysis-V.56.14.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V.56.14
          path: |
            dist/MH Analysis.exe
            dist/MH-Analysis-V.56.14.zip
            dist/SHA256SUMS.txt
            dist/update.json
            dist/VERSION
            dist-installer/MH-Analysis-Setup-V.56.14.exe
            ea/MH_Analysis_Decoder_v1.37_Reliable_Pending_SL_Partial.mq5
          if-no-files-found: error
      - name: Publish updater channel atomically
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pub"
          cp 'dist/MH Analysis.exe' "$RUNNER_TEMP/pub/MH Analysis.exe"
          cp dist/update.json "$RUNNER_TEMP/pub/update.json"
          cp dist/VERSION "$RUNNER_TEMP/pub/VERSION"
          cp dist/SHA256SUMS.txt "$RUNNER_TEMP/pub/SHA256SUMS.txt"
          cp 'dist-installer/MH-Analysis-Setup-V.56.14.exe' "$RUNNER_TEMP/pub/MH-Analysis-Setup-V.56.14.exe"
          cp 'ea/MH_Analysis_Decoder_v1.37_Reliable_Pending_SL_Partial.mq5' "$RUNNER_TEMP/pub/MH_Analysis_Decoder_v1.37_Reliable_Pending_SL_Partial.mq5"
          git reset --hard HEAD
          git clean -fd
          git fetch origin mh-analysis-update-channel
          git checkout -B mh-analysis-update-channel origin/mh-analysis-update-channel
          cp "$RUNNER_TEMP/pub/MH Analysis.exe" './MH Analysis.exe'
          cp "$RUNNER_TEMP/pub/update.json" update.json
          cp "$RUNNER_TEMP/pub/VERSION" VERSION
          cp "$RUNNER_TEMP/pub/SHA256SUMS.txt" SHA256SUMS.txt
          cp "$RUNNER_TEMP/pub/MH-Analysis-Setup-V.56.14.exe" './MH-Analysis-Setup-V.56.14.exe'
          cp "$RUNNER_TEMP/pub/MH_Analysis_Decoder_v1.37_Reliable_Pending_SL_Partial.mq5" './MH_Analysis_Decoder_v1.37_Reliable_Pending_SL_Partial.mq5'
          git add 'MH Analysis.exe' update.json VERSION SHA256SUMS.txt 'MH-Analysis-Setup-V.56.14.exe' 'MH_Analysis_Decoder_v1.37_Reliable_Pending_SL_Partial.mq5'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish MH Analysis V.56.14 with EA V1.37 source'
          git push origin mh-analysis-update-channel
      - name: Verify published updater branch
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(python -c "import json;print(json.load(open(r'$RUNNER_TEMP/pub/update.json'))['sha256'])")"
          git fetch origin mh-analysis-update-channel
          live_version="$(git show origin/mh-analysis-update-channel:VERSION | tr -d '\r\n')"
          live_json="$(git show origin/mh-analysis-update-channel:update.json)"
          git show origin/mh-analysis-update-channel:MH_Analysis_Decoder_v1.37_Reliable_Pending_SL_Partial.mq5 | grep -F '#property version   "1.37"' >/dev/null
          LIVE_JSON="$live_json" EXPECTED_SHA="$expected_sha" LIVE_VERSION="$live_version" python - <<'PY'
          import json,os
          j=json.loads(os.environ['LIVE_JSON'])
          if os.environ['LIVE_VERSION']!='V.56.14' or j.get('version')!='V.56.14' or j.get('sha256')!=os.environ['EXPECTED_SHA']:
              raise SystemExit('published V56.14 updater branch verification failed')
          print('PUBLISHED V.56.14 updater branch + EA V1.37 source verification PASSED')
          PY
