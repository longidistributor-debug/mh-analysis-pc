name: Bump V5620 source once

on:
  push:
    branches: [v56.3-release]
    paths:
      - '.github/workflows/bump-v5620-once.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v56.3-release
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Update application identities to V.56.20
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          [IO.File]::WriteAllText((Join-Path $PWD 'VERSION'),'V.56.20'+[Environment]::NewLine,(New-Object Text.UTF8Encoding($false)))
          $p='license_auth.go';$s=Get-Content -Raw $p;$s=[regex]::Replace($s,'const licAppVersion = "V\.[0-9.]+"','const licAppVersion = "V.56.20"',1);[IO.File]::WriteAllText((Join-Path $PWD $p),$s,(New-Object Text.UTF8Encoding($false)))
          $p='updater.go';$s=Get-Content -Raw $p;$s=[regex]::Replace($s,'const mhPublicVersionV001 = "V\.[0-9.]+"','const mhPublicVersionV001 = "V.56.20"',1);[IO.File]::WriteAllText((Join-Path $PWD $p),$s,(New-Object Text.UTF8Encoding($false)))
          $p='webview2_host.go';$s=Get-Content -Raw $p;$s=[regex]::Replace($s,'Version: V\.[0-9.]+','Version: V.56.20');[IO.File]::WriteAllText((Join-Path $PWD $p),$s,(New-Object Text.UTF8Encoding($false)))
          $p='web/index.html';$s=Get-Content -Raw $p;$s=[regex]::Replace($s,'id="mhUpdateVersionV001">V\.[0-9.]+<','id="mhUpdateVersionV001">V.56.20<',1);[IO.File]::WriteAllText((Join-Path $PWD $p),$s,(New-Object Text.UTF8Encoding($false)))
      - name: Validate V.56.20 wording-only fix
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check web/v562-text-fix.js
          if($LASTEXITCODE -ne 0){throw 'wording JS validation failed'}
          $display=Get-Content -Raw web\v562-text-fix.js
          foreach($forbidden in @('MutationObserver','tickerCell','assetIcon','fixTickerIcons','createTreeWalker','TextDecoder','mapRegime','btcMarketCap')){if($display.Contains($forbidden)){throw "dynamic UI mutation found: $forbidden"}}
          if((Get-Content VERSION -Raw).Trim() -ne 'V.56.20'){throw 'VERSION mismatch'}
          if(-not (Get-Content -Raw license_auth.go).Contains('const licAppVersion = "V.56.20"')){throw 'license mismatch'}
          if(-not (Get-Content -Raw updater.go).Contains('const mhPublicVersionV001 = "V.56.20"')){throw 'updater mismatch'}
          $app=Get-Content -Raw web\app.js
          foreach($m in @('STRICT VALIDATION PASSED','ACTIVE TRADE PRESERVED','independentMarketConsensus','feedUnavailable','referencePass>=5')){if(-not $app.Contains($m)){throw "signal safety marker missing: $m"}}
          if(-not (Get-Content -Raw ea_signal_bridge.go).Contains('ACTIVE_TRADE_REVERSAL_LOCK')){throw 'EA reversal lock missing'}
          if(-not (Get-Content -Raw ea_modes_v558.go).Contains('FAST_ACTIVE_EXPOSURE_LOCK')){throw 'Fast exposure lock missing'}
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'Go tests failed'}
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o "$env:RUNNER_TEMP\MH Analysis V.56.20.exe" .
          if($LASTEXITCODE -ne 0){throw 'Windows build failed'}
      - name: Commit V.56.20 application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION license_auth.go updater.go webview2_host.go web/index.html
          git commit -m 'Bump MH Analysis application to V.56.20'
          git push origin HEAD:v56.3-release
