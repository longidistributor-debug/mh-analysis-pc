name: Publish MH Analysis V54.12 Mandatory Updater

on:
  push:
    branches:
      - v54-12-whatsapp-calendar-ticker-mh-mt5
    paths:
      - '.github/workflows/publish-v54-12-updater.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-updater:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Build verified V54.12 runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python .github/scripts/v5412_patch.py
          if($LASTEXITCODE -ne 0){throw 'V54.12 patch failed'}
          gofmt -w webview2_host.go mt5_embed_v36.go calendar3d.go main.go ui_cache_v5411.go updater.go license_auth.go records_mt5_local.go
          node --check web/app.js
          if($LASTEXITCODE -ne 0){throw 'V54.12 JS validation failed'}
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'V54.12 Go tests failed'}
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          if($LASTEXITCODE -ne 0 -or -not(Test-Path 'dist/MH Analysis.exe')){throw 'V54.12 Windows build failed'}

      - name: Publish mandatory V54.12 updater manifest and EXE
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $sha=(Get-FileHash 'dist\MH Analysis.exe' -Algorithm SHA256).Hash.ToLower()
          $tmp=Join-Path $env:RUNNER_TEMP 'v5412-update'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Copy-Item 'dist\MH Analysis.exe' (Join-Path $tmp 'MH Analysis.exe')
          $manifest=[ordered]@{
            version='V.54.12'
            mandatory=$true
            download_url='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%20Analysis.exe'
            sha256=$sha
            notes='V54.12 fixes background WhatsApp updates for NEW ANALYZE and RE-EVALUATE, instant cached ticker/calendar values, and the embedded MH MT5 view without exposing WhatsApp or a standalone MT5 window.'
          } | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $tmp 'update.json'),$manifest,(New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Join-Path $tmp 'VERSION'),'V.54.12'+[Environment]::NewLine,(New-Object Text.UTF8Encoding($false)))

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan __v5412_update
          git rm -rf . 2>$null
          Get-ChildItem -Force | Where-Object {$_.Name -ne '.git'} | Remove-Item -Recurse -Force
          Copy-Item (Join-Path $tmp 'MH Analysis.exe') '.\MH Analysis.exe'
          Copy-Item (Join-Path $tmp 'update.json') '.\update.json'
          Copy-Item (Join-Path $tmp 'VERSION') '.\VERSION'
          git add .
          git commit -m 'Publish MH Analysis V.54.12 mandatory updater'
          git push --force origin HEAD:mh-analysis-update-channel
          if($LASTEXITCODE -ne 0){throw 'V54.12 updater publish failed'}
