name: Diagnose Exness Login Fix

on:
  workflow_dispatch:
  push:
    branches: [exness-login-fix-work]

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Run patch sequence and capture diagnostics
        continue-on-error: true
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force diag | Out-Null
          $ErrorActionPreference='Continue'
          & python desktop/manual_timeframe_no_api_patch.py *>&1 | Tee-Object -FilePath diag/01-manual.txt
          "exit=$LASTEXITCODE" | Add-Content diag/01-manual.txt
          & python desktop/branding_text_patch.py *>&1 | Tee-Object -FilePath diag/02-branding.txt
          "exit=$LASTEXITCODE" | Add-Content diag/02-branding.txt
          & python desktop/header_center_layout_patch.py *>&1 | Tee-Object -FilePath diag/03-header.txt
          "exit=$LASTEXITCODE" | Add-Content diag/03-header.txt
          & python desktop/records_feature_patch.py *>&1 | Tee-Object -FilePath diag/04-records.txt
          "exit=$LASTEXITCODE" | Add-Content diag/04-records.txt
          & python desktop/exness_feature_patch.py *>&1 | Tee-Object -FilePath diag/05-exness.txt
          "exit=$LASTEXITCODE" | Add-Content diag/05-exness.txt
          & python desktop/exness_login_focus_patch.py *>&1 | Tee-Object -FilePath diag/08-login-fix.txt
          "exit=$LASTEXITCODE" | Add-Content diag/08-login-fix.txt
          $appSrc=Get-Content -Raw web/app.js
          $hostSrc=Get-Content -Raw chrome_host.go
          $mainSrc=Get-Content -Raw main.go
          $bridgeSrc=Get-Content -Raw exness_bridge.go
          @(
            "profile=" + ($hostSrc -match 'ExnessProfile'),
            "url=" + ($hostSrc -match 'https://my\.exness\.global/webtrading/'),
            "routes=" + ($mainSrc -match 'registerExnessRoutes\(mux\)'),
            "hook=" + ($appSrc -match 'prepareExnessSignalV796'),
            "hide_window=" + ($hostSrc -match 'HideWindow:\s*true'),
            "focus=" + ($hostSrc -match 'chFocusExnessBrowser'),
            "ui_fix=" + ($hostSrc -match 'exnessInstallLoginUIFixes'),
            "google_hide=" + ($bridgeSrc -match 'sign in with google'),
            "forgot_hide=" + ($bridgeSrc -match 'forgot password'),
            "submitted_false=" + ($bridgeSrc -match 'submitted:false')
          ) | Set-Content diag/09-guards.txt
          node --check web/app.js *> diag/07-node.txt
          "node_exit=$LASTEXITCODE" | Add-Content diag/07-node.txt
          gofmt -w main.go chrome_host.go records.go exness_bridge.go dpi_windows.go *> diag/10-gofmt.txt
          "gofmt_exit=$LASTEXITCODE" | Add-Content diag/10-gofmt.txt
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          cmd /c "go build -trimpath -ldflags=\"-H=windowsgui -s -w\" -o diag\test.exe . > diag\11-build.txt 2>&1"
          "build_exit=$LASTEXITCODE" | Add-Content diag/11-build.txt
          Remove-Item Env:GOOS,Env:GOARCH,Env:CGO_ENABLED -ErrorAction SilentlyContinue
          Copy-Item chrome_host.go diag/chrome_host.after.go
          Copy-Item exness_bridge.go diag/exness_bridge.after.go
          Copy-Item web/app.js diag/app.after.js
          Get-Content diag/0*.txt,diag/10-gofmt.txt,diag/11-build.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exness-login-fix-diagnostics
          path: diag
          if-no-files-found: error
