name: Diagnose Exness Login Fix
on:
  push:
    branches: [exness-login-fix]
permissions:
  contents: write
jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[diagnostic]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Capture patch diagnostics
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $out=@()
          function Run-Step($name,$cmd){
            $out += "=== $name ==="
            try {
              $txt = & cmd /c "$cmd 2>&1" | Out-String
              $code=$LASTEXITCODE
              $out += $txt
              $out += "EXIT=$code"
            } catch { $out += $_.Exception.ToString(); $out += 'EXIT=EXCEPTION' }
          }
          Run-Step 'manual' 'python desktop/manual_timeframe_no_api_patch.py'
          Run-Step 'branding' 'python desktop/branding_text_patch.py'
          Run-Step 'header' 'python desktop/header_center_layout_patch.py'
          Run-Step 'records' 'python desktop/records_feature_patch.py'
          Run-Step 'exness' 'python desktop/exness_feature_patch.py'
          Run-Step 'loginfix' 'python desktop/exness_login_focus_flicker_patch.py'
          Run-Step 'gofmt' 'gofmt -w main.go chrome_host.go records.go exness_bridge.go dpi_windows.go'
          Run-Step 'build' 'set GOOS=windows&& set GOARCH=amd64&& set CGO_ENABLED=0&& go build -o diagnostic.exe .'
          $out | Set-Content -Encoding UTF8 diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostic.txt
          git commit -m '[diagnostic] Exness login fix report' || echo nochange
          git push origin HEAD:exness-login-fix
