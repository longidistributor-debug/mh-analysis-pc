name: Build MH Analysis V.11 Auth Corrected
on:
  workflow_dispatch:
  push:
    branches: [v02-restored-working-base]
    paths: ['.github/workflows/build-v11-auth-diagnostics.yml']
permissions:
  contents: write
concurrency:
  group: mh-analysis-v11-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.2', cache: false}
      - name: Promote V.11 and correct auth response handling
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          (Get-Content -Raw updater.go) -replace 'mhPublicVersionV001 = "V\.\d+"','mhPublicVersionV001 = "V.11"' | Set-Content -Encoding UTF8 updater.go
          Set-Content -Encoding UTF8 VERSION 'V.11'
          (Get-Content -Raw web/index.html) -replace 'id="mhUpdateVersionV001">V\.\d+<','id="mhUpdateVersionV001">V.11<' | Set-Content -Encoding UTF8 web/index.html
          $p='license_auth.go'; $s=Get-Content -Raw $p
          $s=$s.Replace('const licAppVersion = "80.2"','const licAppVersion = "V.11"')
          $old='if env.Code == "" {`n`t`tenv.Code = env.Error`n`t}`n`treturn resp.StatusCode, env, nil'
          $new='if env.Code == "" {`n`t`tenv.Code = env.Error`n`t}`n`tif strings.TrimSpace(env.Message) == "" && resp.StatusCode >= 400 {`n`t`tenv.Message = strings.TrimSpace(string(b))`n`t}`n`treturn resp.StatusCode, env, nil'
          $s=$s.Replace($old,$new)
          $s=$s.Replace('map[string]any{"username": q.Username, "device_id": d.ID}', 'map[string]any{"username": q.Username, "device_id": d.ID, "device_info": licMachineInfo()}')
          Set-Content -Encoding UTF8 $p $s
          gofmt -w license_auth.go updater.go main.go webview2_host.go
      - name: Compile and auth contract checks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $a=Get-Content -Raw license_auth.go; $h=Get-Content -Raw webview2_host.go; $m=Get-Content -Raw main.go
          if($a -notmatch 'const licAppVersion = "V.11"'){throw 'V.11 auth client version missing'}
          if($a -notmatch 'auth/challenge'){throw 'challenge endpoint missing'}
          if($a -notmatch 'auth/login'){throw 'login endpoint missing'}
          if($h -notmatch 'b.Show\(\)'){throw 'working WebView2 visibility fix missing'}
          if($m -notmatch 'runWebView2Host\(\)'){throw 'working one-window host missing'}
          New-Item -ItemType Directory -Force dist|Out-Null
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
      - name: Runtime smoke test
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'; $p=Start-Process -FilePath (Resolve-Path 'dist/MH Analysis.exe') -PassThru; Start-Sleep 12; if($p.HasExited){throw "V.11 exited: $($p.ExitCode)"}; Stop-Process -Id $p.Id -Force
      - name: Build installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'; $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'; if(-not(Test-Path $iscc)){choco install innosetup --no-progress -y}
          $iss=Get-Content -Raw 'installer/MHAnalysis-V04.iss'; $iss=$iss.Replace('V.04','V.11').Replace('MH Analysis V.04.exe','MH Analysis V.11.exe'); Set-Content -Encoding UTF8 'installer/MHAnalysis-V11.iss' $iss; & $iscc 'installer/MHAnalysis-V11.iss'; if($LASTEXITCODE -ne 0){throw 'installer failed'}
          $x=Get-ChildItem -Recurse -Filter 'MH Analysis V.11.exe'|Select-Object -First 1; if(-not$x){throw 'installer missing'}; Copy-Item $x.FullName 'dist/MH-Analysis-V11-Installer.exe'
      - name: Commit corrected V.11 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add license_auth.go updater.go VERSION web/index.html
          if((git status --porcelain).Length -gt 0){git commit -m 'Promote V.11 auth correction [skip ci]'; git fetch origin v02-restored-working-base; git rebase origin/v02-restored-working-base; git push origin HEAD:v02-restored-working-base}
      - name: Publish V.11 update channel
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'; $sha=(Get-FileHash 'dist/MH Analysis.exe' -Algorithm SHA256).Hash.ToLower(); git fetch origin mh-analysis-update-channel; git worktree add update-channel origin/mh-analysis-update-channel; Copy-Item 'dist/MH Analysis.exe' 'update-channel/MH-Analysis-V11.exe' -Force
          $manifest=[ordered]@{version='V.11';mandatory=$true;download_url='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH-Analysis-V11.exe';sha256=$sha;notes='V.11 corrects login authorization client/server compatibility while preserving the working V.10 UI, WebView2 host, updater and layout.'}; [IO.File]::WriteAllText((Join-Path (Get-Location) 'update-channel/update.json'),($manifest|ConvertTo-Json),(New-Object Text.UTF8Encoding($false)))
          Push-Location update-channel; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add MH-Analysis-V11.exe update.json; if((git status --porcelain).Length -gt 0){git commit -m 'Publish mandatory MH Analysis V.11'; git pull --rebase origin mh-analysis-update-channel; git push origin HEAD:mh-analysis-update-channel}; Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V11-Final
          path: |
            dist/MH-Analysis-V11-Installer.exe
            dist/MH Analysis.exe
          retention-days: 90
