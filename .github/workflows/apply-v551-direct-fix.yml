name: Apply V55.1 Direct Source Fixes

on:
  push:
    branches:
      - v55-clean-runtime
    paths:
      - '.github/workflows/apply-v551-direct-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  direct-fix:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Apply V55.1 fixes directly to committed source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python .github/scripts/v551_direct_fix_once.py
          if($LASTEXITCODE -ne 0){throw 'V55.1 direct source conversion failed'}
          Remove-Item '.github/scripts/v551_direct_fix_once.py' -Force
          Remove-Item '.github/workflows/apply-v551-direct-fix.yml' -Force
          gofmt -w *.go
          node --check web/app.js
          if($LASTEXITCODE -ne 0){throw 'V55.1 JavaScript validation failed'}

      - name: Regression guards
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if((Get-Content VERSION -Raw).Trim() -ne 'V.55.1'){throw 'VERSION is not V.55.1'}
          $legacy=Get-ChildItem '.github\scripts' -Filter 'v54*_patch.py' -ErrorAction SilentlyContinue
          if($legacy){throw 'Legacy V54 patch scripts returned'}
          if(Select-String -Path web\index.html,web\app.js -Pattern 'myfxbook|mfbcdn' -Quiet){throw 'Myfxbook calendar dependency still exists'}
          if(Select-String -Path webview2_host.go -Pattern 'x:=w\+32' -Quiet){throw 'WhatsApp still uses off-screen parking'}
          if(Select-String -Path webview2_host.go -Pattern 'wv2Whatsapp\.Navigate\("https://web\.whatsapp\.com/"\)' -Quiet){throw 'WhatsApp manual view still reloads'}
          if(-not (Select-String -Path webview2_host.go -Pattern 'send-clicked' -Quiet)){throw 'WhatsApp DOM send path missing'}
          if(-not (Select-String -Path webview2_host.go -Pattern 'native-enter' -Quiet)){throw 'WhatsApp native fallback missing'}
          if(-not (Select-String -Path web\app.js -Pattern '/api/records-v2\?fast=1' -Quiet)){throw 'Recent Signals fast path missing'}
          if(-not (Select-String -Path calendar3d.go -Pattern 'cdn-nfs\.faireconomy\.media' -Quiet)){throw 'Calendar CDN source missing'}

      - name: Test direct source and build Windows EXE
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'V55.1 Go tests failed'}
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o "$env:RUNNER_TEMP\MH Analysis V55.1 prepublish.exe" .
          if($LASTEXITCODE -ne 0){throw 'V55.1 Windows build failed'}

      - name: Commit clean V55.1 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if(-not (git status --porcelain)){throw 'V55.1 produced no changes'}
          git commit -m 'V55.1 direct runtime: WhatsApp send MT5 startup widgets'
          git push origin HEAD:v55-clean-runtime
          if($LASTEXITCODE -ne 0){throw 'Could not push V55.1 direct source'}
