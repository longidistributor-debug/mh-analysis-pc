name: Build MH Analysis V.55.5 UI Placement
on:
  push:
    branches: [v55.5-ui-placement]
    paths: ['vercel-auth/trigger-v555-ui-placement']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: v55.5-ui-placement}
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.2', cache: false}
      - name: Set V.55.5 identity only
        shell: python
        run: |
          from pathlib import Path
          def rd(p):
            b=Path(p).read_bytes()
            for e in ('utf-8-sig','cp1252','latin-1'):
              try:return b.decode(e)
              except UnicodeDecodeError:pass
            raise RuntimeError(p)
          def wr(p,s):Path(p).write_text(s,encoding='utf-8')
          p=rd('web/v553-placement.js')
          for x in ['mhSlAdjustment','mhProgressiveV1','mhFastScalping']: assert x in p
          assert 'mhFastStatus' not in p
          assert 'const mhPublicVersionV001 = "V.55.5"' in rd('updater.go')
          wr('VERSION','V.55.5\n')
          for f,a,b in [
            ('license_auth.go','const licAppVersion = "V.55.3"','const licAppVersion = "V.55.5"'),
            ('web/index.html','id="mhUpdateVersionV001">V.55.3</div>','id="mhUpdateVersionV001">V.55.5</div>')
          ]:
            s=rd(f); assert a in s,(f,a); wr(f,s.replace(a,b,1))
      - name: Test and build package
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check web/v553-placement.js
          node --check web/v31.js
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'tests failed'}
          New-Item -ItemType Directory -Force dist,dist-installer|Out-Null
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          if($LASTEXITCODE -ne 0){throw 'build failed'}
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not(Test-Path $iscc)){choco install innosetup -y --no-progress}
          $src=(Resolve-Path 'dist\MH Analysis.exe').Path
          $out=(Resolve-Path dist-installer).Path
          & $iscc '/Qp' "/DMySourceExe=$src" "/DMyOutputDir=$out" '/DMyAppVersion=V.55.5' '/DMyOutputBaseFilename=MH-Analysis-Setup-V.55.5' 'installer\MHAnalysis-V01.iss'
          if($LASTEXITCODE -ne 0){throw 'installer failed'}
          $sha=(Get-FileHash 'dist\MH Analysis.exe' -Algorithm SHA256).Hash.ToLower()
          "$sha  MH Analysis.exe"|Set-Content -Encoding ascii dist\SHA256SUMS.txt
          'V.55.5'|Set-Content -Encoding ascii dist\VERSION
          $m=[ordered]@{version='V.55.5';mandatory=$true;download_url='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%20Analysis.exe';sha256=$sha;notes='V.55.5 fixes only the top MH MT5 UI placement while preserving existing functionality.'}|ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD 'dist\update.json'),$m,(New-Object Text.UTF8Encoding($false)))
          Compress-Archive -Path 'dist\MH Analysis.exe','dist\SHA256SUMS.txt','dist\update.json','dist\VERSION','dist-installer\MH-Analysis-Setup-V.55.5.exe' -DestinationPath 'dist\MH-Analysis-V.55.5.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V.55.5
          path: |
            dist/MH Analysis.exe
            dist/MH-Analysis-V.55.5.zip
            dist/SHA256SUMS.txt
            dist/update.json
            dist/VERSION
            dist-installer/MH-Analysis-Setup-V.55.5.exe
          if-no-files-found: error
