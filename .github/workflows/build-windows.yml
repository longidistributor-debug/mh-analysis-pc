name: Build MH Analysis Exact UI Edge

on:
  workflow_dispatch:
  push:
    branches: [exact-ui-edge-build]
    paths:
      - 'main.go'
      - 'go.mod'
      - 'web/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Verify original project source unchanged
        shell: bash
        run: |
          set -euo pipefail
          test -f main.go
          test -f go.mod
          test -f web/app.js
          test -f web/index.html
          test -f web/styles.css
          test -f web/mh-logo.png
          node --check web/app.js
          grep -q 'Native Windows host with REAL WebView2 controls' main.go
          grep -q 'MH Analysis' web/index.html

      - name: Generate Windows icon resources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from PIL import Image
          img = Image.open('web/mh-logo.png').convert('RGBA')
          sizes = [(256,256),(128,128),(64,64),(48,48),(32,32),(24,24),(16,16)]
          img.save('web/mh-analysis.ico', format='ICO', sizes=sizes)
          PY
          go install github.com/akavel/rsrc@latest
          "$(go env GOPATH)/bin/rsrc" -ico web/mh-analysis.ico -o rsrc_windows_amd64.syso

      - name: Build Windows x64 Edge WebView2 EXE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis Exact UI Edge.exe' .
          file 'dist/MH Analysis Exact UI Edge.exe'
          sha256sum 'dist/MH Analysis Exact UI Edge.exe' | tee dist/SHA256SUMS.txt
          (cd dist && zip -9 'MH-Analysis-Exact-UI-Edge.zip' 'MH Analysis Exact UI Edge.exe' SHA256SUMS.txt >/dev/null)

      - name: Upload exact UI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-Exact-UI-Edge
          path: |
            dist/MH Analysis Exact UI Edge.exe
            dist/MH-Analysis-Exact-UI-Edge.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
