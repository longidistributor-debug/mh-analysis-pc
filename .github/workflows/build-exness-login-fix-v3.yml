name: Build FINAL V79.6 Exness Login Fix V3
on:
  workflow_dispatch:
  push:
    branches: [exness-login-fix-v2]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Verify existing manual no-API + branding baseline
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $app=Get-Content -Raw web/app.js
          $index=Get-Content -Raw web/index.html
          if($app -notmatch 'manual context selection must be API-silent'){throw 'manual timeframe baseline missing'}
          if($index -notmatch 'v79\.6 AUTO CYCLE \(HAMMAD & SOMI\)'){throw 'branding baseline missing'}
          Write-Host 'PASS baseline source'
      - name: Apply centered header
        shell: powershell
        run: python desktop/header_center_layout_patch.py
      - name: Apply Records
        shell: powershell
        run: python desktop/records_feature_patch.py
      - name: Apply Exness fourth tab
        shell: powershell
        run: python desktop/exness_feature_patch.py
      - name: Apply Exness login focus/flicker fix
        shell: powershell
        run: python desktop/exness_login_focus_flicker_patch.py
      - name: Source guards
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check web/app.js
          $host=Get-Content -Raw chrome_host.go
          $bridge=Get-Content -Raw exness_bridge.go
          $styles=Get-Content -Raw web/styles.css
          if($styles -notmatch 'MH_HEADER_CENTER_V796_START'){throw 'centered header patch missing'}
          if($host -notmatch 'idRecords\s+=\s+1003'){throw 'Records tab missing'}
          if($host -notmatch 'idExness\s+=\s+1004'){throw 'Exness tab missing'}
          if($host -notmatch 'chLaunchBrowserQuiet'){throw 'quiet launch missing'}
          if($host -notmatch 'HideWindow:true'){throw 'hidden launch missing'}
          if($host -notmatch 'chSetFocus.Call\(exness\)'){throw 'keyboard focus fix missing'}
          if($host -notmatch 'go func\(\)\{ time.Sleep\(500\*time.Millisecond\); exnessApplyLoginCleanup\(\) \}\(\)'){throw 'immediate login cleanup missing'}
          if($bridge -notmatch 'sign in with google'){throw 'Google login hide rule missing'}
          if($bridge -notmatch 'forgot password'){throw 'forgot password hide rule missing'}
          if($bridge -match "clickText\(\[[^\]]*Place order"){throw 'unsafe Place order automation'}
          if($bridge -match "clickText\(\[[^\]]*Confirm"){throw 'unsafe Confirm automation'}
          Write-Host 'PASS source guards'
      - name: Build Windows x64 EXE
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w main.go chrome_host.go records.go exness_bridge.go dpi_windows.go
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          sha256sum 'dist/MH Analysis.exe' | tee dist/SHA256SUMS.txt
          powershell -NoProfile -Command "Compress-Archive -Path 'dist/MH Analysis.exe','dist/SHA256SUMS.txt' -DestinationPath 'dist/MH-Analysis-V79.6-Exness-Login-Fix.zip' -Force"
      - name: Existing startup/restart regression
        shell: powershell
        run: desktop/runtime_seamless_test.ps1
      - name: Exness lazy launch / fourth tab test
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:MH_SMOKE_TEST='1'
          Add-Type @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class ExFixWin {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumChildWindows(IntPtr parent, EnumProc cb, IntPtr lp);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h,uint m,IntPtr w,IntPtr l);
          }
          '@
          $p=Start-Process -FilePath (Resolve-Path 'dist/MH Analysis.exe') -PassThru
          try {
            for($i=0;$i -lt 60;$i++){$p.Refresh();if($p.MainWindowHandle -ne 0){break};Start-Sleep -Milliseconds 250}
            [IntPtr]$h=$p.MainWindowHandle;if($h -eq [IntPtr]::Zero){throw 'host missing'}
            Start-Sleep -Seconds 3
            $pre=Get-CimInstance Win32_Process -ErrorAction SilentlyContinue|Where-Object{($_.Name -eq 'chrome.exe' -or $_.Name -eq 'msedge.exe') -and $_.CommandLine -match 'ExnessProfile'}|Select-Object -First 1
            if($pre){throw 'Exness browser launched before tab click'}
            $script:buttons=@()
            [ExFixWin]::EnumChildWindows($h,{param($w,$l)$cls=New-Object Text.StringBuilder 80;[void][ExFixWin]::GetClassName($w,$cls,80);if($cls.ToString() -eq 'Button'){$txt=New-Object Text.StringBuilder 120;[void][ExFixWin]::GetWindowText($w,$txt,120);$script:buttons += $txt.ToString()};return $true},[IntPtr]::Zero)|Out-Null
            foreach($need in @('MH Analysis','WhatsApp','Records','Exness')){if($script:buttons -notcontains $need){throw "native $need button missing"}}
            [ExFixWin]::PostMessage($h,0x0111,[IntPtr]1004,[IntPtr]::Zero)|Out-Null
            $bp=$null
            for($i=0;$i -lt 80;$i++){$bp=Get-CimInstance Win32_Process -ErrorAction SilentlyContinue|Where-Object{($_.Name -eq 'chrome.exe' -or $_.Name -eq 'msedge.exe') -and $_.CommandLine -match '--app=https://my\.exness\.global/webtrading/' -and $_.CommandLine -match 'ExnessProfile'}|Select-Object -First 1;if($bp){break};Start-Sleep -Milliseconds 250}
            if(-not $bp){throw 'Exness did not launch after tab click'}
            Write-Host 'PASS Exness launches only after click using persistent profile'
          } finally {
            try{$ls=Get-NetTCPConnection -State Listen -OwningProcess $p.Id -ErrorAction SilentlyContinue|Where-Object{$_.LocalAddress -eq '127.0.0.1'}|Select-Object -First 1;if($ls){Invoke-WebRequest "http://127.0.0.1:$($ls.LocalPort)/api/shutdown" -UseBasicParsing -TimeoutSec 2|Out-Null}}catch{}
            Start-Sleep -Seconds 2
            if(!$p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
            Remove-Item Env:MH_SMOKE_TEST -ErrorAction SilentlyContinue
          }
      - name: Records + DPI retained
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $rec=Get-Content -Raw web/records.html
          if($rec -notmatch 'ACCURACY CHECK'){throw 'Records regression'}
          $dpi=Get-Content -Raw dpi_windows.go
          if($dpi -notmatch 'SetProcessDpiAwarenessContext'){throw 'DPI regression'}
          Write-Host 'PASS Records + DPI retained'
      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V79.6-Exness-Login-Fix-FINAL-V3
          path: |
            dist/MH Analysis.exe
            dist/MH-Analysis-V79.6-Exness-Login-Fix.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
      - name: Publish EXE-only final branch
        shell: bash
        run: |
          set -euo pipefail
          cp 'dist/MH Analysis.exe' "$RUNNER_TEMP/MH Analysis.exe"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan __exness_login_fix_v3
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP/MH Analysis.exe" './MH Analysis.exe'
          git add 'MH Analysis.exe'
          git commit -m 'MH Analysis V79.6 Exness login typing and flicker fix final EXE only'
          git push --force origin HEAD:final-current-v796
          git push origin --delete exness-login-fix-v2
          echo 'PASS final-current-v796 updated with verified fixed EXE only'
