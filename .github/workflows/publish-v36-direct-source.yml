name: Publish MH Analysis V36 Direct Source
on:
  push:
    branches: [v36-direct-source-runtime-fix]
    paths: ['.github/workflows/publish-v36-direct-source.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mh-analysis-v36-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.2', cache: false}
      - name: Canonicalize V36 signal fanout in source
        shell: python
        run: |
          from pathlib import Path
          p=Path('web/app.js'); s=p.read_text(encoding='utf-8')
          # The legacy records writer shares the same JSON path with Records V2 but a different schema.
          # Never let addRecent write through that old route in V36.
          s=s.replace("  if(sig&&String(state).toUpperCase()==='NEW')void captureSignalRecordV796(d,state);\n", "  // V36: Records are written only by the canonical V2 fanout.\n")
          old="""    if(d.signal&&!d._sameActiveSignal){Promise.allSettled([captureSignalRecordV30(d),sendUniqueSignalToEAV30(d),prepareMT5SignalV796(d,'NEW')]).then(()=>{});} // V34_CANONICAL_SIGNAL_FANOUT"""
          new="""    if(d.signal&&!d._sameActiveSignal){await dispatchUniqueSignalV36(d);} // V36_CANONICAL_SIGNAL_FANOUT"""
          if old not in s: raise SystemExit('old V34 fanout not found')
          s=s.replace(old,new)
          anchor="async function executeNewAnalysis(fromAuto=false){"
          helper=r'''// V36_CANONICAL_SIGNAL_FANOUT: one signal id, one record, one EA pending handoff.
          async function dispatchUniqueSignalV36(d){
            const sig=d?.signal;if(!sig||d?._sameActiveSignal)return null;
            const signalId=`MH${Date.now()}_${symbol}_${timeframe}`;
            const market=Number((candleCache.get(keyFor())||[]).at(-1)?.c)||Number(sig.entry);
            const pending=derivePendingTypeV30(sig.direction,Number(sig.entry),market);
            const recordPayload={signal_id:signalId,symbol,timeframe,direction:sig.direction,entry:Number(sig.entry),sl:Number(sig.sl),tp1:Number(sig.tp1),tp2:Number(sig.tp2),score:Number(sig.score)||0,setup:d.bestFamily||sig.setupReason||'',action:'NEW'};
            const rr=await fetch('/api/records-v2/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(recordPayload)});
            let rj={};try{rj=await rr.json()}catch(_){}
            if(!rr.ok)throw new Error(rj.error||`Records HTTP ${rr.status}`);
            if(rj.duplicate||rj.same_signal){d._sameActiveSignal=true;d._sameSignalStatus=rj.existing_status||'';setAutoStatus('Same signal still active • no duplicate Record / MT5 pending','warn');return rj;}
            const er=await fetch('/api/mt5/ea/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({signal_id:signalId,symbol,type:pending,entry:Number(sig.entry),sl:Number(sig.sl),tp:Number(sig.tp1),lot:0.02,expiry:0})});
            let ej={};try{ej=await er.json()}catch(_){}
            if(!er.ok)throw new Error(ej.error||`EA bridge HTTP ${er.status}`);
            try{await prepareMT5SignalV796(d,'NEW')}catch(_){}
            setAutoStatus(`Signal recorded • MT5 pending sent • ${pending}`,'good');
            return {record:rj,ea:ej,signal_id:signalId};
          }
          '''
          if anchor not in s: raise SystemExit('executeNewAnalysis anchor missing')
          s=s.replace(anchor,helper+anchor,1)
          p.write_text(s,encoding='utf-8')
          for fn in ['updater.go','license_auth.go']:
            q=Path(fn); t=q.read_text(encoding='utf-8'); t=t.replace('V.35','V.36'); q.write_text(t,encoding='utf-8')
          Path('VERSION').write_text('V.36\n',encoding='utf-8')
      - name: Persist canonical V36 source before build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app.js updater.go license_auth.go VERSION
          if(-not (git diff --cached --quiet)){ git commit -m 'V36 canonical source: deterministic records MT5 signal fanout'; git push origin HEAD:v36-direct-source-runtime-fix }
      - name: Verify V36 source invariants
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $wv=Get-Content -Raw webview2_host.go; $ch=Get-Content -Raw chrome_host.go; $app=Get-Content -Raw web/app.js
          if($wv -notmatch 'V36_EMBEDDED_AUX'){throw 'embedded persistent views missing'}
          if($wv -notmatch 'wmWhatsAppSend'){throw 'WhatsApp queue event missing from active host'}
          if($ch -notmatch 'V36_MT5_PROCESS_IMAGE'){throw 'native MT5 process embedding missing'}
          if($app -notmatch 'V36_CANONICAL_SIGNAL_FANOUT'){throw 'canonical signal fanout missing'}
          if($app -match "Promise\.allSettled\(\[captureSignalRecordV30"){throw 'old racing fanout still active'}
          if($app -match "void captureSignalRecordV796\(d,state\)"){throw 'legacy record writer still active'}
          node --check web/app.js
          gofmt -w webview2_host.go chrome_host.go updater.go license_auth.go
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'V36 tests failed'}
      - name: Build and verify V36 installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'; New-Item -ItemType Directory -Force dist|Out-Null
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          if($LASTEXITCODE -ne 0 -or -not(Test-Path 'dist/MH Analysis.exe')){throw 'EXE build failed'}
          $iss=Get-Content -Raw 'installer\MH-Analysis-V27.iss'
          $iss=$iss -replace 'AppVersion=[^\r\n]+','AppVersion=36.0.0'
          $iss=$iss -replace 'OutputBaseFilename=[^\r\n]+','OutputBaseFilename=MH-Analysis-Setup-V36'
          [IO.File]::WriteAllText((Join-Path $PWD 'installer\MH-Analysis-V36.iss'),$iss,(New-Object Text.UTF8Encoding($false)))
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'; if(-not(Test-Path $iscc)){choco install innosetup --no-progress -y}
          & $iscc 'installer\MH-Analysis-V36.iss'
          if($LASTEXITCODE -ne 0 -or -not(Test-Path 'dist\MH-Analysis-Setup-V36.exe')){throw 'installer failed'}
          $target=Join-Path $env:RUNNER_TEMP 'MHV36Verify'; $p=Start-Process (Join-Path $PWD 'dist\MH-Analysis-Setup-V36.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR='+$target)) -PassThru -Wait
          if($p.ExitCode -ne 0 -or -not(Test-Path (Join-Path $target 'MH Analysis.exe'))){throw 'silent installer verification failed'}
      - name: Publish V36 release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Continue'; gh release delete v36 --yes --cleanup-tag 2>$null; $global:LASTEXITCODE=0; $ErrorActionPreference='Stop'
          gh release create v36 'dist/MH-Analysis-Setup-V36.exe' 'dist/MH Analysis.exe' --target HEAD --title 'MH Analysis V.36' --notes 'Direct-source runtime correction: persistent embedded WhatsApp and Records, verified internal MT5 route, and deterministic single-ID Records/MT5 signal fanout.'
          if($LASTEXITCODE -ne 0){throw 'release publish failed'}
      - name: Publish V36 auto-update channel
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'; $upd=Join-Path $env:RUNNER_TEMP 'v36-update'; New-Item -ItemType Directory -Force $upd|Out-Null
          Copy-Item 'dist\MH Analysis.exe' (Join-Path $upd 'MH Analysis.exe'); $sha=(Get-FileHash 'dist\MH Analysis.exe' -Algorithm SHA256).Hash.ToLower()
          $manifest=[ordered]@{version='V.36';mandatory=$true;download_url='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%20Analysis.exe';sha256=$sha;notes='MANDATORY V.36 - persistent embedded views, internal MT5, deterministic Records/WhatsApp/MT5 signal flow.'}|ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $upd 'update.json'),$manifest,(New-Object Text.UTF8Encoding($false))); [IO.File]::WriteAllText((Join-Path $upd 'VERSION'),'V.36'+[Environment]::NewLine,(New-Object Text.UTF8Encoding($false)))
          git checkout --orphan __v36_update; git rm -rf . 2>$null; Get-ChildItem -Force|?{$_.Name -ne '.git'}|Remove-Item -Recurse -Force; Copy-Item (Join-Path $upd '*') .; git add .; git commit -m 'Publish MH Analysis V.36 update channel'; git push --force origin HEAD:mh-analysis-update-channel
