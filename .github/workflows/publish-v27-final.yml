name: Publish Verified MH Analysis V27

on:
  workflow_dispatch:
  push:
    branches: [v27-analysis-persistence-fix]
    paths: ['.github/workflows/publish-v27-final.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Stamp and build V27
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $u=Get-Content -Raw updater.go
          $u=$u -replace 'const mhPublicVersionV001 = "[^"]+"','const mhPublicVersionV001 = "V.27"'
          [IO.File]::WriteAllText((Join-Path $PWD 'updater.go'),$u,(New-Object Text.UTF8Encoding($false)))
          $i=Get-Content -Raw web/index.html
          $i=$i -replace '<div class="version">[^<]*</div>','<div class="version">V.27 AUTO CYCLE (HAMMAD & SOMI)</div>'
          $i=$i -replace '<div class="mhUpdateVersionV001" id="mhUpdateVersionV001">[^<]*</div>','<div class="mhUpdateVersionV001" id="mhUpdateVersionV001">V.27</div>'
          [IO.File]::WriteAllText((Join-Path $PWD 'web/index.html'),$i,(New-Object Text.UTF8Encoding($false)))
          node --check web/app.js
          node --check web/v03.js
          gofmt -w webview2_host.go mt5_prefill.go updater.go
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'V27 tests failed'}
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          if($LASTEXITCODE -ne 0){throw 'V27 build failed'}

      - name: Build and verify V27 installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not(Test-Path $iscc)){choco install innosetup --no-progress -y}
          & $iscc 'installer\MH-Analysis-V27.iss'
          if($LASTEXITCODE -ne 0 -or -not(Test-Path 'dist\MH-Analysis-Setup-V27.exe')){throw 'V27 installer failed'}
          $target=Join-Path $env:RUNNER_TEMP 'MHV27Verify'
          $p=Start-Process (Join-Path $PWD 'dist\MH-Analysis-Setup-V27.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR='+$target)) -PassThru -Wait
          if($p.ExitCode -ne 0 -or -not(Test-Path (Join-Path $target 'MH Analysis.exe'))){throw 'V27 installer verification failed'}
          $exeSha=(Get-FileHash 'dist\MH Analysis.exe' -Algorithm SHA256).Hash.ToLower()
          $setupSha=(Get-FileHash 'dist\MH-Analysis-Setup-V27.exe' -Algorithm SHA256).Hash.ToLower()
          "${exeSha}  MH Analysis.exe`n${setupSha}  MH-Analysis-Setup-V27.exe" | Set-Content -Encoding ascii 'dist\SHA256SUMS.txt'

      - name: Publish GitHub V27 release
        shell: powershell
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release create v27 'dist/MH-Analysis-Setup-V27.exe' 'dist/MH Analysis.exe' 'dist/SHA256SUMS.txt' --target '${{ github.sha }}' --title 'MH Analysis V.27' --notes 'V.27 fixes persistent analysis state, WhatsApp/Records/MT5 automation handoff, and MT5 PowerShell window flashing.'

      - name: Publish direct V27 installer branch
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tmp=Join-Path $env:RUNNER_TEMP 'v27-release-files'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Copy-Item 'dist\MH Analysis.exe' (Join-Path $tmp 'MH Analysis.exe')
          Copy-Item 'dist\MH-Analysis-Setup-V27.exe' (Join-Path $tmp 'MH-Analysis-Setup-V27.exe')
          Copy-Item 'dist\SHA256SUMS.txt' (Join-Path $tmp 'SHA256SUMS.txt')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan __v27_release
          git rm -rf . 2>$null
          Get-ChildItem -Force | Where-Object {$_.Name -ne '.git'} | Remove-Item -Recurse -Force
          Copy-Item (Join-Path $tmp 'MH Analysis.exe') '.\MH Analysis.exe'
          Copy-Item (Join-Path $tmp 'MH-Analysis-Setup-V27.exe') '.\MH-Analysis-Setup-V27.exe'
          Copy-Item (Join-Path $tmp 'SHA256SUMS.txt') '.\SHA256SUMS.txt'
          Set-Content VERSION 'V.27' -Encoding ascii
          git add .
          git commit -m 'Publish verified MH Analysis V.27 installer'
          git push --force origin HEAD:v27-release
          if($LASTEXITCODE -ne 0){throw 'Direct V27 release publish failed'}

      - name: Publish V27 mandatory updater manifest
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $exeSource=Join-Path $env:RUNNER_TEMP 'v27-release-files\MH Analysis.exe'
          $sha=(Get-FileHash $exeSource -Algorithm SHA256).Hash.ToLower()
          $tmp=Join-Path $env:RUNNER_TEMP 'v27-update-channel'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Copy-Item $exeSource (Join-Path $tmp 'MH Analysis.exe')
          $manifest=[ordered]@{version='V.27';mandatory=$true;download_url='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%20Analysis.exe';sha256=$sha;notes='MH Analysis V.27 - persistent analysis runtime, restored WhatsApp/Records/MT5 automation, hidden MT5 PowerShell windows'} | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $tmp 'update.json'),$manifest,(New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Join-Path $tmp 'VERSION'),'V.27'+[Environment]::NewLine,(New-Object Text.UTF8Encoding($false)))
          git checkout --orphan __v27_update
          git rm -rf . 2>$null
          Get-ChildItem -Force | Where-Object {$_.Name -ne '.git'} | Remove-Item -Recurse -Force
          Copy-Item (Join-Path $tmp 'MH Analysis.exe') '.\MH Analysis.exe'
          Copy-Item (Join-Path $tmp 'update.json') '.\update.json'
          Copy-Item (Join-Path $tmp 'VERSION') '.\VERSION'
          git add .
          git commit -m 'Publish MH Analysis V.27 mandatory update'
          git push --force origin HEAD:mh-analysis-update-channel
          if($LASTEXITCODE -ne 0){throw 'V27 updater channel publish failed'}
