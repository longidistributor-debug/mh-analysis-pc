name: Publish MH Analysis V.55.5 Manual Chart Refresh
on:
  workflow_dispatch:
  push:
    branches: [records-mt5-local-build]
    paths: ['vercel-auth/trigger-v555']
permissions:
  contents: write
jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.2', cache: false}
      - name: Set V.55.5 version
        shell: python
        run: |
          from pathlib import Path
          Path('VERSION').write_text('V.55.5\n',encoding='utf-8')
          replacements=[
            ('updater.go','const mhPublicVersionV001 = "V.55.4"','const mhPublicVersionV001 = "V.55.5"'),
            ('license_auth.go','licAppVersion = "V.55.4"','licAppVersion = "V.55.5"'),
            ('web/index.html','id="mhUpdateVersionV001">V.55.4</div>','id="mhUpdateVersionV001">V.55.5</div>')]
          for fn,a,b in replacements:
            p=Path(fn); s=p.read_text(encoding='utf-8')
            if a not in s: raise SystemExit(f'version anchor missing: {fn}')
            p.write_text(s.replace(a,b,1),encoding='utf-8')
      - name: Verify manual chart refresh behavior
        shell: powershell
        run: |
          $a=Get-Content -Raw web/app.js
          $r=Get-Content -Raw web/runtime-fixes.js
          $h=Get-Content -Raw web/index.html
          if($a.Contains('await loadContextChart();')){throw 'pair/timeframe context still auto-fetches chart'}
          if($r.Contains('analyze.click()')){throw 'runtime still auto-clicks NEW ANALYZE'}
          if($h.Contains('data-chart-tf="20m"')){throw '20m still visible'}
          foreach($m in @('candlesForAnalysis','executeNewAnalysis','executeReevaluate','lotSizeEnabled','partialTpEnabled','fixedPhaseInfo')){if(-not $a.Contains($m)){throw "runtime regression $m"}}
          node --check web/app.js
          node --check web/runtime-fixes.js
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'tests failed'}
      - name: Commit version source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION updater.go license_auth.go web/index.html
          git commit -m 'V.55.5 manual chart refresh release' || true
          git push origin HEAD:records-mt5-local-build
      - name: Build Windows EXE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          sha256sum 'dist/MH Analysis.exe' | tee dist/SHA256SUMS.txt
          HASH=$(awk '{print $1}' dist/SHA256SUMS.txt)
          cat > dist/update.json <<EOF
          {"version":"V.55.5","mandatory":true,"download_url":"https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%20Analysis.exe","sha256":"$HASH","notes":"V.55.5 keeps Gold/BTC and timeframe selection manual: selecting a pair or timeframe does not fetch fresh chart data or run analysis. Fresh candles and analysis run only through NEW ANALYZE or RE-EVALUATE; existing Get Signal cycle behavior is retained."}
          EOF
          printf 'V.55.5\n' > dist/VERSION
      - name: Install Inno Setup
        shell: powershell
        run: |
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'; if(-not(Test-Path $iscc)){choco install innosetup -y --no-progress}; if(-not(Test-Path $iscc)){throw 'ISCC unavailable'}
      - name: Build installer
        shell: powershell
        run: |
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'; New-Item -ItemType Directory -Force dist-installer|Out-Null; $src=(Resolve-Path 'dist\MH Analysis.exe').Path; $out=(Resolve-Path dist-installer).Path; & $iscc '/Qp' "/DMySourceExe=$src" "/DMyOutputDir=$out" '/DMyAppVersion=V.55.5' '/DMyOutputBaseFilename=MH-Analysis-Setup-V.55.5' 'installer\MHAnalysis-V01.iss'; if($LASTEXITCODE -ne 0){throw 'ISCC failed'}
      - name: Package
        shell: powershell
        run: Compress-Archive -Path 'dist\MH Analysis.exe','dist\SHA256SUMS.txt','dist\update.json','dist\VERSION','dist-installer\MH-Analysis-Setup-V.55.5.exe' -DestinationPath 'dist\MH-Analysis-V.55.5.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V.55.5
          path: |
            dist/MH Analysis.exe
            dist/MH-Analysis-V.55.5.zip
            dist/SHA256SUMS.txt
            dist/update.json
            dist/VERSION
            dist-installer/MH-Analysis-Setup-V.55.5.exe
      - name: Publish updater manifest and installer
        shell: bash
        run: |
          set -euo pipefail
          cp 'dist/MH Analysis.exe' "$RUNNER_TEMP/MH Analysis.exe"; cp dist/update.json "$RUNNER_TEMP/update.json"; cp dist/VERSION "$RUNNER_TEMP/VERSION"; cp dist/SHA256SUMS.txt "$RUNNER_TEMP/SHA256SUMS.txt"; cp 'dist-installer/MH-Analysis-Setup-V.55.5.exe' "$RUNNER_TEMP/MH-Analysis-Setup-V.55.5.exe"
          git checkout --orphan __v555; git rm -rf . || true; find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP/MH Analysis.exe" './MH Analysis.exe'; cp "$RUNNER_TEMP/update.json" update.json; cp "$RUNNER_TEMP/VERSION" VERSION; cp "$RUNNER_TEMP/SHA256SUMS.txt" SHA256SUMS.txt; cp "$RUNNER_TEMP/MH-Analysis-Setup-V.55.5.exe" './MH-Analysis-Setup-V.55.5.exe'
          git add .; git commit -m 'MH Analysis V.55.5 updater release'; git push --force origin HEAD:mh-analysis-update-channel
