name: Build V79.6 MH-S

on:
  workflow_dispatch:
  push:
    branches: [v796-mh-s]
    paths:
      - 'tools/v796_mhs_patch.py'
      - '.github/workflows/build-v796-mh-s.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated V79.6 baseline branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify historical baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f main.go
          test -f web/app.js
          test -f web/index.html
          test -f web/styles.css
          grep -Fq "const STORAGE_AUTO='mhAutoSignalEnabledV796'" web/app.js
          grep -Fq 'func processWhatsAppQueue()' main.go
          grep -Fq 'time.AfterFunc(4*time.Second, func() { postMessage(hostHWND, wmWhatsAppClick, 0, 0) })' main.go
          grep -Fq "document.querySelector('[data-icon=\"send\"]')" main.go
          grep -Fq "b.click();return true;" main.go

      - name: Vendor chart library locally
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js' \
            --output web/lightweight-charts.standalone.production.js
          test -s web/lightweight-charts.standalone.production.js

      - name: Apply requested V79.6 MH-S changes only
        shell: bash
        run: |
          set -euo pipefail
          cp main.go /tmp/main-v796-before.go
          python tools/v796_mhs_patch.py
          node --check web/app.js

          # Visible label and RSI.
          grep -Fq 'V79.6 MH-S' web/index.html
          grep -Fq 'id="rsiCanvas"' web/index.html
          grep -Fq '[75,30]' web/app.js
          grep -Fq 'drawRsiChart' web/app.js
          grep -Fq 'rsiCanvas' web/app.js

          # Calendar must include LOW, MEDIUM and HIGH and refresh on local date change.
          grep -Fq 'impacts=1,2,3' web/index.html
          grep -Fq 'economicCalendarFrame' web/index.html
          grep -Fq 'mhLocalDayKey' web/app.js
          grep -Fq 'refreshEconomicCalendar(false)' web/app.js

          # Fixed real-clock quarter-hour schedule: 4 phases/hour, +5 re-evaluation slot.
          grep -Fq 'Math.floor(minute/15)+1' web/app.js
          grep -Fq 'startMs+5*60*1000' web/app.js
          grep -Fq 'startMs+15*60*1000' web/app.js
          grep -Fq "runScheduledAutoAction('NEW',p.key)" web/app.js
          grep -Fq "runScheduledAutoAction('REEVAL',p.key)" web/app.js
          grep -Fq 'fixedPhaseAnalysisKey===p.key' web/app.js
          grep -Fq '1H Phase ${p.phase}' web/app.js

          # Manual NEW/RE-EVALUATE send paths must not own/reset fixed timer scheduling.
          grep -Fq "if(autoSignalEnabled){noteCurrentPhaseAnalysis();await autoSendAndSchedule(d,'NEW ANALYSIS'" web/app.js
          grep -Fq "await sendDecisionWhatsApp(skipped,'RE-EVALUATE','NO ACTIVE SIGNAL" web/app.js
          grep -Fq 'function scheduleAutoAction(){if(autoSignalEnabled)updateAutoButton()}' web/app.js

          # WhatsApp organization: bold labels, BUY/SELL dots, values outside markdown label.
          grep -Fq '*MH ANALYSIS SIGNAL*' web/app.js
          grep -Fq '*MH ANALYSIS RE-EVALUATE*' web/app.js
          grep -Fq '*Entry:* ${fmt(sig.entry)}' web/app.js
          grep -Fq '*TP1:* ${fmt(sig.tp1)}' web/app.js
          grep -Fq '*TP2:* ${fmt(sig.tp2)}' web/app.js
          grep -Fq '*SL:* ${fmt(sig.sl)}' web/app.js
          grep -Fq "isSell?'🔴':'🟢'" web/app.js

          # Responsive map/startup fixes.
          grep -Fq '#mapEq{white-space:nowrap;overflow:visible' web/styles.css
          grep -Fq 'pGetStockObject.Call(4)' main.go
          grep -Fq 'wmShowReady' main.go
          grep -Fq '450*time.Millisecond' main.go

          # Critical: historical V79.6 WhatsApp sender must be unchanged byte-for-byte.
          python - <<'PY'
          from pathlib import Path
          def between(t,a,b):
              i=t.index(a); j=t.index(b,i); return t[i:j]
          a=Path('/tmp/main-v796-before.go').read_text()
          b=Path('main.go').read_text()
          assert between(a,'func sendWhatsappHandler','// --- Native Windows host') == between(b,'func sendWhatsappHandler','// --- Native Windows host')
          assert between(a,'func processWhatsAppQueue','func runHost') == between(b,'func processWhatsAppQueue','func runHost')
          print('Historical WhatsApp sender: unchanged')
          PY

      - name: Simulate fixed-clock phase rules
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          function info(h,m,s=0){const d=new Date(2026,8,19,h,m,s);const minute=d.getMinutes(),phase=Math.floor(minute/15)+1,startMinute=Math.floor(minute/15)*15;const st=new Date(d);st.setMinutes(startMinute,0,0);return{phase,start:st.getTime(),reeval:st.getTime()+5*60000,end:st.getTime()+15*60000}}
          const a=info(4,57); if(a.phase!==4 || Math.round((a.end-new Date(2026,8,19,4,57,0).getTime())/60000)!==3) throw Error('04:57 must have 3m to 05:00');
          const b=info(4,3); if(b.phase!==1 || new Date(b.reeval).getMinutes()!==5 || new Date(b.end).getMinutes()!==15) throw Error('04:03 phase rules wrong');
          const c=info(4,7); if(c.reeval>=new Date(2026,8,19,4,7).getTime()) throw Error('04:07 must have missed +5 slot');
          const d=info(4,14,50); if(d.end-new Date(2026,8,19,4,14,50).getTime()!==10000) throw Error('04:14:50 must have 10 seconds to 04:15');
          for(const m of [0,15,30,45]){const x=info(9,m);if(x.phase!==m/15+1)throw Error('phase mismatch '+m)}
          console.log('Fixed quarter-hour clock simulation passed');
          JS

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Build Windows x64 V79.6 MH-S
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w main.go
          mkdir -p dist-mhs
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist-mhs/MH Analysis V79.6 MH-S.exe' .
          file 'dist-mhs/MH Analysis V79.6 MH-S.exe'
          sha256sum 'dist-mhs/MH Analysis V79.6 MH-S.exe' | tee 'dist-mhs/SHA256SUMS.txt'
          (cd dist-mhs && zip -9 'MH-Analysis-V79.6-MH-S.zip' 'MH Analysis V79.6 MH-S.exe' SHA256SUMS.txt >/dev/null)

      - name: Upload V79.6 MH-S
        uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V79.6-MH-S
          path: |
            dist-mhs/MH Analysis V79.6 MH-S.exe
            dist-mhs/MH-Analysis-V79.6-MH-S.zip
            dist-mhs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
