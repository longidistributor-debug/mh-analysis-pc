name: Build FINAL V79.6 Exness WebView2 Fix
on:
  workflow_dispatch:
  push:
    branches: [exness-render-fix]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Verify manual timeframe baseline
        shell: powershell
        run: |
          $app=Get-Content -Raw web/app.js
          if($app -notmatch 'manual context selection must be API-silent'){throw 'manual timeframe API-silent behavior missing'}
          Write-Host 'PASS manual timeframe API-silent behavior already present'

      - name: Apply verified patches and switch Exness to WebView2
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python desktop/branding_text_patch.py
          python desktop/header_center_layout_patch.py
          python desktop/records_feature_patch.py
          python desktop/exness_feature_patch.py
          python desktop/exness_login_focus_flicker_patch.py
          python desktop/exness_login_cleanup_on_open_patch.py
          python desktop/exness_webview2_switch_patch.py
          node --check web/app.js
          Write-Host 'PASS Exness switched to native WebView2'

      - name: Source guards
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $hostSrc=Get-Content -Raw chrome_host.go
          $bridge=Get-Content -Raw exness_bridge.go
          $exwv=Get-Content -Raw native_exness_bridge_windows.go
          $runtime=Get-Content -Raw web/runtime-fixes.css
          $app=Get-Content -Raw web/app.js
          if($hostSrc -notmatch 'chStartExnessWebViewUI'){throw 'Exness WebView2 start helper missing'}
          if($hostSrc -notmatch 'desktopNativeExnessSetLayout'){throw 'Exness WebView2 layout missing'}
          if($hostSrc -notmatch 'desktopNativeExnessDestroy'){throw 'Exness WebView2 shutdown missing'}
          if($exwv -notmatch 'https://my\.exness\.global/webtrading/'){throw 'exact Exness URL missing from native WebView2'}
          if($exwv -notmatch 'MoveFocus'){throw 'WebView2 keyboard focus path missing'}
          if($bridge -notmatch 'desktopNativeExnessEval'){throw 'Exness automation not switched to WebView2'}
          if($bridge -notmatch '/api/exness/render-check'){throw 'WebView2 render-check route missing'}
          if($bridge -notmatch 'sign in with google'){throw 'Google login hide rule missing'}
          if($bridge -notmatch 'forgot password'){throw 'forgot-password hide rule missing'}
          if($bridge -match "clickText\(\[[^\]]*Place order"){throw 'unsafe Place order automation'}
          if($bridge -match "clickText\(\[[^\]]*Confirm"){throw 'unsafe Confirm automation'}
          if($runtime -notmatch 'MH_HEADER_CENTER_V796_START'){throw 'centered header regression'}
          if($app -notmatch 'manual context selection must be API-silent'){throw 'manual timeframe regression'}
          Write-Host 'PASS WebView2 + no-submit + existing-feature source guards'

      - name: Build Windows x64 EXE
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w main.go chrome_host.go records.go exness_bridge.go native_exness_bridge_windows.go dpi_windows.go
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          sha256sum 'dist/MH Analysis.exe' | tee dist/SHA256SUMS.txt
          powershell -NoProfile -Command "Compress-Archive -Path 'dist/MH Analysis.exe','dist/SHA256SUMS.txt' -DestinationPath 'dist/MH-Analysis-V79.6-Exness-WebView2-Fix.zip' -Force"

      - name: Existing app startup restart regression
        shell: powershell
        run: desktop/runtime_seamless_test.ps1

      - name: Verify Exness WebView2 DOM and visible pixels
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:MH_SMOKE_TEST='1'
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class ExWVWin {
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h,uint m,IntPtr w,IntPtr l);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h,out RECT r);
            public struct RECT { public int Left,Top,Right,Bottom; }
          }
          '@
          $p=Start-Process -FilePath (Resolve-Path 'dist/MH Analysis.exe') -PassThru
          $server=''
          try {
            for($i=0;$i -lt 60;$i++){$p.Refresh();if($p.MainWindowHandle -ne 0){break};Start-Sleep -Milliseconds 250}
            [IntPtr]$h=$p.MainWindowHandle;if($h -eq [IntPtr]::Zero){throw 'host missing'}
            for($i=0;$i -lt 60;$i++){
              try{$ls=Get-NetTCPConnection -State Listen -OwningProcess $p.Id -ErrorAction Stop|Where-Object{$_.LocalAddress -eq '127.0.0.1'}|Select-Object -First 1;if($ls){$server="http://127.0.0.1:$($ls.LocalPort)";(Invoke-WebRequest "$server/" -UseBasicParsing -TimeoutSec 2)|Out-Null;break}}catch{}
              Start-Sleep -Milliseconds 250
            }
            if(!$server){throw 'local service missing'}
            Start-Sleep -Seconds 2
            $pre=Get-CimInstance Win32_Process -ErrorAction SilentlyContinue|Where-Object{($_.Name -eq 'chrome.exe' -or $_.Name -eq 'msedge.exe') -and $_.CommandLine -match 'ExnessProfile'}|Select-Object -First 1
            if($pre){throw 'legacy Exness Chrome process launched unexpectedly'}
            [ExWVWin]::PostMessage($h,0x0111,[IntPtr]1004,[IntPtr]::Zero)|Out-Null

            $render=$null
            for($i=0;$i -lt 60;$i++){
              try{$render=Invoke-RestMethod "$server/api/exness/render-check" -Method Get -TimeoutSec 4}catch{$render=$null}
              if($render -and $render.ok -and [int]$render.htmlLength -gt 500 -and ($render.ready -eq 'interactive' -or $render.ready -eq 'complete')){break}
              Start-Sleep -Milliseconds 400
            }
            if(-not $render -or -not $render.ok){throw 'Exness WebView2 DOM render check failed'}
            if([int]$render.htmlLength -le 500){throw "Exness WebView2 DOM empty htmlLength=$($render.htmlLength)"}
            if($render.url -notmatch 'exness'){throw "unexpected Exness WebView2 URL: $($render.url)"}

            Start-Sleep -Seconds 2
            $r=New-Object ExWVWin+RECT;[void][ExWVWin]::GetWindowRect($h,[ref]$r)
            $w=[Math]::Max(1,$r.Right-$r.Left);$hh=[Math]::Max(1,$r.Bottom-$r.Top)
            $bmp=New-Object Drawing.Bitmap $w,$hh
            $g=[Drawing.Graphics]::FromImage($bmp);$g.CopyFromScreen($r.Left,$r.Top,0,0,(New-Object Drawing.Size $w,$hh));$g.Dispose()
            $nonBlack=0;$samples=0
            for($y=90;$y -lt $hh;$y+=35){for($x=20;$x -lt $w;$x+=35){$c=$bmp.GetPixel($x,$y);$samples++;if(($c.R+$c.G+$c.B) -gt 36){$nonBlack++}}}
            $bmp.Save((Join-Path $PWD 'dist\exness-webview2-render.png'),[Drawing.Imaging.ImageFormat]::Png);$bmp.Dispose()
            if($nonBlack -lt 20){throw "Exness WebView2 surface is black: nonBlack=$nonBlack/$samples"}
            Write-Host "PASS Exness WebView2 DOM + visible pixels nonBlack=$nonBlack/$samples url=$($render.url)"
          } finally {
            if($server){try{Invoke-WebRequest ($server+'/api/shutdown') -UseBasicParsing -TimeoutSec 2|Out-Null}catch{}}
            Start-Sleep -Seconds 2
            if(!$p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
            Remove-Item Env:MH_SMOKE_TEST -ErrorAction SilentlyContinue
          }

      - name: Verify Records and DPI retained
        shell: powershell
        run: |
          $src=Get-Content -Raw web/records.html
          if($src -notmatch 'ACCURACY CHECK'){throw 'Records regression'}
          $dpi=Get-Content -Raw dpi_windows.go
          if($dpi -notmatch 'SetProcessDpiAwarenessContext'){throw 'DPI regression'}
          Write-Host 'PASS Records + DPI retained'

      - name: Upload verified WebView2 build
        uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V79.6-Exness-WebView2-Fix-FINAL
          path: |
            dist/MH Analysis.exe
            dist/MH-Analysis-V79.6-Exness-WebView2-Fix.zip
            dist/SHA256SUMS.txt
            dist/exness-webview2-render.png
          if-no-files-found: error
          retention-days: 90

      - name: Publish EXE-only final branch and remove work branch
        shell: bash
        run: |
          set -euo pipefail
          cp 'dist/MH Analysis.exe' "$RUNNER_TEMP/MH Analysis.exe"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan __exness_webview2_fix_final
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP/MH Analysis.exe" './MH Analysis.exe'
          git add 'MH Analysis.exe'
          git commit -m 'MH Analysis V79.6 Exness WebView2 fix final EXE only'
          git push --force origin HEAD:final-current-v796
          git push origin --delete exness-render-fix
          echo 'PASS final-current-v796 contains only verified WebView2-fixed EXE'
