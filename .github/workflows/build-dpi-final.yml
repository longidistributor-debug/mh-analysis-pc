name: Build FINAL DPI Adaptive V79.6

on:
  workflow_dispatch:
  push:
    branches: [final-current-v796]
    paths:
      - 'dpi_windows.go'
      - 'chrome_host.go'
      - 'web/**'
      - 'desktop/manual_timeframe_no_api_patch.py'
      - '.github/workflows/build-dpi-final.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Apply manual timeframe no-API rule
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python desktop/manual_timeframe_no_api_patch.py
          node --check web/app.js
          $s = Get-Content -Raw web/app.js
          $start = $s.IndexOf('async function contextChanged(){')
          $end = $s.IndexOf("`n}`n`nasync function saveBackendSetting", $start)
          if ($start -lt 0 -or $end -lt 0) { throw 'contextChanged block missing' }
          $block = $s.Substring($start, $end - $start)
          foreach($bad in @('fetchCandles(', 'candlesForAnalysis(', 'loadContextChart(', 'refreshMarketCap(', "fetch('/api/history")) {
            if ($block.Contains($bad)) { throw "Manual context still calls $bad" }
          }
          if ($s -notmatch 'Manual selection only • no market/API request has been made') { throw 'Blank manual-selection view missing' }
          if (($s.Split('const f=await candlesForAnalysis()').Count - 1) -lt 2) { throw 'Explicit NEW/RE-EVALUATE history paths missing' }
          Write-Host 'PASS manual timeframe/pair selection is blank and API-silent; explicit analysis paths preserved'

      - name: Verify DPI adaptive source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $s = Get-Content -Raw dpi_windows.go
          if ($s -notmatch 'SetProcessDpiAwarenessContext') { throw 'Per-Monitor V2 DPI API missing' }
          if ($s -notmatch '\^uintptr\(3\)') { throw 'PER_MONITOR_AWARE_V2 context missing' }
          if ($s -notmatch 'SetProcessDpiAwareness') { throw 'Windows 8.1 DPI fallback missing' }
          if ($s -notmatch 'SetProcessDPIAware') { throw 'Windows 7 DPI fallback missing' }

      - name: Build Windows x64 EXE
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w dpi_windows.go
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          sha256sum 'dist/MH Analysis.exe' | tee dist/SHA256SUMS.txt

      - name: Create ZIP
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Compress-Archive -Path 'dist/MH Analysis.exe','dist/SHA256SUMS.txt' -DestinationPath 'dist/MH-Analysis-V79.6-DPI-Adaptive.zip' -Force

      - name: Runtime startup frame responsiveness restart
        shell: powershell
        run: desktop/runtime_seamless_test.ps1

      - name: Runtime API and Signal Link flow
        shell: powershell
        run: desktop/runtime_native_settings_click_test.ps1

      - name: Verify Per-Monitor V2 and embedded browser fills host
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class WinBounds {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left,Top,Right,Bottom; }
            [DllImport("user32.dll")] public static extern bool GetClientRect(IntPtr hWnd, out RECT r);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT r);
            [DllImport("user32.dll")] public static extern bool EnumChildWindows(IntPtr parent, EnumProc cb, IntPtr lp);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h, System.Text.StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern uint GetDpiForWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern IntPtr GetWindowDpiAwarenessContext(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool AreDpiAwarenessContextsEqual(IntPtr a, IntPtr b);
            public delegate bool EnumProc(IntPtr h, IntPtr lp);
          }
          '@
          $env:MH_SMOKE_TEST='1'
          $p=Start-Process -FilePath (Resolve-Path 'dist/MH Analysis.exe') -PassThru
          try {
            $deadline=(Get-Date).AddSeconds(25)
            $hostWnd=[IntPtr]::Zero
            while((Get-Date)-lt $deadline){
              $p.Refresh(); if($p.MainWindowHandle -ne 0){$hostWnd=$p.MainWindowHandle; break}; Start-Sleep -Milliseconds 200
            }
            if($hostWnd -eq [IntPtr]::Zero){throw 'Host window not found'}
            $ctx=[WinBounds]::GetWindowDpiAwarenessContext($hostWnd)
            $pmv2=[IntPtr](-4)
            if(-not [WinBounds]::AreDpiAwarenessContextsEqual($ctx,$pmv2)){throw "Host is not Per-Monitor V2 DPI aware. Context=$ctx"}
            Start-Sleep -Seconds 4
            $child=[IntPtr]::Zero
            [WinBounds]::EnumChildWindows($hostWnd, {
              param($h,$lp)
              $sb=New-Object System.Text.StringBuilder 128
              [void][WinBounds]::GetClassName($h,$sb,128)
              if($sb.ToString().StartsWith('Chrome_WidgetWin')){ $script:child=$h; return $false }
              return $true
            }, [IntPtr]::Zero) | Out-Null
            if($child -eq [IntPtr]::Zero){throw 'Embedded Chrome child not found'}
            $hr=New-Object WinBounds+RECT; $cr=New-Object WinBounds+RECT
            [void][WinBounds]::GetClientRect($hostWnd,[ref]$hr)
            [void][WinBounds]::GetWindowRect($child,[ref]$cr)
            $hostW=$hr.Right-$hr.Left; $hostH=$hr.Bottom-$hr.Top
            $childW=$cr.Right-$cr.Left; $childH=$cr.Bottom-$cr.Top
            $dpi=[WinBounds]::GetDpiForWindow($hostWnd)
            Write-Host "Host PMv2=yes DPI=$dpi client=${hostW}x${hostH}; child=${childW}x${childH}"
            if([Math]::Abs($hostW-$childW) -gt 4){throw "Child width does not fill host: $childW vs $hostW"}
            if([Math]::Abs(($hostH-46)-$childH) -gt 6){throw "Child height does not fill host below toolbar: $childH vs $($hostH-46)"}
            Write-Host 'PASS Per-Monitor V2 + embedded browser fills host client area'
          } finally {
            if(!$p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          }

      - name: Persist verified manual-timeframe source
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- web/app.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add web/app.js
            git commit -m 'Lock manual timeframe selection to blank no-API view [skip ci]'
            git push origin HEAD:final-current-v796
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V79.6-DPI-Adaptive-NoManualAPI
          path: |
            dist/MH Analysis.exe
            dist/MH-Analysis-V79.6-DPI-Adaptive.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
