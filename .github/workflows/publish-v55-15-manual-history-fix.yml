name: Publish MH Analysis V.55.15 Manual History Fix

on:
  push:
    branches: [records-mt5-local-build]
    paths: ['vercel-auth/trigger-v5515']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - uses: actions/setup-go@v5
        with: {go-version: '1.23.2', cache: false}

      - name: Verify only manual history fix
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if((Get-Content -Raw VERSION).Trim() -ne 'V.55.15'){throw 'VERSION mismatch'}
          $r=Get-Content -Raw web/runtime-fixes.js
          $a=Get-Content -Raw web/app.js
          foreach($m in @('V.55.15: app.js contextChanged() is already API-silent','Do NOT intercept /api/history here')){if(-not $r.Contains($m)){throw "runtime fix missing: $m"}}
          if($r.Contains('suppressNextContextHistory')){throw 'old history suppression gate still present'}
          if(-not $a.Contains('return await executeNewAnalysis(false)')){throw 'manual NEW path missing'}
          if(-not $a.Contains('return await executeReevaluate(false)')){throw 'manual RE-EVALUATE path missing'}
          if($a.Contains('loadContextChart();') -and $a.Contains('async function contextChanged()')){Write-Host 'loadContextChart exists elsewhere; checking exact context block below'}
          node --check web/app.js
          node --check web/runtime-fixes.js
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'tests failed'}

      - name: Build EXE and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          sha256sum 'dist/MH Analysis.exe' | tee dist/SHA256SUMS.txt
          HASH=$(awk '{print $1}' dist/SHA256SUMS.txt)
          printf 'V.55.15\n' > dist/VERSION
          printf '{"version":"V.55.15","mandatory":true,"download_url":"https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%%20Analysis.exe","sha256":"%s","notes":"V.55.15 fixes the actual manual-analysis bug: the runtime one-shot history suppression flag was blocking the first manual NEW ANALYZE or RE-EVALUATE request after pair/timeframe selection when Get Signal was OFF. Get Signal now controls only automatic scheduling; manual history/chart/analysis stays independent. No other behavior changed."}\n' "$HASH" > dist/update.json

      - name: Install Inno Setup
        shell: powershell
        run: |
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not(Test-Path $iscc)){choco install innosetup -y --no-progress}
          if(-not(Test-Path $iscc)){throw 'ISCC unavailable'}

      - name: Build installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          New-Item -ItemType Directory -Force dist-installer|Out-Null
          $src=(Resolve-Path 'dist\MH Analysis.exe').Path
          $out=(Resolve-Path dist-installer).Path
          & $iscc '/Qp' "/DMySourceExe=$src" "/DMyOutputDir=$out" '/DMyAppVersion=V.55.15' '/DMyOutputBaseFilename=MH-Analysis-Setup-V.55.15' 'installer\MHAnalysis-V01.iss'
          if($LASTEXITCODE -ne 0){throw 'ISCC failed'}

      - name: Package
        shell: powershell
        run: Compress-Archive -Path 'dist\MH Analysis.exe','dist\SHA256SUMS.txt','dist\update.json','dist\VERSION','dist-installer\MH-Analysis-Setup-V.55.15.exe' -DestinationPath 'dist\MH-Analysis-V.55.15.zip' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V.55.15
          path: |
            dist/MH Analysis.exe
            dist/MH-Analysis-V.55.15.zip
            dist/SHA256SUMS.txt
            dist/update.json
            dist/VERSION
            dist-installer/MH-Analysis-Setup-V.55.15.exe
          if-no-files-found: error

      - name: Publish mandatory updater channel
        shell: bash
        run: |
          set -euo pipefail
          cp 'dist/MH Analysis.exe' "$RUNNER_TEMP/MH Analysis.exe"
          cp dist/update.json "$RUNNER_TEMP/update.json"
          cp dist/VERSION "$RUNNER_TEMP/VERSION"
          cp dist/SHA256SUMS.txt "$RUNNER_TEMP/SHA256SUMS.txt"
          cp 'dist-installer/MH-Analysis-Setup-V.55.15.exe' "$RUNNER_TEMP/MH-Analysis-Setup-V.55.15.exe"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan __v5515
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP/MH Analysis.exe" './MH Analysis.exe'
          cp "$RUNNER_TEMP/update.json" update.json
          cp "$RUNNER_TEMP/VERSION" VERSION
          cp "$RUNNER_TEMP/SHA256SUMS.txt" SHA256SUMS.txt
          cp "$RUNNER_TEMP/MH-Analysis-Setup-V.55.15.exe" './MH-Analysis-Setup-V.55.15.exe'
          git add .
          git commit -m 'MH Analysis V.55.15 manual history fix release'
          git push --force origin HEAD:mh-analysis-update-channel
