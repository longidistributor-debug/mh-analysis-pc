name: Publish MH Analysis V28 Hardfix

on:
  workflow_dispatch:
  push:
    branches: [v28-device-flicker-hardfix]
    paths: ['.github/workflows/publish-v28-hardfix.yml']

permissions:
  contents: write

concurrency:
  group: mh-analysis-v28-hardfix
  cancel-in-progress: true

jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Apply V28 hardfix
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'

          # Public updater/UI version.
          $u=Get-Content -Raw updater.go
          $u=$u -replace 'const mhPublicVersionV001 = "[^"]+"','const mhPublicVersionV001 = "V.28"'
          [IO.File]::WriteAllText((Join-Path $PWD 'updater.go'),$u,(New-Object Text.UTF8Encoding($false)))
          $idx=Get-Content -Raw web/index.html
          $idx=$idx -replace '<div class="version">[^<]*</div>','<div class="version">V.28 AUTO CYCLE (HAMMAD & SOMI)</div>'
          $idx=$idx -replace '<div class="mhUpdateVersionV001" id="mhUpdateVersionV001">[^<]*</div>','<div class="mhUpdateVersionV001" id="mhUpdateVersionV001">V.28</div>'
          [IO.File]::WriteAllText((Join-Path $PWD 'web/index.html'),$idx,(New-Object Text.UTF8Encoding($false)))

          # License app version + correct native MachineGuid path.
          $lic=Get-Content -Raw license_auth.go
          $lic=$lic -replace 'const licAppVersion = "[^"]+"','const licAppVersion = "V.28"'
          $lic=$lic.Replace('`SOFTWARE\\\\Microsoft\\\\Cryptography`','`SOFTWARE\Microsoft\Cryptography`')

          # Serialize identity creation to prevent parallel login/status races.
          $lic=$lic.Replace('licMu                    sync.Mutex', "licMu                    sync.Mutex`r`n`tlicDeviceMu              sync.Mutex")
          $lic=$lic.Replace("func licEnsureDevice() (*licDevice, error) {`r`n", "func licEnsureDevice() (*licDevice, error) {`r`n`tlicDeviceMu.Lock()`r`n`tdefer licDeviceMu.Unlock()`r`n")

          # Self-heal stale/corrupt DPAPI identity left by older builds instead of permanently failing login.
          $old=@'
	if _, statErr := os.Stat(path); statErr == nil {
		if err := licReadProtected(path, &disk); err != nil {
			return nil, fmt.Errorf("existing device identity cannot be read: %w", err)
		}
		raw, err := base64.StdEncoding.DecodeString(disk.PrivateKey)
		if err != nil || len(raw) != ed25519.PrivateKeySize {
			return nil, errors.New("existing device identity is invalid")
		}
		priv := ed25519.PrivateKey(raw)
		pub := priv.Public().(ed25519.PublicKey)
		der, err := x509.MarshalPKIXPublicKey(pub)
		if err != nil {
			return nil, err
		}
		return &licDevice{Private: priv, Public: pub, DER: der, ID: machineID}, nil
	} else if !os.IsNotExist(statErr) {
		return nil, statErr
	}
'@
          $new=@'
	if _, statErr := os.Stat(path); statErr == nil {
		readErr := licReadProtected(path, &disk)
		if readErr == nil {
			raw, decErr := base64.StdEncoding.DecodeString(disk.PrivateKey)
			if decErr == nil && len(raw) == ed25519.PrivateKeySize {
				priv := ed25519.PrivateKey(raw)
				pub := priv.Public().(ed25519.PublicKey)
				der, marshalErr := x509.MarshalPKIXPublicKey(pub)
				if marshalErr == nil {
					return &licDevice{Private: priv, Public: pub, DER: der, ID: machineID}, nil
				}
			}
		}
		// V28 recovery: old/broken DPAPI blob must not brick this Windows device forever.
		_ = os.Remove(path + ".tmp")
		_ = os.Remove(path)
	} else if !os.IsNotExist(statErr) {
		return nil, fmt.Errorf("device identity file unavailable: %w", statErr)
	}
'@
          if(-not $lic.Contains($old)){throw 'Could not locate old device identity block'}
          $lic=$lic.Replace($old,$new)

          # Make local secure-storage errors diagnosable instead of hiding every cause behind one generic message.
          $lic=$lic.Replace('"message": "Could not create secure device identity."','"message": "Could not create secure device identity: " + err.Error()')
          [IO.File]::WriteAllText((Join-Path $PWD 'license_auth.go'),$lic,(New-Object Text.UTF8Encoding($false)))

          # No WhatsApp/Records browser prewarm. They launch only after user click.
          $wv=Get-Content -Raw webview2_host.go
          $prewarm=@'
	// Keep WhatsApp CDP and Records ready in their own hidden embedded windows.
	// They no longer replace/unload the MH Analysis page.
	go func() {
		time.Sleep(700 * time.Millisecond)
		wv2EnsureAuxBrowser(2)
	}()
	go func() {
		time.Sleep(1100 * time.Millisecond)
		wv2EnsureAuxBrowser(3)
	}()

'@
          $wv=$wv.Replace($prewarm,'')
          # Give WebView2 first paint while host is hidden, then reveal once. This prevents white/black host flashes.
          $wv=$wv.Replace("`tb.Navigate(serverURL)`r`n`tb.Focus()`r`n`twv2SetDesiredView(1)`r`n`tchShowWindow.Call(hostHWND, chSWMaximize)", "`tb.Navigate(serverURL)`r`n`twv2SetDesiredView(1)`r`n`ttime.Sleep(450 * time.Millisecond)`r`n`tchShowWindow.Call(hostHWND, chSWMaximize)")
          [IO.File]::WriteAllText((Join-Path $PWD 'webview2_host.go'),$wv,(New-Object Text.UTF8Encoding($false)))

          gofmt -w license_auth.go webview2_host.go updater.go

      - name: V28 regression guards and tests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $lic=Get-Content -Raw license_auth.go
          $wv=Get-Content -Raw webview2_host.go
          $upd=Get-Content -Raw updater.go
          if(-not $lic.Contains('registry.LOCAL_MACHINE, `SOFTWARE\Microsoft\Cryptography`')){throw 'Correct MachineGuid registry path missing'}
          if($lic.Contains('SOFTWARE\\Microsoft\\Cryptography')){throw 'Malformed MachineGuid registry path remains'}
          foreach($m in @('licDeviceMu','old/broken DPAPI blob','Could not create secure device identity:')){if(-not $lic.Contains($m)){throw "V28 identity guard missing: $m"}}
          if($wv.Contains('time.Sleep(700 * time.Millisecond)') -or $wv.Contains('time.Sleep(1100 * time.Millisecond)')){throw 'Startup browser prewarm still present'}
          if(-not $wv.Contains('time.Sleep(450 * time.Millisecond)')){throw 'Hidden first-paint startup guard missing'}
          if(-not $upd.Contains('const mhPublicVersionV001 = "V.28"')){throw 'Updater V28 stamp missing'}
          node --check web/app.js
          node --check web/v03.js
          node --check web/records.js
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'V28 tests failed'}

      - name: Build V28 Windows EXE
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          if($LASTEXITCODE -ne 0 -or -not(Test-Path 'dist/MH Analysis.exe')){throw 'V28 EXE build failed'}

      - name: Build and verify V28 installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $iss=Get-Content -Raw 'installer\MH-Analysis-V27.iss'
          $iss=$iss -replace 'AppVersion=[^\r\n]+','AppVersion=28.0.0'
          $iss=$iss -replace 'OutputBaseFilename=[^\r\n]+','OutputBaseFilename=MH-Analysis-Setup-V28'
          [IO.File]::WriteAllText((Join-Path $PWD 'installer\MH-Analysis-V28.iss'),$iss,(New-Object Text.UTF8Encoding($false)))
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not(Test-Path $iscc)){choco install innosetup --no-progress -y}
          & $iscc 'installer\MH-Analysis-V28.iss'
          if($LASTEXITCODE -ne 0 -or -not(Test-Path 'dist\MH-Analysis-Setup-V28.exe')){throw 'V28 installer build failed'}
          $target=Join-Path $env:RUNNER_TEMP 'MHV28Verify'
          $p=Start-Process (Join-Path $PWD 'dist\MH-Analysis-Setup-V28.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR='+$target)) -PassThru -Wait
          if($p.ExitCode -ne 0 -or -not(Test-Path (Join-Path $target 'MH Analysis.exe'))){throw 'V28 installer verification failed'}
          $exeSha=(Get-FileHash 'dist\MH Analysis.exe' -Algorithm SHA256).Hash.ToLower()
          $setupSha=(Get-FileHash 'dist\MH-Analysis-Setup-V28.exe' -Algorithm SHA256).Hash.ToLower()
          "${exeSha}  MH Analysis.exe`n${setupSha}  MH-Analysis-Setup-V28.exe" | Set-Content -Encoding ascii 'dist\SHA256SUMS.txt'
          "MH_EXE_SHA=$exeSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish V28 release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release delete v28 --yes --cleanup-tag 2>$null
          if($LASTEXITCODE -ne 0){$global:LASTEXITCODE=0}
          gh release create v28 'dist/MH-Analysis-Setup-V28.exe' 'dist/MH Analysis.exe' 'dist/SHA256SUMS.txt' --target '${{ github.sha }}' --title 'MH Analysis V.28' --notes 'V.28 hard-fixes secure Windows device identity creation, self-heals stale DPAPI identity files, serializes identity creation, exposes local identity failure detail, removes startup WhatsApp/Records prewarm, and reveals the main host only after first WebView paint.'
          if($LASTEXITCODE -ne 0){throw 'V28 release publish failed'}

      - name: Publish V28 installer branch
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tmp=Join-Path $env:RUNNER_TEMP 'v28-release-files'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Copy-Item 'dist\MH Analysis.exe' (Join-Path $tmp 'MH Analysis.exe')
          Copy-Item 'dist\MH-Analysis-Setup-V28.exe' (Join-Path $tmp 'MH-Analysis-Setup-V28.exe')
          Copy-Item 'dist\SHA256SUMS.txt' (Join-Path $tmp 'SHA256SUMS.txt')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan __v28_release
          git rm -rf . 2>$null
          Get-ChildItem -Force | Where-Object {$_.Name -ne '.git'} | Remove-Item -Recurse -Force
          Copy-Item (Join-Path $tmp 'MH Analysis.exe') '.\MH Analysis.exe'
          Copy-Item (Join-Path $tmp 'MH-Analysis-Setup-V28.exe') '.\MH-Analysis-Setup-V28.exe'
          Copy-Item (Join-Path $tmp 'SHA256SUMS.txt') '.\SHA256SUMS.txt'
          Set-Content VERSION 'V.28' -Encoding ascii
          git add .
          git commit -m 'Publish verified MH Analysis V.28 installer'
          git push --force origin HEAD:v28-release
          if($LASTEXITCODE -ne 0){throw 'V28 installer branch publish failed'}

      - name: Publish mandatory V28 updater manifest
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $exeSource=Join-Path $env:RUNNER_TEMP 'v28-release-files\MH Analysis.exe'
          $sha=(Get-FileHash $exeSource -Algorithm SHA256).Hash.ToLower()
          $tmp=Join-Path $env:RUNNER_TEMP 'v28-update-channel'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Copy-Item $exeSource (Join-Path $tmp 'MH Analysis.exe')
          $manifest=[ordered]@{version='V.28';mandatory=$true;download_url='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%20Analysis.exe';sha256=$sha;notes='MANDATORY V.28 - secure device identity hardfix and startup flicker hardfix.'} | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $tmp 'update.json'),$manifest,(New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Join-Path $tmp 'VERSION'),'V.28'+[Environment]::NewLine,(New-Object Text.UTF8Encoding($false)))
          git checkout --orphan __v28_update
          git rm -rf . 2>$null
          Get-ChildItem -Force | Where-Object {$_.Name -ne '.git'} | Remove-Item -Recurse -Force
          Copy-Item (Join-Path $tmp 'MH Analysis.exe') '.\MH Analysis.exe'
          Copy-Item (Join-Path $tmp 'update.json') '.\update.json'
          Copy-Item (Join-Path $tmp 'VERSION') '.\VERSION'
          git add .
          git commit -m 'Publish MH Analysis V.28 mandatory update'
          git push --force origin HEAD:mh-analysis-update-channel
          if($LASTEXITCODE -ne 0){throw 'V28 updater manifest publish failed'}
