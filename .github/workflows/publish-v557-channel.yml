name: Publish V557 Channel
on:
  push:
    branches: [v55.7-regression-fix]
    paths:
      - 'vercel-auth/publish-v557'
      - '.github/workflows/publish-v557-channel.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: v55.7-regression-fix}
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.2', cache: false}
      - name: Verify V55.7 regressions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $v=Get-Content -Raw web\v31.js
          if($v.Contains('Normal trading mode')){throw 'Normal Trading Mode present'}
          if($v.Contains("mk('mhProgressiveV1'")){throw 'Progressive UI present'}
          foreach($m in @('mhSlAdjustment','mhFastScalping','progressive_v1:true')){if(-not $v.Contains($m)){throw "missing $m"}}
          $p=Get-Content -Raw web\v553-placement.js
          if($p.Contains('mhProgressiveV1')){throw 'Progressive placement present'}
          node --check web/v31.js
          node --check web/v553-placement.js
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'tests failed'}
      - name: Set exact V.55.7 identity
        shell: python
        run: |
          from pathlib import Path
          def rd(p):
            b=Path(p).read_bytes()
            for e in ('utf-8-sig','cp1252','latin-1'):
              try:return b.decode(e)
              except UnicodeDecodeError:pass
            raise RuntimeError(p)
          def wr(p,s):Path(p).write_text(s,encoding='utf-8')
          assert 'const mhPublicVersionV001 = "V.55.7"' in rd('updater.go')
          wr('VERSION','V.55.7\n')
          for f,a,b in [('license_auth.go','const licAppVersion = "V.55.3"','const licAppVersion = "V.55.7"'),('web/index.html','id="mhUpdateVersionV001">V.55.3</div>','id="mhUpdateVersionV001">V.55.7</div>')]:
            s=rd(f);assert a in s,(f,a);wr(f,s.replace(a,b,1))
      - name: Test build and installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check web/v553-placement.js
          node --check web/v31.js
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'tests failed'}
          New-Item -ItemType Directory -Force dist,dist-installer|Out-Null
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          if($LASTEXITCODE -ne 0){throw 'build failed'}
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not(Test-Path $iscc)){choco install innosetup -y --no-progress}
          $src=(Resolve-Path 'dist\MH Analysis.exe').Path;$out=(Resolve-Path dist-installer).Path
          & $iscc '/Qp' "/DMySourceExe=$src" "/DMyOutputDir=$out" '/DMyAppVersion=V.55.7' '/DMyOutputBaseFilename=MH-Analysis-Setup-V.55.7' 'installer\MHAnalysis-V01.iss'
          if($LASTEXITCODE -ne 0){throw 'installer failed'}
          $sha=(Get-FileHash 'dist\MH Analysis.exe' -Algorithm SHA256).Hash.ToLower()
          "$sha  MH Analysis.exe"|Set-Content -Encoding ascii dist\SHA256SUMS.txt
          'V.55.7'|Set-Content -Encoding ascii dist\VERSION
          $m=[ordered]@{version='V.55.7';mandatory=$true;download_url='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%20Analysis.exe';sha256=$sha;notes='V.55.7 restores existing app functions, removes Normal Trading Mode and separate Progressive UI, keeps Progressive internal, and keeps SL Adjustment plus Fast Scalping.'}|ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD 'dist\update.json'),$m,(New-Object Text.UTF8Encoding($false)))
          Compress-Archive -Path 'dist\MH Analysis.exe','dist\SHA256SUMS.txt','dist\update.json','dist\VERSION','dist-installer\MH-Analysis-Setup-V.55.7.exe' -DestinationPath 'dist\MH-Analysis-V.55.7.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V.55.7
          path: |
            dist/MH Analysis.exe
            dist/MH-Analysis-V.55.7.zip
            dist/SHA256SUMS.txt
            dist/update.json
            dist/VERSION
            dist-installer/MH-Analysis-Setup-V.55.7.exe
          if-no-files-found: error
      - name: Publish updater channel atomically
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pub"
          cp 'dist/MH Analysis.exe' "$RUNNER_TEMP/pub/MH Analysis.exe"
          cp dist/update.json "$RUNNER_TEMP/pub/update.json"
          cp dist/VERSION "$RUNNER_TEMP/pub/VERSION"
          cp dist/SHA256SUMS.txt "$RUNNER_TEMP/pub/SHA256SUMS.txt"
          cp 'dist-installer/MH-Analysis-Setup-V.55.7.exe' "$RUNNER_TEMP/pub/MH-Analysis-Setup-V.55.7.exe"
          git reset --hard HEAD
          git clean -fd
          git fetch origin mh-analysis-update-channel
          git checkout -B mh-analysis-update-channel origin/mh-analysis-update-channel
          cp "$RUNNER_TEMP/pub/MH Analysis.exe" './MH Analysis.exe'
          cp "$RUNNER_TEMP/pub/update.json" update.json
          cp "$RUNNER_TEMP/pub/VERSION" VERSION
          cp "$RUNNER_TEMP/pub/SHA256SUMS.txt" SHA256SUMS.txt
          cp "$RUNNER_TEMP/pub/MH-Analysis-Setup-V.55.7.exe" './MH-Analysis-Setup-V.55.7.exe'
          git add 'MH Analysis.exe' update.json VERSION SHA256SUMS.txt 'MH-Analysis-Setup-V.55.7.exe'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish MH Analysis V.55.7 updater channel'
          git push origin mh-analysis-update-channel
