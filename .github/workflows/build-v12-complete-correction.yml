name: Build MH Analysis V.12 Complete Correction
on:
  workflow_dispatch:
  push:
    branches: [v02-restored-working-base]
    paths:
      - 'desktop/v12_complete_correction_patch.py'
      - '.github/workflows/build-v12-complete-correction.yml'
permissions:
  contents: write
concurrency:
  group: mh-analysis-v12-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.2', cache: false}
      - name: Apply V.12 corrections
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python desktop/v12_complete_correction_patch.py
          gofmt -w license_auth.go updater.go chrome_host.go webview2_host.go
      - name: Contract checks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $w=Get-Content -Raw webview2_host.go; $c=Get-Content -Raw chrome_host.go; $i=Get-Content -Raw web/index.html; $r=Get-Content -Raw web/records.html; $a=Get-Content -Raw license_auth.go
          if($w -notmatch 'MH_V12_CAPTURE_PROTECTION'){throw 'capture protection missing'}
          if($w -notmatch 'chDesiredView = 4'){throw 'MT5 desired-view correction missing'}
          if($c -notmatch 'SetWindowDisplayAffinity'){throw 'capture API missing'}
          if($i -notmatch 'V\.12 \(CH Shaukat Ali\)'){throw 'MH Analysis V12 label missing'}
          if($r -notmatch 'V\.12 \(CH Shaukat Ali\)'){throw 'Records V12 label missing'}
          if($i -match 'â€”|Ø¨Ù|â€¢|â—†'){throw 'mojibake still present in main HTML'}
          if($a -notmatch 'const licAppVersion = "V.12"'){throw 'V12 auth client version missing'}
      - name: Compile
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force dist|Out-Null
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
      - name: Runtime smoke test
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=Start-Process -FilePath (Resolve-Path 'dist/MH Analysis.exe') -PassThru
          Start-Sleep 12
          if($p.HasExited){throw "V.12 exited: $($p.ExitCode)"}
          Stop-Process -Id $p.Id -Force
      - name: Build V.12 installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not(Test-Path $iscc)){choco install innosetup --no-progress -y}
          $iss=Get-Content -Raw 'installer/MHAnalysis-V04.iss'
          $iss=$iss.Replace('V.04','V.12').Replace('MH Analysis V.04.exe','MH Analysis V.12.exe')
          Set-Content -Encoding UTF8 'installer/MHAnalysis-V12.iss' $iss
          & $iscc 'installer/MHAnalysis-V12.iss'
          if($LASTEXITCODE -ne 0){throw 'installer failed'}
          $x=Get-ChildItem -Recurse -Filter 'MH Analysis V.12.exe'|Select-Object -First 1
          if(-not$x){throw 'installer missing'}
          Copy-Item $x.FullName 'dist/MH-Analysis-V12-Installer.exe'
      - name: Commit V.12 corrected source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION updater.go license_auth.go chrome_host.go webview2_host.go web/index.html web/records.html
          if((git diff --cached --quiet) -eq $false){git commit -m 'Apply MH Analysis V.12 complete correction [skip ci]'}
          git fetch origin v02-restored-working-base
          git rebase origin/v02-restored-working-base
          git push origin HEAD:v02-restored-working-base
      - name: Publish mandatory V.12 update channel
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $sha=(Get-FileHash 'dist/MH Analysis.exe' -Algorithm SHA256).Hash.ToLower()
          git fetch origin mh-analysis-update-channel
          git worktree add update-channel origin/mh-analysis-update-channel
          Copy-Item 'dist/MH Analysis.exe' 'update-channel/MH-Analysis-V12.exe' -Force
          $manifest=[ordered]@{version='V.12';mandatory=$true;download_url='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH-Analysis-V12.exe';sha256=$sha;notes='V.12 preserves bound-device login, fixes MT5 tab visibility, restores corrupted UI text, adds Windows capture exclusion, and displays V.12 (CH Shaukat Ali) in MH Analysis and Records.'}
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'update-channel/update.json'),($manifest|ConvertTo-Json),(New-Object Text.UTF8Encoding($false)))
          Push-Location update-channel
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MH-Analysis-V12.exe update.json
          if((git status --porcelain).Length -gt 0){git commit -m 'Publish mandatory MH Analysis V.12'; git pull --rebase origin mh-analysis-update-channel; git push origin HEAD:mh-analysis-update-channel}
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V12-Final
          path: |
            dist/MH-Analysis-V12-Installer.exe
            dist/MH Analysis.exe
          retention-days: 90
