name: Build V81.5 Records Inline

on:
  workflow_dispatch:
  push:
    branches: [records-mt5-local-build]
    paths: ['vercel-auth/trigger-v815']

permissions:
  contents: write

concurrency:
  group: mh-analysis-v815-records-inline
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Apply retained systems plus V81.5 Records inline fix
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          function Patch([string]$p){ python $p; if($LASTEXITCODE -ne 0){ throw "Patch failed: $p" } }
          foreach($p in @(
            'desktop/branding_text_patch.py',
            'desktop/header_center_layout_patch.py',
            'desktop/records_feature_patch.py',
            'desktop/chart_reset_only_patch.py',
            'desktop/native_mt5_terminal_patch.py',
            'desktop/native_button_id_fix_patch.py',
            'desktop/ea_signal_reader_bridge_patch.py',
            'desktop/records_mt5_local_patch.py',
            'desktop/signal_duplicate_guard_patch.py',
            'desktop/license_auth_patch.py',
            'desktop/window_flicker_fix_patch.py',
            'desktop/license_login_focus_patch.py',
            'desktop/license_v803_patch.py',
            'desktop/license_v804_patch.py',
            'desktop/license_v806_runtime_fix_patch.py',
            'vercel-auth/license_v807_auth_loader_patch.py',
            'desktop/license_v808_device_identity_patch.py',
            'desktop/license_v809_preserve_original_ui_patch.py',
            'desktop/license_v810_single_frame_patch.py',
            'desktop/license_v811_chrome_frame_hard_fix_patch.py',
            'desktop/license_v812_password_responsive_fix_patch.py',
            'desktop/license_v813_single_exe_crop_patch.py',
            'desktop/license_v814_records_view_recovery_patch.py',
            'desktop/license_v815_records_inline_patch.py'
          )){ Patch $p }
          if(Test-Path 'exness_bridge.go'){ Remove-Item 'exness_bridge.go' -Force }
          node --check web/app.js
          node --check web/records.js
          node --check web/auth.js

      - name: V81.5 source guards
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $hostSrc=Get-Content -Raw chrome_host.go
          $main=Get-Content -Raw main.go
          $license=Get-Content -Raw license_auth.go
          $app=Get-Content -Raw web/app.js
          foreach($m in @('MH_PASSWORD_RESPONSIVE_FIX_V812','MH_SINGLE_EXE_CROP_V813','MH_RECORDS_INLINE_V815','which == 1 || which == 3')){if(-not $hostSrc.Contains($m)){throw "V81.5 host regression $m"}}
          foreach($m in @('nativeViewHandlerV815','/api/native-view')){if(-not $main.Contains($m)){throw "V81.5 native-view regression $m"}}
          foreach($m in @('MH_RECORDS_INLINE_V815','mhRecordsInlineFrameV815','/records.html','/api/native-view')){if(-not $app.Contains($m)){throw "V81.5 app regression $m"}}
          foreach($m in @('licAppVersion = "80.8"','MH_SECURE_LICENSE_V808','licDeterministicDevice')){if(-not $license.Contains($m)){throw "license regression $m"}}
          if(-not $app.Contains('MH_SAME_SIGNAL_GUARD_V799')){throw 'duplicate guard regression'}
          if(Test-Path 'exness_bridge.go'){throw 'legacy exness bridge must not compile'}
          Write-Host 'PASS V81.5 source guards'

      - name: Native Records bridge unit regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          //go:build windows
          package main
          import("encoding/json";"net/http/httptest";"testing")
          func TestNativeViewHandlerV815(t *testing.T){
            chViewMu.Lock(); old:=chDesiredView; chDesiredView=3; chViewMu.Unlock()
            defer func(){ chViewMu.Lock(); chDesiredView=old; chViewMu.Unlock() }()
            rr:=httptest.NewRecorder(); req:=httptest.NewRequest("GET","/api/native-view",nil)
            nativeViewHandlerV815(rr,req)
            if rr.Code!=200{t.Fatalf("status %d",rr.Code)}
            var v map[string]int
            if err:=json.Unmarshal(rr.Body.Bytes(),&v);err!=nil{t.Fatal(err)}
            if v["view"]!=3{t.Fatalf("view=%d",v["view"])}
          }
          '@ | Set-Content -Encoding UTF8 native_view_v815_windows_test.go
          go test -run TestNativeViewHandlerV815 -count=1 .
          if($LASTEXITCODE -ne 0){throw 'native Records bridge regression failed'}
          Remove-Item native_view_v815_windows_test.go -Force

      - name: Same-device unlimited-login regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          //go:build windows
          package main
          import("os";"testing")
          func TestSameDeviceIdentityV815(t *testing.T){
            root:=t.TempDir();t.Setenv("LOCALAPPDATA",root+"\\local")
            licDeviceMem=nil
            d1,e:=licEnsureDevice();if e!=nil{t.Fatal(e)}
            for i:=0;i<100;i++{d,e:=licEnsureDevice();if e!=nil||d.ID!=d1.ID{t.Fatalf("same-device login %d changed: %v",i,e)}}
            for i:=0;i<10;i++{licDeviceMem=nil;_=os.Remove(licDevicePath());d,e:=licEnsureDevice();if e!=nil||d.ID!=d1.ID{t.Fatalf("restart %d changed: %v",i,e)}}
          }
          '@ | Set-Content -Encoding UTF8 license_v815_same_device_windows_test.go
          go test -run TestSameDeviceIdentityV815 -count=1 .
          if($LASTEXITCODE -ne 0){throw 'same-device V81.5 regression failed'}
          Remove-Item license_v815_same_device_windows_test.go -Force

      - name: Build Windows x64 EXE
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w main.go chrome_host.go records.go records_mt5_local.go ea_signal_bridge.go license_auth.go license_support_external.go dpi_windows.go
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          sha256sum 'dist/MH Analysis.exe' | tee dist/SHA256SUMS.txt
          powershell -NoProfile -Command "Compress-Archive -Path 'dist/MH Analysis.exe','dist/SHA256SUMS.txt' -DestinationPath 'dist/MH-Analysis-V81.5-Records-Inline.zip' -Force"

      - name: Records API startup resize restart and EXIT regression
        shell: powershell
        run: desktop/runtime_v815_records_inline_test.ps1

      - name: Upload verified V81.5
        uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V81.5-Records-Inline
          path: |
            dist/MH Analysis.exe
            dist/MH-Analysis-V81.5-Records-Inline.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish verified V81.5 EXE
        shell: bash
        run: |
          set -euo pipefail
          cp 'dist/MH Analysis.exe' "$RUNNER_TEMP/MH Analysis.exe"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan __records_v815_final
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP/MH Analysis.exe" './MH Analysis.exe'
          git add 'MH Analysis.exe'
          git commit -m 'MH Analysis V81.5 Records inline verified build'
          git push --force origin HEAD:records-mt5-local-final-exe
          git push --force origin HEAD:final-current-v796
