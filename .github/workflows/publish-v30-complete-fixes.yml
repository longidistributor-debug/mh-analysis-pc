name: Publish MH Analysis V30 Complete Fixes

on:
  workflow_dispatch:
  push:
    branches: [v30-complete-fixes]
    paths:
      - '.github/workflows/publish-v30-complete-fixes.yml'
      - 'scripts/v30_complete_fixes.py'
      - 'scripts/v30_post_patch.py'
      - 'scripts/v30_verify.py'
      - 'web/v30.css'

permissions:
  contents: write

concurrency:
  group: mh-analysis-v30-complete-fixes
  cancel-in-progress: true

jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Reapply retained V28 identity fixes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python scripts/v28_patch.py
          if($LASTEXITCODE -ne 0){throw 'V28 retained fixes failed'}

      - name: Reapply retained V29 regression recovery
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python scripts/v29_regression_recovery.py
          if($LASTEXITCODE -ne 0){throw 'V29 retained regression recovery failed'}
          python scripts/v29_remove_visibility_gates.py
          if($LASTEXITCODE -ne 0){throw 'V29 hidden-window cleanup failed'}

      - name: Apply V30 complete fixes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python scripts/v30_complete_fixes.py
          if($LASTEXITCODE -ne 0){throw 'V30 complete patch failed'}
          python scripts/v30_post_patch.py
          if($LASTEXITCODE -ne 0){throw 'V30 post patch failed'}
          gofmt -w license_auth.go updater.go main.go chrome_host.go webview2_host.go records_mt5_local.go mt5_prefill.go ea_signal_bridge.go

      - name: V30 no-regression guards and tests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python scripts/v30_verify.py
          if($LASTEXITCODE -ne 0){throw 'V30 no-regression guards failed'}
          node --check web/app.js
          node --check web/v03.js
          node --check web/records.js
          node --check web/auth.js
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'V30 Go tests failed'}

      - name: Build V30 Windows EXE
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          if($LASTEXITCODE -ne 0 -or -not(Test-Path 'dist/MH Analysis.exe')){throw 'V30 EXE build failed'}

      - name: Build and verify V30 installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $iss=Get-Content -Raw 'installer\MH-Analysis-V27.iss'
          $iss=$iss -replace 'AppVersion=[^\r\n]+','AppVersion=30.0.0'
          $iss=$iss -replace 'OutputBaseFilename=[^\r\n]+','OutputBaseFilename=MH-Analysis-Setup-V30'
          [IO.File]::WriteAllText((Join-Path $PWD 'installer\MH-Analysis-V30.iss'),$iss,(New-Object Text.UTF8Encoding($false)))
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not(Test-Path $iscc)){choco install innosetup --no-progress -y}
          & $iscc 'installer\MH-Analysis-V30.iss'
          if($LASTEXITCODE -ne 0 -or -not(Test-Path 'dist\MH-Analysis-Setup-V30.exe')){throw 'V30 installer build failed'}
          $target=Join-Path $env:RUNNER_TEMP 'MHV30Verify'
          $p=Start-Process (Join-Path $PWD 'dist\MH-Analysis-Setup-V30.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR='+$target)) -PassThru -Wait
          if($p.ExitCode -ne 0 -or -not(Test-Path (Join-Path $target 'MH Analysis.exe'))){throw 'V30 installer verification failed'}
          $exeSha=(Get-FileHash 'dist\MH Analysis.exe' -Algorithm SHA256).Hash.ToLower()
          $setupSha=(Get-FileHash 'dist\MH-Analysis-Setup-V30.exe' -Algorithm SHA256).Hash.ToLower()
          "${exeSha}  MH Analysis.exe`n${setupSha}  MH-Analysis-Setup-V30.exe" | Set-Content -Encoding ascii 'dist\SHA256SUMS.txt'
          "MH_EXE_SHA=$exeSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish V30 GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Continue'
          gh release delete v30 --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE=0
          $ErrorActionPreference='Stop'
          gh release create v30 'dist/MH-Analysis-Setup-V30.exe' 'dist/MH Analysis.exe' 'dist/SHA256SUMS.txt' --target '${{ github.sha }}' --title 'MH Analysis V.30' --notes 'V.30 complete regression-safe update: MT5 embedded launch recovery, EA unique-signal automatic pending bridge, WhatsApp group/chat Signal Link sending with organized bold messages, active same-signal duplicate suppression, Unicode/layout cleanup, memorial/version branding and Sinha Creates credit. Retains V28 identity and V29 persistence/Signal Link fixes.'
          if($LASTEXITCODE -ne 0){throw 'V30 release publish failed'}

      - name: Publish V30 release branch
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tmp=Join-Path $env:RUNNER_TEMP 'v30-release-files'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Copy-Item 'dist\MH Analysis.exe' (Join-Path $tmp 'MH Analysis.exe')
          Copy-Item 'dist\MH-Analysis-Setup-V30.exe' (Join-Path $tmp 'MH-Analysis-Setup-V30.exe')
          Copy-Item 'dist\SHA256SUMS.txt' (Join-Path $tmp 'SHA256SUMS.txt')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan __v30_release
          git rm -rf . 2>$null
          Get-ChildItem -Force | Where-Object {$_.Name -ne '.git'} | Remove-Item -Recurse -Force
          Copy-Item (Join-Path $tmp 'MH Analysis.exe') '.\MH Analysis.exe'
          Copy-Item (Join-Path $tmp 'MH-Analysis-Setup-V30.exe') '.\MH-Analysis-Setup-V30.exe'
          Copy-Item (Join-Path $tmp 'SHA256SUMS.txt') '.\SHA256SUMS.txt'
          Set-Content VERSION 'V.30' -Encoding ascii
          git add .
          git commit -m 'Publish verified MH Analysis V.30 installer'
          git push --force origin HEAD:v30-release
          if($LASTEXITCODE -ne 0){throw 'V30 release branch publish failed'}

      - name: Publish mandatory V30 updater manifest
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $exeSource=Join-Path $env:RUNNER_TEMP 'v30-release-files\MH Analysis.exe'
          $sha=(Get-FileHash $exeSource -Algorithm SHA256).Hash.ToLower()
          $tmp=Join-Path $env:RUNNER_TEMP 'v30-update-channel'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Copy-Item $exeSource (Join-Path $tmp 'MH Analysis.exe')
          $manifest=[ordered]@{version='V.30';mandatory=$true;download_url='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%20Analysis.exe';sha256=$sha;notes='MANDATORY V.30 - MT5 embed and EA pending recovery, WhatsApp group Signal Link, same-signal duplicate guard, Unicode/layout and requested credits.'} | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $tmp 'update.json'),$manifest,(New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Join-Path $tmp 'VERSION'),'V.30'+[Environment]::NewLine,(New-Object Text.UTF8Encoding($false)))
          git checkout --orphan __v30_update
          git rm -rf . 2>$null
          Get-ChildItem -Force | Where-Object {$_.Name -ne '.git'} | Remove-Item -Recurse -Force
          Copy-Item (Join-Path $tmp 'MH Analysis.exe') '.\MH Analysis.exe'
          Copy-Item (Join-Path $tmp 'update.json') '.\update.json'
          Copy-Item (Join-Path $tmp 'VERSION') '.\VERSION'
          git add .
          git commit -m 'Publish MH Analysis V.30 mandatory update'
          git push --force origin HEAD:mh-analysis-update-channel
          if($LASTEXITCODE -ne 0){throw 'V30 updater manifest publish failed'}
