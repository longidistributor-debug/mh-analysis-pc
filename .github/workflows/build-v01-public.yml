name: Build MH Analysis V.01

on:
  workflow_dispatch:
  push:
    branches: [records-mt5-local-build]
    paths:
      - 'VERSION'
      - 'desktop/version_v01_copy_guard_patch.py'
      - 'installer/MHAnalysis-V01.iss'
      - '.github/workflows/build-v01-public.yml'
      - 'vercel-auth/trigger-v01'

permissions:
  contents: write

concurrency:
  group: mh-analysis-v01-public
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Apply retained systems plus V.01 public version
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          function Patch([string]$p){ python $p; if($LASTEXITCODE -ne 0){ throw "Patch failed: $p" } }
          foreach($p in @(
            'desktop/branding_text_patch.py',
            'desktop/header_center_layout_patch.py',
            'desktop/records_feature_patch.py',
            'desktop/chart_reset_only_patch.py',
            'desktop/native_mt5_terminal_patch.py',
            'desktop/native_button_id_fix_patch.py',
            'desktop/ea_signal_reader_bridge_patch.py',
            'desktop/records_mt5_local_patch.py',
            'desktop/signal_duplicate_guard_patch.py',
            'desktop/license_auth_patch.py',
            'desktop/window_flicker_fix_patch.py',
            'desktop/license_login_focus_patch.py',
            'desktop/license_v803_patch.py',
            'desktop/license_v804_patch.py',
            'desktop/license_v806_runtime_fix_patch.py',
            'vercel-auth/license_v807_auth_loader_patch.py',
            'desktop/license_v808_device_identity_patch.py',
            'desktop/license_v809_preserve_original_ui_patch.py',
            'desktop/license_v810_single_frame_patch.py',
            'desktop/license_v811_chrome_frame_hard_fix_patch.py',
            'desktop/license_v812_password_responsive_fix_patch.py',
            'desktop/license_v813_single_exe_crop_patch.py',
            'desktop/license_v814_records_view_recovery_patch.py',
            'desktop/license_v815_records_inline_patch.py',
            'desktop/license_v816_branding_security_patch.py',
            'desktop/version_v01_copy_guard_patch.py'
          )){ Patch $p }
          if(Test-Path 'exness_bridge.go'){ Remove-Item 'exness_bridge.go' -Force }
          node --check web/app.js
          node --check web/records.js
          node --check web/auth.js

      - name: V.01 source guards
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $v=(Get-Content -Raw VERSION).Trim()
          if($v -ne 'V.01'){throw "VERSION is $v"}
          $index=Get-Content -Raw web/index.html
          $records=Get-Content -Raw web/records.html
          $app=Get-Content -Raw web/app.js
          $rjs=Get-Content -Raw web/records.js
          $auth=Get-Content -Raw web/auth.js
          $styles=Get-Content -Raw web/styles.css
          $rcss=Get-Content -Raw web/records.css
          $license=Get-Content -Raw license_auth.go
          $hostSrc=Get-Content -Raw chrome_host.go
          $installer=Get-Content -Raw installer/MHAnalysis-V01.iss
          $public='V.01 (CH Shaukat Ali)'
          if(-not $index.Contains('<div class="version">'+$public+'</div>')){throw 'Main public version missing'}
          if(-not $records.Contains('<div class="recordsVersion">'+$public+'</div>')){throw 'Records public version missing'}
          if(-not $license.Contains('const licAppVersion = "V.01"')){throw 'License metadata version missing'}
          foreach($s in @($app,$rjs,$auth)){if(-not $s.Contains('function mhCopyGuardV01')){throw 'Copy guard JS missing'}}
          foreach($s in @($styles,$rcss)){if(-not $s.Contains('MH_PUBLIC_VERSION_V01')){throw 'Copy guard CSS missing'}}
          foreach($m in @('MH_V816_BRANDING_SECURITY','chWDAExcludeFromCaptureV816')){if(-not $hostSrc.Contains($m)){throw "Capture/branding regression $m"}}
          if(-not $app.Contains('MH_RECORDS_INLINE_V815')){throw 'Records inline regression'}
          if(-not $app.Contains('MH_SAME_SIGNAL_GUARD_V799')){throw 'Duplicate guard regression'}
          foreach($m in @('AppId={{D44F9625-59E0-4F6A-9A0E-AECF7DF81B16}','DefaultDirName={localappdata}\Programs\MH Analysis','OutputBaseFilename=MH-Analysis-Setup-V.01','UsePreviousAppDir=yes')){if(-not $installer.Contains($m)){throw "Installer update identity regression $m"}}
          if(Test-Path 'exness_bridge.go'){throw 'legacy exness bridge must not compile'}
          Write-Host 'PASS V.01 source guards'

      - name: Same-device unlimited-login regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          //go:build windows
          package main
          import("os";"testing")
          func TestSameDeviceIdentityV01(t *testing.T){
            root:=t.TempDir();t.Setenv("LOCALAPPDATA",root+"\\local")
            licDeviceMem=nil
            d1,e:=licEnsureDevice();if e!=nil{t.Fatal(e)}
            for i:=0;i<100;i++{d,e:=licEnsureDevice();if e!=nil||d.ID!=d1.ID{t.Fatalf("same-device login %d changed: %v",i,e)}}
            for i:=0;i<10;i++{licDeviceMem=nil;_=os.Remove(licDevicePath());d,e:=licEnsureDevice();if e!=nil||d.ID!=d1.ID{t.Fatalf("restart %d changed: %v",i,e)}}
          }
          '@ | Set-Content -Encoding UTF8 license_v01_same_device_windows_test.go
          go test -run TestSameDeviceIdentityV01 -count=1 .
          if($LASTEXITCODE -ne 0){throw 'same-device V.01 regression failed'}
          Remove-Item license_v01_same_device_windows_test.go -Force

      - name: Build Windows x64 EXE
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w main.go chrome_host.go records.go records_mt5_local.go ea_signal_bridge.go license_auth.go license_support_external.go dpi_windows.go
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          sha256sum 'dist/MH Analysis.exe' | tee dist/SHA256SUMS.txt

      - name: Runtime responsive Records and EXIT regression
        shell: powershell
        run: desktop/runtime_v815_records_inline_test.ps1

      - name: Runtime branding and capture-exclusion regression
        shell: powershell
        run: desktop/runtime_v816_branding_security_test.ps1

      - name: Install Inno Setup
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not (Test-Path $iscc)){ choco install innosetup -y --no-progress }
          if(-not (Test-Path $iscc)){ throw 'Inno Setup compiler unavailable' }

      - name: Build V.01 in-place installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          New-Item -ItemType Directory -Force -Path dist-installer | Out-Null
          $src=(Resolve-Path 'dist\MH Analysis.exe').Path
          $out=(Resolve-Path 'dist-installer').Path
          & $iscc '/Qp' "/DMySourceExe=$src" "/DMyOutputDir=$out" 'installer\MHAnalysis-V01.iss'
          if($LASTEXITCODE -ne 0){throw "ISCC failed $LASTEXITCODE"}
          $setup=Join-Path $out 'MH-Analysis-Setup-V.01.exe'
          if(-not (Test-Path $setup)){throw 'V.01 installer output missing'}
          Get-FileHash $setup -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower()) *MH-Analysis-Setup-V.01.exe" } | Add-Content -Encoding ascii dist\SHA256SUMS.txt

      - name: Installer same-product reinstall smoke test
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $setup=(Resolve-Path 'dist-installer\MH-Analysis-Setup-V.01.exe').Path
          $testRoot=Join-Path $env:TEMP 'MHAnalysisV01UpgradeSmoke'
          Remove-Item $testRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $testRoot | Out-Null
          foreach($n in 1..2){
            $p=Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/MERGETASKS=!desktopicon',"/DIR=$testRoot" -Wait -PassThru
            if($p.ExitCode -ne 0){throw "Installer pass $n failed $($p.ExitCode)"}
            if(-not (Test-Path (Join-Path $testRoot 'MH Analysis.exe'))){throw "Installed EXE missing after pass $n"}
          }
          $unins=@(Get-ChildItem $testRoot -Filter 'unins*.exe')
          if($unins.Count -ne 1){throw "Expected one installed product/uninstaller, got $($unins.Count)"}
          $u=Start-Process -FilePath $unins[0].FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if($u.ExitCode -ne 0){throw "Uninstall failed $($u.ExitCode)"}
          Write-Host 'PASS same-product installer reinstall/update smoke test'

      - name: Package V.01
        shell: powershell
        run: |
          Compress-Archive -Path 'dist\MH Analysis.exe','dist\SHA256SUMS.txt','dist-installer\MH-Analysis-Setup-V.01.exe' -DestinationPath 'dist\MH-Analysis-V.01.zip' -Force

      - name: Upload verified V.01
        uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V.01
          path: |
            dist/MH Analysis.exe
            dist/MH-Analysis-V.01.zip
            dist/SHA256SUMS.txt
            dist-installer/MH-Analysis-Setup-V.01.exe
          if-no-files-found: error
          retention-days: 90

      - name: Publish verified V.01 EXE
        shell: bash
        run: |
          set -euo pipefail
          cp 'dist/MH Analysis.exe' "$RUNNER_TEMP/MH Analysis.exe"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan __v01_final
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP/MH Analysis.exe" './MH Analysis.exe'
          git add 'MH Analysis.exe'
          git commit -m 'MH Analysis V.01 verified build'
          git push --force origin HEAD:records-mt5-local-final-exe
          git push --force origin HEAD:final-current-v796
