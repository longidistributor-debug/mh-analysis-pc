name: Build FINAL V79.6 Exness Login Fix V4
on:
  push:
    branches: [exness-login-fix-v2]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Verify baseline
        shell: powershell
        run: |
          $app=Get-Content -Raw web/app.js
          $index=Get-Content -Raw web/index.html
          if($app -notmatch 'manual context selection must be API-silent'){throw 'manual no-API baseline missing'}
          if($index -notmatch 'v79\.6 AUTO CYCLE \(HAMMAD & SOMI\)'){throw 'branding missing'}
      - name: Apply centered header
        shell: powershell
        run: python desktop/header_center_layout_patch.py
      - name: Apply Records
        shell: powershell
        run: python desktop/records_feature_patch.py
      - name: Apply Exness
        shell: powershell
        run: python desktop/exness_feature_patch.py
      - name: Apply login typing/flicker fix
        shell: powershell
        run: python desktop/exness_login_focus_flicker_patch.py
      - name: Verify key source markers
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          node --check web/app.js
          $h=Get-Content -Raw chrome_host.go
          $b=Get-Content -Raw exness_bridge.go
          foreach($m in @('idRecords','idExness','chLaunchBrowserQuiet','HideWindow','chSetFocus','chEnsureExnessBrowser','ExnessProfile','https://my.exness.global/webtrading/')){if($h -notmatch [regex]::Escape($m)){throw "host marker missing: $m"}}
          foreach($m in @('exnessApplyLoginCleanup','sign in with google','forgot password')){if($b -notmatch [regex]::Escape($m)){throw "bridge marker missing: $m"}}
          if($b -match "clickText\(\[[^\]]*Place order"){throw 'unsafe Place order automation'}
          if($b -match "clickText\(\[[^\]]*Confirm"){throw 'unsafe Confirm automation'}
          Write-Host 'PASS source markers + no-submit guards'
      - name: Build Windows x64 EXE
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w main.go chrome_host.go records.go exness_bridge.go dpi_windows.go
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          sha256sum 'dist/MH Analysis.exe' | tee dist/SHA256SUMS.txt
          powershell -NoProfile -Command "Compress-Archive -Path 'dist/MH Analysis.exe','dist/SHA256SUMS.txt' -DestinationPath 'dist/MH-Analysis-V79.6-Exness-Login-Fix.zip' -Force"
      - name: Existing app startup/restart regression
        shell: powershell
        run: desktop/runtime_seamless_test.ps1
      - name: Verify Exness only launches after tab click
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:MH_SMOKE_TEST='1'
          Add-Type @'
          using System; using System.Text; using System.Runtime.InteropServices;
          public static class ExFixWin4 {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumChildWindows(IntPtr parent, EnumProc cb, IntPtr lp);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h,uint m,IntPtr w,IntPtr l);
          }
          '@
          $p=Start-Process -FilePath (Resolve-Path 'dist/MH Analysis.exe') -PassThru
          try {
            for($i=0;$i -lt 60;$i++){$p.Refresh();if($p.MainWindowHandle -ne 0){break};Start-Sleep -Milliseconds 250}
            [IntPtr]$h=$p.MainWindowHandle;if($h -eq [IntPtr]::Zero){throw 'host missing'}
            Start-Sleep -Seconds 3
            $pre=Get-CimInstance Win32_Process -ErrorAction SilentlyContinue|Where-Object{($_.Name -eq 'chrome.exe' -or $_.Name -eq 'msedge.exe') -and $_.CommandLine -match 'ExnessProfile'}|Select-Object -First 1
            if($pre){throw 'Exness launched before click'}
            $script:buttons=@()
            [ExFixWin4]::EnumChildWindows($h,{param($w,$l)$c=New-Object Text.StringBuilder 80;[void][ExFixWin4]::GetClassName($w,$c,80);if($c.ToString() -eq 'Button'){$t=New-Object Text.StringBuilder 120;[void][ExFixWin4]::GetWindowText($w,$t,120);$script:buttons += $t.ToString()};return $true},[IntPtr]::Zero)|Out-Null
            foreach($n in @('MH Analysis','WhatsApp','Records','Exness')){if($script:buttons -notcontains $n){throw "button missing: $n"}}
            [ExFixWin4]::PostMessage($h,0x0111,[IntPtr]1004,[IntPtr]::Zero)|Out-Null
            $bp=$null
            for($i=0;$i -lt 80;$i++){$bp=Get-CimInstance Win32_Process -ErrorAction SilentlyContinue|Where-Object{($_.Name -eq 'chrome.exe' -or $_.Name -eq 'msedge.exe') -and $_.CommandLine -match '--app=https://my\.exness\.global/webtrading/' -and $_.CommandLine -match 'ExnessProfile'}|Select-Object -First 1;if($bp){break};Start-Sleep -Milliseconds 250}
            if(-not $bp){throw 'Exness did not launch after click'}
            Write-Host 'PASS lazy Exness persistent-profile launch'
          } finally {
            try{$ls=Get-NetTCPConnection -State Listen -OwningProcess $p.Id -ErrorAction SilentlyContinue|Where-Object{$_.LocalAddress -eq '127.0.0.1'}|Select-Object -First 1;if($ls){Invoke-WebRequest "http://127.0.0.1:$($ls.LocalPort)/api/shutdown" -UseBasicParsing -TimeoutSec 2|Out-Null}}catch{}
            Start-Sleep -Seconds 2
            if(!$p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
            Remove-Item Env:MH_SMOKE_TEST -ErrorAction SilentlyContinue
          }
      - name: Verify Records and DPI retained
        shell: powershell
        run: |
          if((Get-Content -Raw web/records.html) -notmatch 'ACCURACY CHECK'){throw 'Records regression'}
          if((Get-Content -Raw dpi_windows.go) -notmatch 'SetProcessDpiAwarenessContext'){throw 'DPI regression'}
          Write-Host 'PASS Records + DPI retained'
      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V79.6-Exness-Login-Fix-FINAL-V4
          path: |
            dist/MH Analysis.exe
            dist/MH-Analysis-V79.6-Exness-Login-Fix.zip
            dist/SHA256SUMS.txt
          retention-days: 90
      - name: Publish verified EXE-only final branch
        shell: bash
        run: |
          set -euo pipefail
          cp 'dist/MH Analysis.exe' "$RUNNER_TEMP/MH Analysis.exe"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan __exness_fix_v4
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP/MH Analysis.exe" './MH Analysis.exe'
          git add 'MH Analysis.exe'
          git commit -m 'MH Analysis V79.6 Exness login typing and flicker fix final EXE only'
          git push --force origin HEAD:final-current-v796
          git push origin --delete exness-login-fix-v2
