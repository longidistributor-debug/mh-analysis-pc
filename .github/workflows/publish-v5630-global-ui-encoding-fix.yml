name: Publish V5630 Global UI Encoding Fix

on:
  push:
    branches: [v56.30-release]
    paths:
      - '.github/workflows/publish-v5630-global-ui-encoding-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v56.30-release
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repair all web UI mojibake and bump V.56.30
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check --no-cache-dir ftfy==6.3.1
          @'
          from pathlib import Path
          from ftfy import fix_text

          web = Path('web')
          exts = {'.html', '.js', '.css'}
          changed = []
          for p in web.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in exts:
                  continue
              old = p.read_text(encoding='utf-8')
              new = old
              for _ in range(6):
                  fixed = fix_text(new)
                  if fixed == new:
                      break
                  new = fixed
              if new != old:
                  with p.open('w', encoding='utf-8', newline='\n') as f:
                      f.write(new)
                  changed.append(str(p))

          replacements = {
              Path('updater.go'): ('const mhPublicVersionV001 = "V.56.29"', 'const mhPublicVersionV001 = "V.56.30"'),
              Path('license_auth.go'): ('const licAppVersion = "V.56.29"', 'const licAppVersion = "V.56.30"'),
              Path('webview2_host.go'): ('Version: V.56.29', 'Version: V.56.30'),
              Path('web/index.html'): ('id="mhUpdateVersionV001">V.56.29<', 'id="mhUpdateVersionV001">V.56.30<'),
          }
          for p, (old, new) in replacements.items():
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'version anchor missing: {p} :: {old}')
              text = text.replace(old, new)
              with p.open('w', encoding='utf-8', newline='\n') as f:
                  f.write(text)

          Path('VERSION').write_text('V.56.30\n', encoding='ascii')
          print('UI files repaired:', len(changed))
          for p in changed:
              print(' -', p)
          '@ | Set-Content -Encoding utf8 .github\v5630_repair.py
          python .github\v5630_repair.py

      - name: Validate clean UI source and preserve trading logic
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          from pathlib import Path
          suspects = ('Ã', 'Â', 'â', 'ð', '�')
          bad = []
          for p in Path('web').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.html','.js','.css'}:
                  continue
              text = p.read_text(encoding='utf-8')
              for marker in suspects:
                  if marker in text:
                      for n, line in enumerate(text.splitlines(), 1):
                          if marker in line:
                              bad.append(f'{p}:{n}: {marker}: {line[:180]}')
                              if len(bad) >= 40:
                                  break
                  if len(bad) >= 40:
                      break
              if len(bad) >= 40:
                  break
          if bad:
              print('\n'.join(bad))
              raise SystemExit('mojibake markers remain in web UI source')
          print('No mojibake markers remain in web HTML/JS/CSS')
          '@ | Set-Content -Encoding utf8 .github\v5630_scan.py
          python .github\v5630_scan.py

          Get-ChildItem web -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if($LASTEXITCODE -ne 0){ throw "JavaScript syntax failed: $($_.FullName)" }
          }
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'Go tests failed'}
          if((Get-Content VERSION -Raw).Trim() -ne 'V.56.30'){throw 'VERSION mismatch'}

          $app=Get-Content -Raw -Encoding utf8 web\app.js
          foreach($m in @(
            'function cleanWhatsAppTextV5629',
            '*Signal:* NO CLEAR EDGE',
            '*Entry:* N/A',
            'TP2_BE_PROGRESS_V5625=.40',
            'TP2_BE_LOCK_USD_V5625=2.50',
            'TP1_LOCK_OFFSET_USD_V5625=6.50',
            'bestSetupV5625',
            'type:sig.direction'
          )){if(-not $app.Contains($m)){throw "required safeguard missing: $m"}}
          foreach($m in @('if(n>=83)return 0.05;','if(n>=73)return 0.04;','if(n>=66)return 0.03;','if(!lotSizeEnabled)return 0.02;')){if(-not $app.Contains($m)){throw "lot map changed: $m"}}

          git diff --exit-code HEAD -- ea_modes_v558.go ea_signal_bridge.go records_mt5_local.go
          if($LASTEXITCODE -ne 0){throw 'EA/trading backend files changed unexpectedly'}

          $index=Get-Content -Raw -Encoding utf8 web\index.html
          if(-not $index.Contains('<meta charset="utf-8"')){throw 'UTF-8 meta tag missing'}
          if(-not $index.Contains('id="mhUpdateVersionV001">V.56.30<')){throw 'V.56.30 UI version missing'}

      - name: Commit V.56.30 source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/v5630_repair.py .github/v5630_scan.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web VERSION updater.go license_auth.go webview2_host.go
          if ! git diff --cached --quiet; then
            git commit -m 'V.56.30 repair global UI text encoding'
            git push origin HEAD:v56.30-release
          fi

      - name: Build V.56.30 EXE and installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force dist,dist-installer|Out-Null
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          if($LASTEXITCODE -ne 0 -or -not(Test-Path 'dist/MH Analysis.exe')){throw 'Windows EXE build failed'}
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not(Test-Path $iscc)){choco install innosetup -y --no-progress; if($LASTEXITCODE -ne 0){throw 'Inno Setup install failed'}}
          $src=(Resolve-Path 'dist\MH Analysis.exe').Path
          $out=(Resolve-Path dist-installer).Path
          & $iscc '/Qp' "/DMySourceExe=$src" "/DMyOutputDir=$out" '/DMyAppVersion=V.56.30' '/DMyOutputBaseFilename=MH-Analysis-Setup-V.56.30' 'installer\MHAnalysis-V01.iss'
          if($LASTEXITCODE -ne 0){throw 'installer build failed'}
          $installer='dist-installer\MH-Analysis-Setup-V.56.30.exe'
          if(-not(Test-Path $installer)){throw 'installer missing'}
          $sha=(Get-FileHash 'dist\MH Analysis.exe' -Algorithm SHA256).Hash.ToLower()
          "$sha  MH Analysis.exe"|Set-Content -Encoding ascii dist\SHA256SUMS.txt
          'V.56.30'|Set-Content -Encoding ascii dist\VERSION
          $notes='V.56.30 repairs global MH Analysis UI text encoding. Static startup placeholders and dynamic labels are clean UTF-8, removing mojibake flashes and broken characters. V.56.29 WhatsApp fix and all prior EA/trading safeguards are preserved.'
          $m=[ordered]@{version='V.56.30';mandatory=$true;download_url='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%20Analysis.exe';sha256=$sha;notes=$notes}|ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD 'dist\update.json'),$m,(New-Object Text.UTF8Encoding($false)))
          Compress-Archive -Path 'dist\MH Analysis.exe','dist\SHA256SUMS.txt','dist\update.json','dist\VERSION',$installer -DestinationPath 'dist\MH-Analysis-V.56.30.zip' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V.56.30
          path: |
            dist/MH Analysis.exe
            dist/MH-Analysis-V.56.30.zip
            dist/SHA256SUMS.txt
            dist/update.json
            dist/VERSION
            dist-installer/MH-Analysis-Setup-V.56.30.exe
          if-no-files-found: error

      - name: Publish V.56.30 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Continue'
          gh release delete v56.30 --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE=0
          $ErrorActionPreference='Stop'
          gh release create v56.30 'dist\MH Analysis.exe' 'dist\MH-Analysis-V.56.30.zip' 'dist\SHA256SUMS.txt' 'dist-installer\MH-Analysis-Setup-V.56.30.exe' --target v56.30-release --title 'MH Analysis V.56.30' --notes 'Global UI encoding cleanup: removes broken/mojibake characters from startup placeholders and dynamic views. WhatsApp and EA/trading safeguards preserved.'
          if($LASTEXITCODE -ne 0){throw 'release publish failed'}

      - name: Publish production updater through clean worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin mh-analysis-update-channel
          WT="$RUNNER_TEMP/mh-update-v5630"
          rm -rf "$WT"
          git worktree add --force -B mh-analysis-update-channel "$WT" origin/mh-analysis-update-channel
          cp 'dist/MH Analysis.exe' "$WT/MH Analysis.exe"
          cp dist/update.json "$WT/update.json"
          cp dist/VERSION "$WT/VERSION"
          cp dist/SHA256SUMS.txt "$WT/SHA256SUMS.txt"
          cp 'dist-installer/MH-Analysis-Setup-V.56.30.exe' "$WT/MH-Analysis-Setup-V.56.30.exe"
          git -C "$WT" add 'MH Analysis.exe' update.json VERSION SHA256SUMS.txt 'MH-Analysis-Setup-V.56.30.exe'
          git -C "$WT" commit -m 'Publish MH Analysis V.56.30' || true
          git -C "$WT" push origin mh-analysis-update-channel

      - name: Verify live V.56.30 updater and binary
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Start-Sleep -Seconds 4
          $cb=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $base='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/'
          $live=(Invoke-WebRequest -UseBasicParsing ($base+'update.json?cb='+$cb)).Content|ConvertFrom-Json
          $local=(Get-Content -Raw dist\update.json)|ConvertFrom-Json
          if($live.version -ne 'V.56.30'){throw "live version mismatch: $($live.version)"}
          if($live.mandatory -ne $true){throw 'mandatory flag false'}
          if($live.sha256 -ne $local.sha256){throw 'manifest SHA mismatch'}
          $tmp=Join-Path $env:RUNNER_TEMP 'MH-V5630-live.exe'
          Invoke-WebRequest -UseBasicParsing ($live.download_url+'?cb='+$cb) -OutFile $tmp
          $sha=(Get-FileHash $tmp -Algorithm SHA256).Hash.ToLower()
          if($sha -ne $live.sha256.ToLower()){throw 'live EXE SHA mismatch'}
          Write-Host 'LIVE V.56.30 updater verification PASSED'
