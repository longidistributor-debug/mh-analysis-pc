name: Build V45 Final
on:
  push:
    branches: [v45-three-fixes-only]
    paths: ['.github/workflows/build-v45-final.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Verify and build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          gofmt -w ea_signal_bridge.go webview2_host.go mt5_embed_v36.go
          go test ./...
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:GOOS='windows'; $env:GOARCH='amd64'; $env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis V45.exe' .
      - name: Upload V45 executable
        uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V45
          path: dist/MH Analysis V45.exe
