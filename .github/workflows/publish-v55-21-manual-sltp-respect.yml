name: Publish MH Analysis V.55.21 Manual SL TP Respect

on:
  push:
    branches: [records-mt5-local-build]
    paths: ['vercel-auth/trigger-v5521']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - uses: actions/setup-go@v5
        with: {go-version: '1.23.2', cache: false}

      - name: Apply V.55.21 release marker only
        shell: powershell
        run: python scripts/v5521_manual_sltp_release.py

      - name: Verify application release only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if((Get-Content -Raw VERSION).Trim() -ne 'V.55.21'){throw 'VERSION mismatch'}
          node --check web/app.js
          if($LASTEXITCODE -ne 0){throw 'node syntax check failed'}
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'tests failed'}

      - name: Commit isolated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION updater.go license_auth.go web/index.html
          git commit -m 'V.55.21 release for EA manual SL TP respect' || true
          git pull --rebase origin records-mt5-local-build
          git push origin HEAD:records-mt5-local-build

      - name: Build EXE and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          sha256sum 'dist/MH Analysis.exe' | tee dist/SHA256SUMS.txt
          HASH=$(awk '{print $1}' dist/SHA256SUMS.txt)
          printf 'V.55.21\n' > dist/VERSION
          printf '{"version":"V.55.21","mandatory":true,"download_url":"https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%%20Analysis.exe","sha256":"%s","notes":"V.55.21 pairs MH ANALYSIS with EA v1.30 manual SL/TP respect behavior. Auto pending trades keep TP1 partial-close and BE+2 protection active. A stronger manually moved SL is never moved backwards, and a live manually moved TP is preserved instead of being reset to the original TP2 at TP1. V.55.20 untouched-pending and V.55.19 triggered-signal retirement remain unchanged."}\n' "$HASH" > dist/update.json

      - name: Install Inno Setup
        shell: powershell
        run: |
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not(Test-Path $iscc)){choco install innosetup -y --no-progress}
          if(-not(Test-Path $iscc)){throw 'ISCC unavailable'}

      - name: Build installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          New-Item -ItemType Directory -Force dist-installer|Out-Null
          $src=(Resolve-Path 'dist\MH Analysis.exe').Path
          $out=(Resolve-Path dist-installer).Path
          & $iscc '/Qp' "/DMySourceExe=$src" "/DMyOutputDir=$out" '/DMyAppVersion=V.55.21' '/DMyOutputBaseFilename=MH-Analysis-Setup-V.55.21' 'installer\MHAnalysis-V01.iss'
          if($LASTEXITCODE -ne 0){throw 'ISCC failed'}

      - name: Package
        shell: powershell
        run: Compress-Archive -Path 'dist\MH Analysis.exe','dist\SHA256SUMS.txt','dist\update.json','dist\VERSION','dist-installer\MH-Analysis-Setup-V.55.21.exe' -DestinationPath 'dist\MH-Analysis-V.55.21.zip' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V.55.21
          path: |
            dist/MH Analysis.exe
            dist/MH-Analysis-V.55.21.zip
            dist/SHA256SUMS.txt
            dist/update.json
            dist/VERSION
            dist-installer/MH-Analysis-Setup-V.55.21.exe
          if-no-files-found: error

      - name: Publish mandatory updater channel
        shell: bash
        run: |
          set -euo pipefail
          cp 'dist/MH Analysis.exe' "$RUNNER_TEMP/MH Analysis.exe"
          cp dist/update.json "$RUNNER_TEMP/update.json"
          cp dist/VERSION "$RUNNER_TEMP/VERSION"
          cp dist/SHA256SUMS.txt "$RUNNER_TEMP/SHA256SUMS.txt"
          cp 'dist-installer/MH-Analysis-Setup-V.55.21.exe' "$RUNNER_TEMP/MH-Analysis-Setup-V.55.21.exe"
          git checkout --orphan __v5521
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP/MH Analysis.exe" './MH Analysis.exe'
          cp "$RUNNER_TEMP/update.json" update.json
          cp "$RUNNER_TEMP/VERSION" VERSION
          cp "$RUNNER_TEMP/SHA256SUMS.txt" SHA256SUMS.txt
          cp "$RUNNER_TEMP/MH-Analysis-Setup-V.55.21.exe" './MH-Analysis-Setup-V.55.21.exe'
          git add .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'MH Analysis V.55.21 manual SL TP respect release'
          git push --force origin HEAD:mh-analysis-update-channel
