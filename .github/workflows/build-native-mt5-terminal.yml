name: Legacy V80.4 Build - Retired

# This workflow used to run on every source push and force-push the obsolete
# V80.4 EXE to final-current-v796. That branch is now the V.01 compatibility
# mirror for the mandatory updater, so automatic legacy publishing would break
# update.json and could leave installed clients stuck on the update gate.
#
# Keep this file only as historical/manual documentation. The active release
# pipeline is build-v002-mandatory-updater.yml and later versioned updater builds.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy workflow retired
        run: |
          echo "V80.4 automatic publishing is retired."
          echo "Use the current versioned MH Analysis updater workflow instead."
