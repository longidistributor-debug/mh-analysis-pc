name: Build V80.2 Secure Login UX

on:
  workflow_dispatch:
  push:
    branches: [records-mt5-local-build]
    paths-ignore:
      - 'license-server/**'
      - 'vercel-auth/**'

permissions:
  contents: write

concurrency:
  group: mh-analysis-v802-login-ux
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Apply retained app patches, live secure login, keyboard focus, local MT5 Records, duplicate guard, and seamless window fix
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          function Patch([string]$p){ python $p; if($LASTEXITCODE -ne 0){ throw "Patch failed: $p" } }
          foreach($p in @(
            'desktop/branding_text_patch.py',
            'desktop/header_center_layout_patch.py',
            'desktop/records_feature_patch.py',
            'desktop/chart_reset_only_patch.py',
            'desktop/native_mt5_terminal_patch.py',
            'desktop/native_button_id_fix_patch.py',
            'desktop/ea_signal_reader_bridge_patch.py',
            'desktop/records_mt5_local_patch.py',
            'desktop/signal_duplicate_guard_patch.py',
            'desktop/license_auth_patch.py',
            'desktop/window_flicker_fix_patch.py',
            'desktop/license_login_focus_patch.py'
          )){ Patch $p }
          if(Test-Path 'exness_bridge.go'){ Remove-Item 'exness_bridge.go' -Force }
          node --check web/app.js
          if($LASTEXITCODE -ne 0){ throw 'app.js syntax check failed' }
          node --check web/records.js
          if($LASTEXITCODE -ne 0){ throw 'records.js syntax check failed' }
          node --check web/auth.js
          if($LASTEXITCODE -ne 0){ throw 'auth.js syntax check failed' }

      - name: Source guards
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $hostSrc=Get-Content -Raw chrome_host.go
          $main=Get-Content -Raw main.go
          $app=Get-Content -Raw web/app.js
          $html=Get-Content -Raw web/index.html
          $recordsHtml=Get-Content -Raw web/records.html
          $recordsJs=Get-Content -Raw web/records.js
          $recordsLayout=Get-Content -Raw web/records-layout-fix.css
          $eaBridge=Get-Content -Raw ea_signal_bridge.go
          $localRecords=Get-Content -Raw records_mt5_local.go
          $license=Get-Content -Raw license_auth.go
          $authJs=Get-Content -Raw web/auth.js
          $authCss=Get-Content -Raw web/auth.css
          foreach($m in @('MH_NATIVE_MT5_TERMINAL_V796','MT5 System','chEnsureMT5Terminal','terminal64.exe')){
            if(-not $hostSrc.Contains($m)){ throw "missing native MT5 marker $m" }
          }
          foreach($m in @('MH_EA_SIGNAL_READER_BRIDGE_V796','registerEASignalBridgeRoutes','/api/mt5/ea/send','/api/mt5/ea/status','sendManualNewAnalyzeSignalToEAV796','signal.txt','status.txt')){
            if(-not ($eaBridge.Contains($m) -or $main.Contains($m) -or $app.Contains($m))){ throw "missing EA bridge marker $m" }
          }
          foreach($m in @('MH_RECORDS_MT5_LOCAL_V797','registerRecordsV2Routes','/api/records-v2','trade_events.jsonl','MANUAL_CLOSE_POSITIVE','MANUAL_CLOSE_NEGATIVE','external_market_api_calls')){
            if(-not ($localRecords.Contains($m) -or $main.Contains($m) -or $recordsJs.Contains($m))){ throw "missing local Records marker $m" }
          }
          foreach($m in @('MH_SAME_SIGNAL_GUARD_V799','/api/records-v2/duplicate','sameSignalTextV799','checkSameSignalV799','compactActiveSameSignalDuplicates','unique NEW ANALYZE handoff')){
            if(-not ($localRecords.Contains($m) -or $app.Contains($m))){ throw "same-signal guard missing $m" }
          }
          foreach($m in @('MH_SECURE_LICENSE_V801','registerLicenseRoutes','licenseGate','CryptProtectData','ed25519','https://mh-analysis.vercel.app','auth/challenge','challenge_id','public_key','auth/verify','licAppVersion = "80.2"')){
            if(-not ($license.Contains($m) -or $main.Contains($m))){ throw "live secure license client missing $m" }
          }
          if(-not $hostSrc.Contains('MH_LICENSE_NATIVE_GATE_V801')){ throw 'native MT5/Records/WhatsApp license gate missing' }
          if(-not $hostSrc.Contains('MH_LICENSE_INPUT_FOCUS_V802')){ throw 'native Chromium keyboard focus repair missing' }
          if($license.Contains('mh-analysis-license-longidistributor-8873.vercel.app')){ throw 'obsolete license server URL remains' }
          if($license.Contains('auth/refresh')){ throw 'obsolete refresh protocol remains' }
          foreach($m in @('/auth.css','/auth.js')){
            if(-not $html.Contains($m)){ throw "main UI login asset missing $m" }
            if(-not $recordsHtml.Contains($m)){ throw "Records login asset missing $m" }
          }
          foreach($m in @('MH_SECURE_LICENSE_V802','mhLicenseBrandMark','/mh-logo.png','Muhammad Hammad Shaukat','Admin Layout Credit: Ruhi Mughal','Get Signals Credit: Somi','focusField')){
            if(-not $authJs.Contains($m)){ throw "V80.2 login UI missing $m" }
          }
          foreach($m in @('MH_SECURE_LICENSE_V802','pointer-events:auto','caret-color:#ffd500','mhLicenseCredits')){
            if(-not $authCss.Contains($m)){ throw "V80.2 login CSS missing $m" }
          }
          foreach($m in @('ensureMHSignalIdV796','signal_id:ensureMHSignalIdV796(d)','/api/records-v2/capture')){
            if(-not $app.Contains($m)){ throw "signal-to-record link missing $m" }
          }
          foreach($m in @('FROM','TO','RESET RECORDS','SYNC MT5','records-layout-fix.css')){
            if(-not $recordsHtml.Contains($m)){ throw "Records UI missing $m" }
          }
          foreach($m in @('MH_WINDOW_FLICKER_FIX_V798','chEXToolWindow','chRevealHostOnce','chPrepareBrowserWindowsForShutdown','chSetEmbeddedVisible','fast off-screen attach')){
            if(-not $hostSrc.Contains($m)){ throw "seamless host fix missing $m" }
          }
          foreach($m in @('MH_RECORDS_LAYOUT_FIX_V798','overflow-x:auto','flex:1 1 auto')){
            if(-not $recordsLayout.Contains($m)){ throw "Records layout fix missing $m" }
          }
          if($recordsJs.Contains('/api/records/accuracy') -or $recordsHtml.Contains('ACCURACY CHECK')){ throw 'old market-history Accuracy Check still active in Records UI' }
          if($html.Contains('EA • SEND SIGNAL') -or $html.Contains('id="sendToEA"')){ throw 'extra EA button must not exist' }
          if($app.Contains("if(d.signal&&!fromAuto)void sendManualNewAnalyzeSignalToEAV796(d)")){ throw 'old manual-only EA handoff still active' }
          if(-not $app.Contains("if(d.signal&&!d._duplicateSignal)void sendManualNewAnalyzeSignalToEAV796(d)")){ throw 'unique NEW ANALYZE EA handoff missing' }
          foreach($bad in @('exness.com','ExnessProfile','registerExnessRoutes','/api/exness/','my.exness.global')){
            if($hostSrc.Contains($bad) -or $main.Contains($bad) -or $app.Contains($bad)){ throw "broker web dependency remains: $bad" }
          }
          if(Test-Path 'exness_bridge.go'){ throw 'exness_bridge.go must not be compiled' }
          foreach($m in @('MH_CHART_RESET_ONLY_V796','contextGeneration','lwChart.remove()')){
            if(-not $app.Contains($m)){ throw "chart regression marker missing $m" }
          }
          if(-not $app.Contains('manual context selection must be API-silent')){ throw 'manual API-silent rule missing' }
          Write-Host 'PASS V80.2 secure login focus + branded credits + V79.9 signal guard + seamless local MT5 Records source guards'

      - name: Build Windows x64 EXE
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w main.go chrome_host.go records.go records_mt5_local.go ea_signal_bridge.go license_auth.go dpi_windows.go
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          sha256sum 'dist/MH Analysis.exe' | tee dist/SHA256SUMS.txt
          powershell -NoProfile -Command "Compress-Archive -Path 'dist/MH Analysis.exe','dist/SHA256SUMS.txt' -DestinationPath 'dist/MH-Analysis-V80.2-Secure-Login-UX.zip' -Force"

      - name: Existing app startup restart regression
        shell: powershell
        run: desktop/runtime_seamless_test.ps1

      - name: Verify secure login UX, Records, duplicate guard, seamless host, and DPI retained
        shell: powershell
        run: |
          $records=Get-Content -Raw web/records.html
          $layout=Get-Content -Raw web/records-layout-fix.css
          $hostSrc=Get-Content -Raw chrome_host.go
          $app=Get-Content -Raw web/app.js
          $localRecords=Get-Content -Raw records_mt5_local.go
          $license=Get-Content -Raw license_auth.go
          $authJs=Get-Content -Raw web/auth.js
          if($license -notmatch 'MH_SECURE_LICENSE_V801'){ throw 'secure login regression' }
          if($license -notmatch 'mh-analysis.vercel.app'){ throw 'live license URL regression' }
          if($license -notmatch 'licAppVersion = "80.2"'){ throw 'desktop license version regression' }
          if($hostSrc -notmatch 'MH_LICENSE_NATIVE_GATE_V801'){ throw 'native license gate regression' }
          if($hostSrc -notmatch 'MH_LICENSE_INPUT_FOCUS_V802'){ throw 'native login keyboard focus regression' }
          if($authJs -notmatch 'MH_SECURE_LICENSE_V802'){ throw 'login UX regression' }
          if($authJs -notmatch 'Admin Layout Credit: Ruhi Mughal'){ throw 'login footer credit regression' }
          if($authJs -notmatch 'Get Signals Credit: Somi'){ throw 'login footer signal credit regression' }
          if($records -notmatch 'LOCAL MT5 TRADE LIFECYCLE'){ throw 'local MT5 Records regression' }
          if($records -notmatch 'RESET RECORDS'){ throw 'Records reset regression' }
          if($layout -notmatch 'MH_RECORDS_LAYOUT_FIX_V798'){ throw 'Day Record layout regression' }
          if($hostSrc -notmatch 'MH_WINDOW_FLICKER_FIX_V798'){ throw 'window flicker regression' }
          if($app -notmatch 'MH_SAME_SIGNAL_GUARD_V799'){ throw 'same signal frontend regression' }
          if($localRecords -notmatch 'MH_SAME_SIGNAL_GUARD_V799'){ throw 'same signal backend regression' }
          if((Get-Content -Raw dpi_windows.go) -notmatch 'SetProcessDpiAwarenessContext'){ throw 'DPI regression' }
          Write-Host 'PASS V80.2 secure login UX + duplicate guard + Records + seamless host + DPI retained'

      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V80.2-Secure-Login-UX
          path: |
            dist/MH Analysis.exe
            dist/MH-Analysis-V80.2-Secure-Login-UX.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish V80.2 EXE-only branches
        shell: bash
        run: |
          set -euo pipefail
          cp 'dist/MH Analysis.exe' "$RUNNER_TEMP/MH Analysis.exe"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan __records_v802_final
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP/MH Analysis.exe" './MH Analysis.exe'
          git add 'MH Analysis.exe'
          git commit -m 'MH Analysis V80.2 secure login UX build'
          git push --force origin HEAD:records-mt5-local-final-exe
          git push --force origin HEAD:final-current-v796
          echo 'PASS EXE-only branches updated with V80.2 verified EXE'
