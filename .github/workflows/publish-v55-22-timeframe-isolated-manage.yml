name: Publish MH Analysis V.55.22 Timeframe Isolated MT5 Manage

on:
  push:
    branches: [records-mt5-local-build]
    paths: ['vercel-auth/trigger-v5522']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - uses: actions/setup-go@v5
        with: {go-version: '1.23.2', cache: false}

      - name: Apply only V.55.22 timeframe-isolated manage fix
        shell: powershell
        run: python scripts/v5522_timeframe_isolated_mt5_manage.py

      - name: Verify timeframe-isolated manage bridge
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if((Get-Content -Raw VERSION).Trim() -ne 'V.55.22'){throw 'VERSION mismatch'}
          $a=Get-Content -Raw web/app.js
          $b=Get-Content -Raw ea_signal_bridge.go
          foreach($m in @('symbol,timeframe,direction:managed.direction','manage_id:`MHM${Date.now()}_${symbol}_${timeframe}')){if(-not $a.Contains($m)){throw "missing app marker: $m"}}
          foreach($m in @('Timeframe string  `json:"timeframe"`','PARTIAL_TP|TIMEFRAME','timeframe is required for safe EA management','strconv.FormatBool(q.PartialTP),q.Timeframe')){if(-not $b.Contains($m)){throw "missing bridge marker: $m"}}
          node --check web/app.js
          if($LASTEXITCODE -ne 0){throw 'node syntax check failed'}
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'tests failed'}

      - name: Commit isolated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app.js ea_signal_bridge.go VERSION updater.go license_auth.go web/index.html
          git commit -m 'V.55.22 isolate MT5 management by analysis timeframe' || true
          git pull --rebase origin records-mt5-local-build
          git push origin HEAD:records-mt5-local-build

      - name: Build EXE and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          sha256sum 'dist/MH Analysis.exe' | tee dist/SHA256SUMS.txt
          HASH=$(awk '{print $1}' dist/SHA256SUMS.txt)
          printf 'V.55.22\n' > dist/VERSION
          printf '{"version":"V.55.22","mandatory":true,"download_url":"https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%%20Analysis.exe","sha256":"%s","notes":"V.55.22 isolates MT5 active-trade management by the originating analysis timeframe. 1m, 5m, 15m, 20m, 30m and 1h same-direction trades no longer share RE-EVALUATE SL/TP/TP1/TP2 management. The bridge now sends timeframe with each manage command so EA v1.31 can target only the matching position/order. Manual SL/TP respect, TP1 partial close and BE+2 behavior remain unchanged."}\n' "$HASH" > dist/update.json

      - name: Install Inno Setup
        shell: powershell
        run: |
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not(Test-Path $iscc)){choco install innosetup -y --no-progress}
          if(-not(Test-Path $iscc)){throw 'ISCC unavailable'}

      - name: Build installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          New-Item -ItemType Directory -Force dist-installer|Out-Null
          $src=(Resolve-Path 'dist\MH Analysis.exe').Path
          $out=(Resolve-Path dist-installer).Path
          & $iscc '/Qp' "/DMySourceExe=$src" "/DMyOutputDir=$out" '/DMyAppVersion=V.55.22' '/DMyOutputBaseFilename=MH-Analysis-Setup-V.55.22' 'installer\MHAnalysis-V01.iss'
          if($LASTEXITCODE -ne 0){throw 'ISCC failed'}

      - name: Package
        shell: powershell
        run: Compress-Archive -Path 'dist\MH Analysis.exe','dist\SHA256SUMS.txt','dist\update.json','dist\VERSION','dist-installer\MH-Analysis-Setup-V.55.22.exe' -DestinationPath 'dist\MH-Analysis-V.55.22.zip' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V.55.22
          path: |
            dist/MH Analysis.exe
            dist/MH-Analysis-V.55.22.zip
            dist/SHA256SUMS.txt
            dist/update.json
            dist/VERSION
            dist-installer/MH-Analysis-Setup-V.55.22.exe
          if-no-files-found: error

      - name: Publish mandatory updater channel
        shell: bash
        run: |
          set -euo pipefail
          cp 'dist/MH Analysis.exe' "$RUNNER_TEMP/MH Analysis.exe"
          cp dist/update.json "$RUNNER_TEMP/update.json"
          cp dist/VERSION "$RUNNER_TEMP/VERSION"
          cp dist/SHA256SUMS.txt "$RUNNER_TEMP/SHA256SUMS.txt"
          cp 'dist-installer/MH-Analysis-Setup-V.55.22.exe' "$RUNNER_TEMP/MH-Analysis-Setup-V.55.22.exe"
          git checkout --orphan __v5522
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP/MH Analysis.exe" './MH Analysis.exe'
          cp "$RUNNER_TEMP/update.json" update.json
          cp "$RUNNER_TEMP/VERSION" VERSION
          cp "$RUNNER_TEMP/SHA256SUMS.txt" SHA256SUMS.txt
          cp "$RUNNER_TEMP/MH-Analysis-Setup-V.55.22.exe" './MH-Analysis-Setup-V.55.22.exe'
          git add .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'MH Analysis V.55.22 timeframe-isolated MT5 management release'
          git push --force origin HEAD:mh-analysis-update-channel
