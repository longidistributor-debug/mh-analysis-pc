name: Publish V5624 Release

on:
  push:
    branches: [v56.3-release]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v56.3-release
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Validate V.56.24 source and trading runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem -Path . -Filter *.go -File | ForEach-Object { gofmt -w $_.FullName }
          foreach($js in @('web/app.js','web/runtime-fixes.js','web/auth.js','web/v31.js','web/v558-fast.js','web/v560-mode-guard.js','web/update-v001.js','web/ea-reversal-guard.js')) { node --check $js; if($LASTEXITCODE -ne 0){throw "JavaScript validation failed: $js"} }
          if((Get-Content VERSION -Raw).Trim() -ne 'V.56.24'){throw 'VERSION mismatch'}
          if(-not (Get-Content -Raw license_auth.go).Contains('const licAppVersion = "V.56.24"')){throw 'license version mismatch'}
          if(-not (Get-Content -Raw updater.go).Contains('const mhPublicVersionV001 = "V.56.24"')){throw 'updater version mismatch'}
          $html=Get-Content -Raw web\index.html
          if($html.Contains('/v562-text-fix.js')){throw 'runtime character patch must not be loaded'}
          $details=[regex]::Match($html,'<section class="panel detailsPanel">.*?</section>','Singleline').Value
          $ticker=[regex]::Match($html,'<section class="cleanTicker panel movingTicker".*?</section>','Singleline').Value
          if([string]::IsNullOrWhiteSpace($details)){throw 'Analysis Details section missing'}
          if([string]::IsNullOrWhiteSpace($ticker)){throw 'Moving ticker section missing'}
          foreach($id in @('detailRegime','detailTrend','detailVol','detailRisk','detailStructure','detailPressure','indAdx','indDi','indVwap','indOb','indFvg','indDiv','indSmc','indIct','indRisk','lvlEntry','lvlSl','lvlTp1','lvlTp2','lvlEq','lvlZones')){
            $needle='id="'+$id+'">&mdash;<'
            if(-not $details.Contains($needle)){throw "clean Analysis Details placeholder missing: $id"}
          }
          foreach($id in @('tickerGold','tickerBTC','tickerETH','tickerEURUSD','tickerUSDJPY','tickerGBPUSD','tickerGBPJPY')){
            $needle='id="'+$id+'">&mdash;<'
            if(-not $ticker.Contains($needle)){throw "clean ticker placeholder missing: $id"}
          }
          foreach($entity in @('&#9679;','&#8383;','&#9670;','&euro;','&yen;','&pound;')){
            if(-not $ticker.Contains($entity)){throw "Ticker entity missing: $entity"}
          }
          $app=Get-Content -Raw web\app.js
          foreach($m in @('STRICT VALIDATION PASSED','ACTIVE TRADE PRESERVED','independentMarketConsensus','feedUnavailable','referencePass>=3','structuralPass>=2','strongReference','waitForUiCommitV5623','renderConfirmationsV5624','cleanConfirmationTextV5624','renderBTCMetricsV5624','V5624_SELECTED_SYMBOL_METRICS','standardSetupV5624','bestSetupV5624')){if(-not $app.Contains($m)){throw "signal/UI safety marker missing: $m"}}
          foreach($m in @('if(n>=83)return 0.05;','if(n>=73)return 0.04;','if(n>=66)return 0.03;','if(!lotSizeEnabled)return 0.02;')){if(-not $app.Contains($m)){throw "lot mapping changed unexpectedly: $m"}}
          $main=Get-Content -Raw main.go
          foreach($m in @('normalizeHistoryPeriodV5624','BINANCE:BTCUSDT','V5624_SYMBOL_SCOPED_HISTORY_CACHE','desktopHistoryHandler')){if(-not $main.Contains($m)){throw "BTC history marker missing: $m"}}
          $css=Get-Content -Raw web\styles.css
          if(-not $css.Contains('confirmationRowsV5624')){throw 'organized confirmation rows CSS missing'}
          $ea=Get-Content -Raw ea_signal_bridge.go
          if(-not $ea.Contains('ACTIVE_TRADE_REVERSAL_LOCK')){throw 'EA reversal lock missing'}
          $fast=Get-Content -Raw ea_modes_v558.go
          if(-not $fast.Contains('FAST_ACTIVE_EXPOSURE_LOCK')){throw 'Fast Scalping exposure lock missing'}
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'Go tests failed'}

      - name: Build V.56.24 EXE installer manifest and package
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force dist,dist-installer|Out-Null
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          if($LASTEXITCODE -ne 0 -or -not(Test-Path 'dist/MH Analysis.exe')){throw 'Windows EXE build failed'}
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not(Test-Path $iscc)){choco install innosetup -y --no-progress; if($LASTEXITCODE -ne 0){throw 'Inno Setup installation failed'}}
          $src=(Resolve-Path 'dist\MH Analysis.exe').Path
          $out=(Resolve-Path dist-installer).Path
          & $iscc '/Qp' "/DMySourceExe=$src" "/DMyOutputDir=$out" '/DMyAppVersion=V.56.24' '/DMyOutputBaseFilename=MH-Analysis-Setup-V.56.24' 'installer\MHAnalysis-V01.iss'
          if($LASTEXITCODE -ne 0){throw 'installer compilation failed'}
          $installer='dist-installer\MH-Analysis-Setup-V.56.24.exe'
          if(-not(Test-Path $installer)){throw 'V.56.24 installer missing'}
          $sha=(Get-FileHash 'dist\MH Analysis.exe' -Algorithm SHA256).Hash.ToLower()
          "$sha  MH Analysis.exe"|Set-Content -Encoding ascii dist\SHA256SUMS.txt
          'V.56.24'|Set-Content -Encoding ascii dist\VERSION
          $m=[ordered]@{version='V.56.24';mandatory=$true;download_url='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%20Analysis.exe';sha256=$sha;notes='V.56.24 fixes BTCUSDT selected-symbol top data and BTC chart/history loading across supported timeframes, restores organized Confirmation/Warning rows with clean display wording, and adds a high-quality best-setup path so strong reference-backed setups are not lost while opposite-conflict, independent-consensus, active-trade and anti-random protections remain enforced. Lot-size, SL adjustment, Partial TP and Fast Scalping controls are preserved.'}|ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $PWD 'dist\update.json'),$m,(New-Object Text.UTF8Encoding($false)))
          Compress-Archive -Path 'dist\MH Analysis.exe','dist\SHA256SUMS.txt','dist\update.json','dist\VERSION',$installer -DestinationPath 'dist\MH-Analysis-V.56.24.zip' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MH-Analysis-V.56.24
          path: |
            dist/MH Analysis.exe
            dist/MH-Analysis-V.56.24.zip
            dist/SHA256SUMS.txt
            dist/update.json
            dist/VERSION
            dist-installer/MH-Analysis-Setup-V.56.24.exe
          if-no-files-found: error

      - name: Publish updater channel atomically
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pub"
          cp 'dist/MH Analysis.exe' "$RUNNER_TEMP/pub/MH Analysis.exe"
          cp dist/update.json "$RUNNER_TEMP/pub/update.json"
          cp dist/VERSION "$RUNNER_TEMP/pub/VERSION"
          cp dist/SHA256SUMS.txt "$RUNNER_TEMP/pub/SHA256SUMS.txt"
          cp 'dist-installer/MH-Analysis-Setup-V.56.24.exe' "$RUNNER_TEMP/pub/MH-Analysis-Setup-V.56.24.exe"
          git reset --hard HEAD
          git clean -fd
          git fetch origin mh-analysis-update-channel
          git checkout -B mh-analysis-update-channel origin/mh-analysis-update-channel
          cp "$RUNNER_TEMP/pub/MH Analysis.exe" './MH Analysis.exe'
          cp "$RUNNER_TEMP/pub/update.json" update.json
          cp "$RUNNER_TEMP/pub/VERSION" VERSION
          cp "$RUNNER_TEMP/pub/SHA256SUMS.txt" SHA256SUMS.txt
          cp "$RUNNER_TEMP/pub/MH-Analysis-Setup-V.56.24.exe" './MH-Analysis-Setup-V.56.24.exe'
          git add 'MH Analysis.exe' update.json VERSION SHA256SUMS.txt 'MH-Analysis-Setup-V.56.24.exe'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish MH Analysis V.56.24' || true
          git push origin mh-analysis-update-channel

      - name: Verify live V.56.24 updater channel
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Start-Sleep -Seconds 4
          $base='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/'
          $cb=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $live=(Invoke-WebRequest -UseBasicParsing ($base+'update.json?cb='+$cb)).Content|ConvertFrom-Json
          $published=(Get-Content -Raw "$env:RUNNER_TEMP\pub\update.json")|ConvertFrom-Json
          if($live.version -ne 'V.56.24'){throw "live version mismatch: $($live.version)"}
          if($live.sha256 -ne $published.sha256){throw 'live SHA mismatch'}
          $liveVersion=(Invoke-WebRequest -UseBasicParsing ($base+'VERSION?cb='+$cb)).Content.Trim()
          if($liveVersion -ne 'V.56.24'){throw "live VERSION mismatch: $liveVersion"}
          Write-Host 'LIVE V.56.24 updater verification PASSED'
