name: Publish MH Analysis V40 True MT5 Embed
on:
  push:
    branches: [v40-mt5-true-child-embed]
    paths: ['.github/workflows/publish-v40-mt5-true-embed.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mh-analysis-v40-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.2', cache: false}

      - name: Apply only V40 MT5 routing correction
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='chrome_host.go'; $s=Get-Content -Raw $p
          $old='if err := chEnsureMT5Terminal(); err != nil {'
          $new='if err := chEnsureMT5TerminalV36(); err != nil {'
          $count=([regex]::Matches($s,[regex]::Escape($old))).Count
          if($count -ne 1){throw "Expected exactly one MT5 button legacy route, found $count"}
          $s=$s.Replace($old,$new)
          [IO.File]::WriteAllText((Join-Path $PWD $p),$s,(New-Object Text.UTF8Encoding($false)))

          $u=Get-Content -Raw updater.go; $u=$u.Replace('const mhPublicVersionV001 = "V.39"','const mhPublicVersionV001 = "V.40"'); [IO.File]::WriteAllText((Join-Path $PWD 'updater.go'),$u,(New-Object Text.UTF8Encoding($false)))
          $l=Get-Content -Raw license_auth.go; $l=$l.Replace('const licAppVersion = "V.39"','const licAppVersion = "V.40"'); [IO.File]::WriteAllText((Join-Path $PWD 'license_auth.go'),$l,(New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Join-Path $PWD 'VERSION'),'V.40'+[Environment]::NewLine,(New-Object Text.UTF8Encoding($false)))

      - name: Verify true-child MT5 path and all existing locks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ch=Get-Content -Raw chrome_host.go; $mt5=Get-Content -Raw mt5_embed_v36.go; $main=Get-Content -Raw main.go; $native=Get-Content -Raw native_settings.go; $wv=Get-Content -Raw webview2_host.go; $app=Get-Content -Raw web/app.js
          if($ch -notmatch 'if err := chEnsureMT5TerminalV36\(\); err != nil'){throw 'MT5 button is not routed to verified embed implementation'}
          if($mt5 -notmatch 'V36_VERIFIED_EMBED'){throw 'verified embed implementation missing'}
          if($mt5 -notmatch 'chSetParent\.Call\(hwnd, hostHWND\)'){throw 'SetParent missing'}
          if($mt5 -notmatch 'parent, _, _ := v36GetParent\.Call\(hwnd\)'){throw 'GetParent verification missing'}
          if($mt5 -notmatch 'if parent != hostHWND \{ return false \}'){throw 'true child-parent assertion missing'}
          if($mt5 -notmatch 'style \|= chWSChild \| chWSVisible'){throw 'WS_CHILD conversion missing'}
          if($mt5 -notmatch 'V39_MT5_RESHOW'){throw 'V39 repeated-click restore regressed'}
          if($main -notmatch 'WhatsAppLink2 string'){throw 'V39 dual WhatsApp regressed'}
          if($native -notmatch 'WhatsApp Signal Link / Number 2'){throw 'V39 second Signal Link UI regressed'}
          if($wv -notmatch 'V36_TRUE_PERSISTENT_WEBVIEWS'){throw 'persistent WebViews regressed'}
          if($app -notmatch 'V36_CANONICAL_SIGNAL_FANOUT'){throw 'signal fanout regressed'}
          if((Get-Content -Raw VERSION).Trim() -ne 'V.40'){throw 'version is not V.40'}
          node --check web/app.js
          gofmt -w chrome_host.go mt5_embed_v36.go updater.go license_auth.go
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'V40 verification failed'}

      - name: Build and verify V40 installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'; New-Item -ItemType Directory -Force dist|Out-Null
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          if($LASTEXITCODE -ne 0){throw 'V40 build failed'}
          $iss=Get-Content -Raw 'installer\MH-Analysis-V27.iss'; $iss=$iss -replace 'AppVersion=[^\r\n]+','AppVersion=40.0.0'; $iss=$iss -replace 'OutputBaseFilename=[^\r\n]+','OutputBaseFilename=MH-Analysis-Setup-V40'; [IO.File]::WriteAllText((Join-Path $PWD 'installer\MH-Analysis-V40.iss'),$iss,(New-Object Text.UTF8Encoding($false)))
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'; if(-not(Test-Path $iscc)){choco install innosetup --no-progress -y}; & $iscc 'installer\MH-Analysis-V40.iss'
          if($LASTEXITCODE -ne 0 -or -not(Test-Path 'dist\MH-Analysis-Setup-V40.exe')){throw 'V40 installer failed'}
          $target=Join-Path $env:RUNNER_TEMP 'MHV40Verify'; $proc=Start-Process (Join-Path $PWD 'dist\MH-Analysis-Setup-V40.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR='+$target)) -PassThru -Wait
          if($proc.ExitCode -ne 0 -or -not(Test-Path (Join-Path $target 'MH Analysis.exe'))){throw 'V40 install verification failed'}

      - name: Publish V40 release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Continue'; gh release delete v40 --yes --cleanup-tag 2>$null; $global:LASTEXITCODE=0; $ErrorActionPreference='Stop'
          gh release create v40 'dist/MH-Analysis-Setup-V40.exe' 'dist/MH Analysis.exe' --target $env:GITHUB_SHA --title 'MH Analysis V.40' --notes 'V.40 surgical correction: MT5 System button now calls the already-present verified true-child embedding implementation instead of the legacy external-window path. All V.39 behavior retained.'
          if($LASTEXITCODE -ne 0){throw 'V40 release failed'}

      - name: Publish and verify V40 update channel
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; $d=Join-Path $env:RUNNER_TEMP 'v40-update'; New-Item -ItemType Directory -Force $d|Out-Null
          Copy-Item 'dist\MH Analysis.exe' (Join-Path $d 'MH Analysis.exe'); $sha=(Get-FileHash 'dist\MH Analysis.exe' -Algorithm SHA256).Hash.ToLower(); $m=[ordered]@{version='V.40';mandatory=$true;download_url='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%20Analysis.exe';sha256=$sha;notes='MANDATORY V.40 - MT5 System now uses verified true child-window embedding inside MH Analysis; V.39 behavior retained.'}|ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $d 'update.json'),$m,(New-Object Text.UTF8Encoding($false))); [IO.File]::WriteAllText((Join-Path $d 'VERSION'),'V.40'+[Environment]::NewLine,(New-Object Text.UTF8Encoding($false)))
          git checkout --orphan __v40_update; git rm -rf . 2>$null; Get-ChildItem -Force|?{$_.Name -ne '.git'}|Remove-Item -Recurse -Force; Copy-Item (Join-Path $d '*') .; git add .; git commit -m 'Publish MH Analysis V.40 update channel'; git push --force origin HEAD:mh-analysis-update-channel
          Start-Sleep -Seconds 3; $stamp=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds(); $raw=(Invoke-WebRequest -UseBasicParsing -Headers @{'Cache-Control'='no-cache'} -Uri "https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/update.json?verify=$stamp").Content; $live=$raw|ConvertFrom-Json; if($live.version -ne 'V.40'){throw 'live manifest is not V.40'}; $tmp=Join-Path $env:RUNNER_TEMP 'MH-V40-live.exe'; Invoke-WebRequest -UseBasicParsing -Headers @{'Cache-Control'='no-cache'} -Uri ($live.download_url+'?verify='+$stamp) -OutFile $tmp; if((Get-FileHash $tmp -Algorithm SHA256).Hash.ToLower() -ne $live.sha256.ToLower()){throw 'live V40 SHA mismatch'}
