name: Publish MH Analysis V46 WhatsApp Group Resolve
on:
  push:
    branches:
      - v46-whatsapp-group-resolve
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Set V46 identity
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $u=Get-Content -Raw updater.go
          $u=[regex]::Replace($u,'const mhPublicVersionV001 = "V\.[^"]+"','const mhPublicVersionV001 = "V.46"',1)
          [IO.File]::WriteAllText((Join-Path $PWD 'updater.go'),$u,(New-Object Text.UTF8Encoding($false)))
          $l=Get-Content -Raw license_auth.go
          $l=[regex]::Replace($l,'const licAppVersion = "[^"]+"','const licAppVersion = "V.46"',1)
          [IO.File]::WriteAllText((Join-Path $PWD 'license_auth.go'),$l,(New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Join-Path $PWD 'VERSION'),'V.46'+[Environment]::NewLine,(New-Object Text.UTF8Encoding($false)))
      - name: Verify and build V46
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $wv=Get-Content -Raw webview2_host.go
          $ea=Get-Content -Raw ea_signal_bridge.go
          $mt=Get-Content -Raw mt5_embed_v36.go
          if($wv -match 'web\.whatsapp\.com/accept\?code='){throw 'old failed accept route still present'}
          if($ea -notmatch 'eaPublishMu'){throw 'EA reliability fix missing'}
          if($mt -notmatch 'V45_SINGLE_TASKBAR_MT5'){throw 'single taskbar fix missing'}
          gofmt -w webview2_host.go updater.go license_auth.go
          go test ./...
          New-Item -ItemType Directory -Force dist|Out-Null
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          if($LASTEXITCODE -ne 0 -or -not(Test-Path 'dist/MH Analysis.exe')){throw 'V46 build failed'}
      - name: Publish mandatory V46 manifest
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $sha=(Get-FileHash 'dist/MH Analysis.exe' -Algorithm SHA256).Hash.ToLower()
          $d=Join-Path $env:RUNNER_TEMP 'v46';New-Item -ItemType Directory -Force $d|Out-Null
          Copy-Item 'dist/MH Analysis.exe' (Join-Path $d 'MH Analysis.exe')
          $m=[ordered]@{version='V.46';mandatory=$true;download_url='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%20Analysis.exe';sha256=$sha;notes='MANDATORY V.46 - WhatsApp group sending correction while preserving V45 MT5 and EA fixes.'}|ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $d 'update.json'),$m,(New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Join-Path $d 'VERSION'),'V.46'+[Environment]::NewLine,(New-Object Text.UTF8Encoding($false)))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan __v46_update
          git rm -rf . 2>$null
          Get-ChildItem -Force|Where-Object{$_.Name -ne '.git'}|Remove-Item -Recurse -Force
          Copy-Item (Join-Path $d '*') .
          git add .
          git commit -m 'Publish MH Analysis V.46 mandatory update'
          git push --force origin HEAD:mh-analysis-update-channel
