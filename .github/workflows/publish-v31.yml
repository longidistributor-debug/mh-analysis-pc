name: Publish MH Analysis V31 Verified Hotfix
on:
  workflow_dispatch:
  push:
    branches: [v31-ui-navigation-security-hotfix]
    paths:
      - '.github/workflows/publish-v31.yml'
      - 'scripts/v31_patch.py'
      - 'scripts/v31_verify.py'
permissions:
  contents: write
concurrency:
  group: mh-analysis-v31-release
  cancel-in-progress: true
jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.2', cache: false}
      - name: Reapply retained V28-V30 fixes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python scripts/v28_patch.py
          python scripts/v29_regression_recovery.py
          python scripts/v29_remove_visibility_gates.py
          python scripts/v30_complete_fixes.py
          python scripts/v30_post_patch.py
          if($LASTEXITCODE -ne 0){throw 'Retained fixes failed'}
      - name: Apply V31 only after retained fixes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python scripts/v31_patch.py
          if($LASTEXITCODE -ne 0){throw 'V31 patch failed'}
          gofmt -w license_auth.go updater.go main.go chrome_host.go webview2_host.go records_mt5_local.go mt5_prefill.go ea_signal_bridge.go
      - name: Full no-regression guards
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python scripts/v30_verify.py
          if($LASTEXITCODE -ne 0){throw 'Retained V30 regression guard failed'}
          python scripts/v31_verify.py
          if($LASTEXITCODE -ne 0){throw 'V31 regression guard failed'}
          node --check web/app.js
          node --check web/v03.js
          node --check web/records.js
          node --check web/auth.js
          node --check web/v31.js
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'Go tests failed'}
      - name: Build V31 Windows EXE
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o 'dist/MH Analysis.exe' .
          if($LASTEXITCODE -ne 0 -or -not(Test-Path 'dist/MH Analysis.exe')){throw 'V31 EXE build failed'}
      - name: Build and silent-verify V31 installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $iss=Get-Content -Raw 'installer\MH-Analysis-V27.iss'
          $iss=$iss -replace 'AppVersion=[^\r\n]+','AppVersion=31.0.0'
          $iss=$iss -replace 'OutputBaseFilename=[^\r\n]+','OutputBaseFilename=MH-Analysis-Setup-V31'
          [IO.File]::WriteAllText((Join-Path $PWD 'installer\MH-Analysis-V31.iss'),$iss,(New-Object Text.UTF8Encoding($false)))
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not(Test-Path $iscc)){choco install innosetup --no-progress -y}
          & $iscc 'installer\MH-Analysis-V31.iss'
          if($LASTEXITCODE -ne 0 -or -not(Test-Path 'dist\MH-Analysis-Setup-V31.exe')){throw 'V31 installer build failed'}
          $target=Join-Path $env:RUNNER_TEMP 'MHV31Verify'
          $p=Start-Process (Join-Path $PWD 'dist\MH-Analysis-Setup-V31.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR='+$target)) -PassThru -Wait
          if($p.ExitCode -ne 0 -or -not(Test-Path (Join-Path $target 'MH Analysis.exe'))){throw 'V31 installer verification failed'}
          $exeSha=(Get-FileHash 'dist\MH Analysis.exe' -Algorithm SHA256).Hash.ToLower()
          $setupSha=(Get-FileHash 'dist\MH-Analysis-Setup-V31.exe' -Algorithm SHA256).Hash.ToLower()
          "${exeSha}  MH Analysis.exe`n${setupSha}  MH-Analysis-Setup-V31.exe" | Set-Content -Encoding ascii 'dist\SHA256SUMS.txt'
          "MH_EXE_SHA=$exeSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish V31 GitHub release
        shell: powershell
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          $ErrorActionPreference='Continue'
          gh release delete v31 --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE=0
          $ErrorActionPreference='Stop'
          gh release create v31 'dist/MH-Analysis-Setup-V31.exe' 'dist/MH Analysis.exe' 'dist/SHA256SUMS.txt' --target '${{ github.sha }}' --title 'MH Analysis V.31' --notes 'V.31 verified hotfix: single-scroll login and non-overlapping credits; one-click WhatsApp plus Signal Link; first-click Records; embedded MT5 startup without blank/external visible workflow; exact V.31 (Late - CH Shaukat Ali) labels; external WhatsApp Support; RSI rounded boundary; clean footer; Windows capture exclusion and text-copy/zoom restrictions. Retains V28 identity, V29 persistence and V30 signal/EA/WhatsApp fixes.'
          if($LASTEXITCODE -ne 0){throw 'V31 release publish failed'}
      - name: Publish V31 release branch and mandatory updater
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $release=Join-Path $env:RUNNER_TEMP 'v31-release'; New-Item -ItemType Directory -Force $release|Out-Null
          Copy-Item 'dist\MH Analysis.exe' (Join-Path $release 'MH Analysis.exe')
          Copy-Item 'dist\MH-Analysis-Setup-V31.exe' (Join-Path $release 'MH-Analysis-Setup-V31.exe')
          Copy-Item 'dist\SHA256SUMS.txt' (Join-Path $release 'SHA256SUMS.txt')
          git checkout --orphan __v31_release
          git rm -rf . 2>$null
          Get-ChildItem -Force|?{$_.Name -ne '.git'}|Remove-Item -Recurse -Force
          Copy-Item (Join-Path $release '*') .
          Set-Content VERSION 'V.31' -Encoding ascii
          git add .; git commit -m 'Publish verified MH Analysis V.31 installer'; git push --force origin HEAD:v31-release
          if($LASTEXITCODE -ne 0){throw 'V31 release branch failed'}
          $exeSource=Join-Path $release 'MH Analysis.exe'; $sha=(Get-FileHash $exeSource -Algorithm SHA256).Hash.ToLower()
          $upd=Join-Path $env:RUNNER_TEMP 'v31-update'; New-Item -ItemType Directory -Force $upd|Out-Null
          Copy-Item $exeSource (Join-Path $upd 'MH Analysis.exe')
          $manifest=[ordered]@{version='V.31';mandatory=$true;download_url='https://raw.githubusercontent.com/longidistributor-debug/mh-analysis-pc/mh-analysis-update-channel/MH%20Analysis.exe';sha256=$sha;notes='MANDATORY V.31 - verified UI/navigation/embedded MT5/security hotfix while retaining V28-V30 fixes.'}|ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $upd 'update.json'),$manifest,(New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Join-Path $upd 'VERSION'),'V.31'+[Environment]::NewLine,(New-Object Text.UTF8Encoding($false)))
          git checkout --orphan __v31_update
          git rm -rf . 2>$null
          Get-ChildItem -Force|?{$_.Name -ne '.git'}|Remove-Item -Recurse -Force
          Copy-Item (Join-Path $upd '*') .
          git add .; git commit -m 'Publish MH Analysis V.31 mandatory update'; git push --force origin HEAD:mh-analysis-update-channel
          if($LASTEXITCODE -ne 0){throw 'V31 manifest publish failed'}
