name: Final trade pipeline audit once

on:
  push:
    branches: [v56.3-release]
    paths:
      - '.github/workflows/final-trade-pipeline-audit-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v56.3-release
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Apply final execution-safety fixes
        shell: python
        run: |
          from pathlib import Path

          app = Path('web/app.js')
          s = app.read_text(encoding='utf-8')
          old = """    if(d.signal){const obj={signal:d.signal,state:d.signal.reconfirmed?'RECONFIRMED':'PENDING',candles:c};active.set(k,obj);persistActiveSignal(k,obj)}else if(d._reversalBlocked&&prev){const obj={signal:prev,state:'REVERSAL WARNING',candles:c};active.set(k,obj);persistActiveSignal(k,obj)}else{active.delete(k);persistActiveSignal(k,null)}"""
          new = """    const mt5ExistingState=prev?await readMT5ActiveStateV552(symbol):null;
    if(d.signal){const obj={signal:d.signal,state:d.signal.reconfirmed?'RECONFIRMED':'PENDING',candles:c};active.set(k,obj);persistActiveSignal(k,obj)}else if(d._reversalBlocked&&prev){const obj={signal:prev,state:'REVERSAL WARNING',candles:c};active.set(k,obj);persistActiveSignal(k,obj)}else if(prev&&mt5ExistingState?.active){const obj={signal:prev,state:'ACTIVE • NEW SIGNAL BLOCKED',candles:c};active.set(k,obj);persistActiveSignal(k,obj);d._activeSignalPreserved=true;d.warnings=[`ACTIVE TRADE PRESERVED: no new order was issued (${d.executionGate?.reason||d.newsRisk?.label||'no validated fresh edge'}), while MT5 still reports active exposure.`,...(d.warnings||[])]}else{active.delete(k);persistActiveSignal(k,null)}"""
          if new not in s:
              if old not in s:
                  raise SystemExit('app active-preservation anchor missing')
              s = s.replace(old, new, 1)
          app.write_text(s, encoding='utf-8')

          ea = Path('ea_signal_bridge.go')
          g = ea.read_text(encoding='utf-8')
          anchor = '''\tif q.Entry<=0||q.SL<=0||q.TP<=0 { w.WriteHeader(http.StatusBadRequest);_=json.NewEncoder(w).Encode(map[string]any{"error":"entry/sl/tp must be positive"});return }\n\tif q.Lot<0 {q.Lot=0}; if q.Expiry<0 {q.Expiry=0}\n'''
          repl = '''\tif q.Entry<=0||q.SL<=0||q.TP<=0 { w.WriteHeader(http.StatusBadRequest);_=json.NewEncoder(w).Encode(map[string]any{"error":"entry/sl/tp must be positive"});return }\n\tif q.Lot<0 {q.Lot=0}; if q.Expiry<0 {q.Expiry=0}\n\t// Final server-side reversal safety: UI validation remains primary, but a direct/stale client\n\t// cannot publish an opposite-direction order while MT5 reports active exposure.\n\tif trades, activeDir, activeErr := activeExposureFor(q.Symbol); activeErr == nil && len(trades) > 0 {\n\t\treqDir := eaDirection(q.Type)\n\t\tif activeDir == "MIXED" || (activeDir != "" && reqDir != "" && activeDir != reqDir) {\n\t\t\tw.WriteHeader(http.StatusConflict)\n\t\t\t_ = json.NewEncoder(w).Encode(map[string]any{"error":"active MT5 exposure blocks opposite-direction handoff","code":"ACTIVE_TRADE_REVERSAL_LOCK","blocked":true,"active_direction":activeDir,"requested_direction":reqDir})\n\t\t\treturn\n\t\t}\n\t}\n'''
          if 'Final server-side reversal safety' not in g:
              if anchor not in g:
                  raise SystemExit('EA send validation anchor missing')
              g = g.replace(anchor, repl, 1)
          ea.write_text(g, encoding='utf-8')

          fast = Path('ea_modes_v558.go')
          f = fast.read_text(encoding='utf-8')
          f_anchor = '''    if q.Symbol!="XAUUSD" && q.Symbol!="BTCUSD" { http.Error(w,"unsupported symbol",400); return }\n    if q.Type!="FAST_BUY" && q.Type!="FAST_SELL" { http.Error(w,"unsupported fast type",400); return }\n    if q.Entry<=0 { http.Error(w,"entry must be positive",400); return }\n'''
          f_repl = '''    if q.Symbol!="XAUUSD" && q.Symbol!="BTCUSD" { http.Error(w,"unsupported symbol",400); return }\n    if q.Type!="FAST_BUY" && q.Type!="FAST_SELL" { http.Error(w,"unsupported fast type",400); return }\n    if q.Entry<=0 { http.Error(w,"entry must be positive",400); return }\n    // Fast Scalping is isolated: never start a new scalp while any normal/fast exposure\n    // for this symbol is still reported active by the MT5 decoder.\n    if trades, _, err := activeExposureFor(q.Symbol); err == nil && len(trades) > 0 {\n        w.WriteHeader(http.StatusConflict)\n        _ = json.NewEncoder(w).Encode(map[string]any{"error":"active MT5 exposure blocks new fast scalp","code":"FAST_ACTIVE_EXPOSURE_LOCK","blocked":true})\n        return\n    }\n'''
          if 'FAST_ACTIVE_EXPOSURE_LOCK' not in f:
              if f_anchor not in f:
                  raise SystemExit('fast send validation anchor missing')
              f = f.replace(f_anchor, f_repl, 1)
          fast.write_text(f, encoding='utf-8')
      - name: Validate complete current runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem -Path . -Filter *.go -File | ForEach-Object { gofmt -w $_.FullName }
          foreach($js in @('web/app.js','web/runtime-fixes.js','web/auth.js','web/v03.js','web/v31.js','web/v558-fast.js','web/v560-mode-guard.js','web/v562-text-fix.js','web/update-v001.js','web/ea-reversal-guard.js')) { node --check $js; if($LASTEXITCODE -ne 0){throw "JavaScript validation failed: $js"} }
          go test ./...
          if($LASTEXITCODE -ne 0){throw 'Go tests failed'}
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          go build -trimpath -o "$env:RUNNER_TEMP\mh-analysis-audit.exe" .
          if($LASTEXITCODE -ne 0 -or -not(Test-Path "$env:RUNNER_TEMP\mh-analysis-audit.exe")){throw 'Windows build failed'}
          $app=Get-Content -Raw web\app.js
          foreach($m in @('STRICT VALIDATION PASSED','ACTIVE TRADE PRESERVED','independentMarketConsensus','feedUnavailable','referencePass>=5')){if(-not $app.Contains($m)){throw "signal gate marker missing: $m"}}
          $ea=Get-Content -Raw ea_signal_bridge.go
          if(-not $ea.Contains('ACTIVE_TRADE_REVERSAL_LOCK')){throw 'backend reversal lock missing'}
          $fast=Get-Content -Raw ea_modes_v558.go
          if(-not $fast.Contains('FAST_ACTIVE_EXPOSURE_LOCK')){throw 'fast exposure lock missing'}
      - name: Commit verified fixes and remove audit workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/final-trade-pipeline-audit-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app.js ea_signal_bridge.go ea_modes_v558.go .github/workflows/final-trade-pipeline-audit-once.yml
          git commit -m 'Finalize trade pipeline safety and verification'
          git push origin HEAD:v56.3-release
