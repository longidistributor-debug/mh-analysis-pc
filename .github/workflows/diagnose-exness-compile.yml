name: Diagnose Exness Compile
on:
  push:
    branches: [exness-compile-debug]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Apply patches and capture compile log
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          python desktop/header_center_layout_patch.py | Out-Host
          python desktop/records_feature_patch.py | Out-Host
          python desktop/exness_feature_patch.py | Out-Host
          python desktop/exness_login_focus_flicker_patch.py | Out-Host
          gofmt -w main.go chrome_host.go records.go exness_bridge.go dpi_windows.go
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0'
          $log = (& go build -trimpath -ldflags='-H=windowsgui -s -w' -o diagnostic.exe . 2>&1 | Out-String)
          $code=$LASTEXITCODE
          "EXIT=$code`r`n$log" | Set-Content -Encoding UTF8 compile-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compile-diagnostic.txt
          git commit -m 'Store Exness compile diagnostic' || echo nochange
          git push origin HEAD:exness-compile-debug
